<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f4f0">
<meta name="referrer" content="no-referrer">
<title>Quiet Glass · 个人信息空间</title>
<style>/* Quiet Glass · tokens · shared source */
:root{
 --canvas:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--secondary:#86868b;--faint:#e8e8ed;--surface:#f0f0f2;
 --line:rgba(0,0,0,.08);--accent:#0066cc;--accent-soft:#edf4ff;--success:#248a3d;--alert:#b45309;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 --gap:24px;--card-radius:20px;--image-radius:12px;--panel-radius:24px;
 --shadow:0 1px 2px rgba(0,0,0,.025),0 4px 16px rgba(0,0,0,.035);
 --shadow-hover:0 2px 5px rgba(0,0,0,.04),0 10px 24px rgba(0,0,0,.07);
 --glass:rgba(255,255,255,.76);--glass-thick:rgba(255,255,255,.94);
 --ease:cubic-bezier(.2,.75,.25,1);--fast:140ms;--base:220ms;--layout:320ms;
}

/* Quiet Glass · base · shared source */
*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;background:var(--canvas);min-height:100vh}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
button:disabled{opacity:.4;cursor:default}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,textarea,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
input,textarea{border:1px solid var(--line);background:rgba(20,25,29,.035);outline:0;border-radius:14px;padding:12px 14px;color:var(--ink)}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--secondary)}
::selection{background:#d8e9ff;color:var(--ink)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{flex:0 0 auto;vertical-align:middle;pointer-events:none}
main{width:100%;padding:48px 96px 112px 32px;margin:0 auto;min-height:100vh}
.feed-grid{position:relative;width:100%;min-height:80vh}
h2,p{margin:0}
.empty-card{position:relative;max-width:450px;margin:15vh auto 0;padding:40px 30px;text-align:center;background:#ffffffe8;border:1px solid white;border-radius:24px;box-shadow:var(--shadow)}
.empty-icon{display:block;color:var(--muted);margin-bottom:20px}
.empty-card h2{font-size:19px}
.empty-card p{color:var(--muted);font-size:13px;margin:13px 0 19px;line-height:1.85}

/* Quiet Glass · controls · shared source */
/* Translucency belongs to the floating tools, not the content surface. */
.glass{position:relative;background:var(--glass);border:1px solid rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2)}
.icon-button{width:44px;height:44px;min-width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;position:relative;transition:background var(--fast),transform var(--fast),color var(--fast)}
.icon-button:hover{background:var(--surface)}
.icon-button:active{transform:scale(.95)}
.icon-button.active{background:var(--accent-soft);color:var(--accent)}
.icon-button.active svg{fill:rgba(0,102,204,.08)}
#dock{position:fixed;right:26px;bottom:26px;z-index:45;display:flex;align-items:center;justify-content:center;width:64px;height:64px}
#orb{width:56px;height:56px;min-width:56px;border-radius:50%;overflow:hidden;background:var(--glass);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.14);transition:transform .24s var(--ease),box-shadow .24s}
#orb .icon{width:23px;height:23px}
#orb:hover{transform:scale(1.04);background:rgba(255,255,255,.92)}
#orb.drop-hot{transform:scale(1.2);color:var(--accent);box-shadow:0 0 0 8px rgba(0,102,204,.12),0 8px 28px rgba(0,0,0,.14)}
.dock-tools{position:absolute;bottom:72px;right:6px;display:flex;flex-direction:column;gap:8px;opacity:0;visibility:hidden;transform:translateY(10px) scale(.96);transform-origin:bottom;transition:opacity 230ms var(--ease),transform 230ms var(--ease),visibility 230ms;padding:8px 0}
.dock-tools .icon-button{background:var(--glass);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.dock-tools .icon-button:hover{background:var(--card)}
#dock.is-open .dock-tools,#dock:focus-within .dock-tools{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
#dock.filter-active:after{content:"";position:absolute;right:10px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--card);pointer-events:none}
#new-count{position:absolute;bottom:7px;right:75px;min-width:44px;height:44px;border-radius:22px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
#new-count[hidden]{display:none}
#selection-bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:43;border-radius:30px;display:flex;align-items:center;padding:4px 7px;gap:8px;max-width:calc(100vw - 110px)}
#selection-bar[hidden]{display:none}
#selection-bar .selection-count{font-size:13px;padding:0 8px;white-space:nowrap}
#selection-bar .icon-button{width:44px;min-width:44px;height:44px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 130px);padding:10px 16px;border-radius:28px;z-index:120;display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.12);background:var(--glass-thick);border:1px solid rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
#toast[hidden]{display:none}
#toast .icon-button{width:44px;height:44px;min-width:44px}
#toast-text{white-space:normal}
.filter-kind{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;padding:0;min-width:44px;min-height:68px;font-size:12px;color:var(--muted);border-radius:10px}
.filter-kind .kind-disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);transition:background 180ms,color 180ms}
.filter-kind.active{color:var(--accent)}
.filter-kind.active .kind-disc{background:var(--accent-soft);color:var(--accent)}
.filter-kind:hover .kind-disc{background:var(--faint)}
.filter-kind.active:hover .kind-disc{background:var(--accent-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag-chip{min-height:44px;padding:8px 14px;border-radius:22px;background:var(--surface);color:var(--ink);font-size:13px;border:1px solid transparent;transition:background var(--fast),color var(--fast)}
.tag-chip:hover{background:var(--faint)}
.tag-chip.active{background:var(--accent-soft);color:var(--accent)}
.text-button{background:transparent;min-height:44px;padding:8px 12px;font-size:13px;border-radius:12px;color:var(--ink);transition:background var(--fast)}
.text-button:hover{background:var(--surface)}
.solid-button{background:var(--accent);color:#fff;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:500;min-height:44px;transition:filter var(--fast),transform var(--fast)}
.solid-button:hover{filter:brightness(1.08)}
.solid-button:active{transform:scale(.98)}
.toggle{width:48px;height:44px;border-radius:16px;background:transparent;position:relative;flex-shrink:0}
.toggle:after{content:"";position:absolute;inset:9px 2px;border-radius:16px;background:#d1d1d6;transition:background 150ms}
.toggle:before{content:"";position:absolute;width:22px;height:22px;left:4px;top:11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 150ms;z-index:1}
.toggle[aria-checked=true]:after{background:var(--accent)}
.toggle[aria-checked=true]:before{transform:translateX(18px)}

/* Quiet Glass · cards · shared source
 * Content stays on opaque white surfaces. Color communicates an action or state.
 * Heights follow content; the layout engine owns column widths and placement.
 */
.feed-card{
 position:absolute;left:0;top:0;width:344px;background:var(--card);
 border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);
 transition:box-shadow var(--base),border-color var(--base);isolation:isolate;overflow:hidden;
}
.feed-card{cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.feed-card:hover,.feed-card:focus-within{border-color:rgba(0,0,0,.14);box-shadow:var(--shadow-hover)}
.feed-card:focus{outline:none}
.feed-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.feed-card:after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid transparent;pointer-events:none;transition:border-color var(--base)}
.card-body{padding:20px}
.feed-card h2{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.4;white-space:normal;color:var(--ink)}
.card-title-button{
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
 width:100%;min-height:44px;padding:0;text-align:left;background:none;font:inherit;
 letter-spacing:inherit;white-space:normal;line-height:inherit;border-radius:4px;
}
.feed-card p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:14px;line-height:1.55;color:var(--muted);margin-top:8px;white-space:normal}
.card-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;line-height:1.5}
.card-meta>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta>.icon{flex:0 0 auto;color:var(--secondary)}
.top-meta{min-height:18px;margin-bottom:10px;padding-right:32px}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:18px;margin-top:16px;color:var(--muted);font-size:12px;line-height:1.5}
.card-footer>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reading-state{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.progress-ring{display:inline-flex;flex:0 0 auto;color:var(--accent)}
.progress-ring svg{width:100%;height:100%}
.progress-ring circle:last-child{transition:stroke-dashoffset 300ms var(--ease)}

/* One image treatment across articles and media. */
.card-image-wrap{position:relative;display:block;width:calc(100% - 16px);padding:0;margin:8px 8px 0;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface);text-align:left}
.card-image{display:block;width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;transition:transform 500ms var(--ease)}
.card-image-wrap:focus-visible{outline-offset:-4px}
.feed-card:hover .card-image{transform:scale(1.018)}
.form-image .card-body,.type-media .card-body{padding-top:16px}
.form-image .card-footer,.type-media .card-footer{margin-top:12px}
.play-mark{position:absolute;left:12px;bottom:12px;display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.8);border-radius:50%;color:var(--ink);background:rgba(255,255,255,.9);backdrop-filter:blur(14px)}
.play-mark svg{margin-left:2px}
.media-length{position:absolute;right:12px;bottom:20px;padding:3px 8px;border-radius:6px;color:#fff;background:rgba(0,0,0,.5);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}

/* Secondary actions appear on hover or focus, while direct actions stay visible. */
.card-actions{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:4px;z-index:3}
.card-more-trigger{color:var(--secondary);background:transparent;opacity:0;visibility:hidden;transition:opacity var(--fast),background var(--fast),color var(--fast)}
.feed-card:hover .card-more-trigger,.feed-card:focus-within .card-more-trigger,.feed-card.tools-open .card-more-trigger{opacity:1;visibility:visible}
.card-more-trigger:hover,.feed-card.tools-open .card-more-trigger{color:var(--ink);background:var(--surface)}
.form-image>.card-actions .card-more-trigger,.type-media>.card-actions .card-more-trigger{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.feed-card.tools-open{overflow:visible;z-index:6}
.card-more-menu{position:absolute;right:8px;top:58px;display:flex;flex-direction:column;width:min(222px,calc(100% - 16px));padding:5px;border:1px solid var(--line);border-radius:16px;z-index:5;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.14)}
.card-menu-item{position:relative;display:flex;align-items:center;gap:11px;min-height:44px;width:100%;padding:10px 12px;border-radius:10px;background:none;text-align:left;font-size:13px;line-height:1.5}
.card-menu-item:hover,.card-menu-item:focus-visible{background:var(--surface)}
.card-menu-item>.icon{color:var(--muted)}
.selected-tick{position:absolute;left:12px;top:12px;display:none;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.94);z-index:4}
.feed-card.is-selected:after{border-color:var(--accent)}
.feed-card.is-selected .selected-tick{display:grid}
.feed-card.is-selected:not(.form-image):not(.type-media) .top-meta{padding-left:24px}
.feed-card.is-selected:is(.type-task,.type-insight,.type-digest,.type-suggestion) .card-body>h2{padding-left:24px}
.feed-card.is-selected .reminder-status{padding-left:24px}
.feed-card.is-selected .completed-body{padding-top:34px}
.feed-card.is-read .card-image{filter:saturate(.88)}
.feed-card.is-read h2{color:var(--muted)}
.feed-card.is-drag-source{opacity:.32;box-shadow:none}

/* Quotes change typography, not the surface palette. */
.form-quote .top-meta{margin-bottom:12px}
.quote-mark{color:var(--secondary);margin-bottom:8px}
.form-quote h2{font-family:var(--font);font-size:22px;font-weight:500;line-height:1.55;letter-spacing:0}
.form-quote .card-title-button{-webkit-line-clamp:3}
.form-quote .card-footer{margin-top:16px}

/* Calendar, attachments and tasks retain only their useful structure. */
.event-meta{color:var(--muted)}
.event-date{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:12px;line-height:1.5}
.event-date>span{color:var(--secondary)}
.event-time{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:28px;line-height:1.25;font-weight:500;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.event-time span{font-size:18px;font-weight:400;color:var(--secondary)}
.event-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.avatars{display:flex}
.avatar{display:grid;place-items:center;width:28px;height:28px;margin-left:-5px;border:2px solid var(--card);border-radius:50%;font-size:10px;color:var(--muted);background:var(--surface)}
.avatar:first-child{margin-left:0}
.tiny-muted{font-size:12px;color:var(--muted)}
.attachment{display:flex;align-items:center;gap:9px;margin-top:14px;padding:0;min-height:32px;font-size:12px;color:var(--muted)}
.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment>.icon{flex:0 0 auto;color:var(--secondary)}
.attachment>.icon:last-child{color:var(--accent)}
.checklist{margin-top:8px}
.check-item{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:8px 0;background:none;text-align:left;font-size:14px;line-height:1.5}
.check-item>span:last-child{min-width:0;overflow-wrap:anywhere}
.check-dot{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border:1.2px solid #b8b8bd;border-radius:50%;transition:background var(--base),border-color var(--base)}
.check-item:hover .check-dot{border-color:var(--accent)}
.check-item.is-done{color:var(--secondary)}
.check-item.is-done>span:last-child{text-decoration:line-through;text-decoration-color:#c7c7cc}
.check-item.is-done .check-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.type-task:not(.is-complete) .card-body>h2,.type-suggestion .card-body>h2{padding-right:32px}
.type-task .card-footer{margin-top:12px}
.task-overflow{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.task-count{color:var(--ink);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.task-count>span{color:var(--muted);font-weight:400}
.completed-body{display:flex;align-items:center;gap:12px;padding:20px}
.completed-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--success);background:var(--surface);flex:0 0 auto}
.completed-body>div{min-width:0;flex:1}
.completed-body h2{margin-top:0;padding-right:32px;font-size:16px;color:var(--muted)}
.completed-body .card-title-button{min-height:44px}
.eyebrow{font-size:12px;line-height:1.5;font-weight:400;color:var(--muted)}

/* Live data and related content use whitespace instead of nested cards. */
.type-insight h2,.type-digest h2{padding-right:32px}
.reading-figure{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0 0}
.reading-figure strong{font-size:44px;line-height:1.15;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.type-insight p{margin-top:6px;font-size:12px}
.stats-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.stats-trio div{display:flex;flex-direction:column}
.stats-trio b{font-size:32px;line-height:1.2;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stats-trio span{margin-top:6px;font-size:12px;color:var(--muted)}
.linked-cards{display:flex;flex-direction:column;margin-top:12px}
.linked-card{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 0;border-radius:8px;background:none;text-align:left;font-size:13px;color:var(--ink);transition:color var(--fast),background var(--fast)}
.linked-card+.linked-card{border-top:1px solid var(--line);border-radius:0}
.linked-card:hover{color:var(--accent);background:var(--surface)}
.linked-card-icon{display:grid;place-items:center;width:20px;flex:0 0 20px;color:var(--secondary)}
.linked-card>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked-card>.icon:last-child{flex:0 0 auto;color:var(--secondary)}
.suggestion-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
.suggestion-action{color:var(--accent);background:var(--accent-soft)}
.suggestion-action:hover{background:#dceaff}

/* A reminder is a compact action, not an alert-colored panel. */
.type-reminder .card-body{padding:18px 20px 12px}
.reminder-status{display:flex;align-items:center;gap:7px;min-height:18px;margin-bottom:8px;padding-right:30px;font-size:12px;line-height:1.5;color:var(--muted)}
.status-dot{width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:var(--accent)}
.reminder-row{display:flex;align-items:center;gap:12px}
.reminder-copy{flex:1;min-width:0}
.reminder-row h2{font-size:18px;line-height:1.4}
.reminder-row p{margin-top:6px;font-size:14px}
.reminder-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font-size:12px;line-height:1.5;color:var(--muted)}
.reminder-actions{display:flex;gap:4px;flex:0 0 auto}
.reminder-actions>.icon-button{color:var(--accent)}
.reminder-actions>.reminder-complete{background:var(--accent);color:#fff}
.reminder-actions>.reminder-complete:hover{background:#0057ad}

/* Quiet Glass · overlays · shared source */
dialog{color:var(--ink);padding:0;border:1px solid var(--line);border-radius:var(--panel-radius);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.04),0 28px 100px rgba(0,0,0,.2);max-width:calc(100vw - 40px);max-height:90vh;width:620px;overflow:hidden;outline:none}
.application-entry{padding:14px 0;border-bottom:1px solid var(--line)}
.application-entry h2{font-size:16px}
.application-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.application-actions>a{display:inline-flex;align-items:center;min-height:44px}
dialog::backdrop{background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]{animation:none}
.dialog-close{position:absolute;right:16px;top:16px;z-index:5;border-radius:50%}
.dialog-close .icon-button{background:var(--glass-thick);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7)}
.dialog-content{max-height:86vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 20px 13px}
.dialog-top .card-meta{max-width:75%;overflow:hidden;text-overflow:ellipsis}
.dialog-tools{display:flex;align-items:center;justify-content:space-between;gap:5px;border-top:1px solid var(--line);padding:9px 19px;background:var(--card);flex-wrap:wrap}
.dialog-tools .tools-cluster{display:flex;gap:3px}
.preview-image{height:244px;width:calc(100% - 20px);margin:0 10px;object-fit:cover;border-radius:19px}
.preview-body{padding:28px 32px 32px}
.preview-body h1{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.45;white-space:pre-line}
.preview-body .preview-lead{margin-top:16px;font-size:16px;color:var(--muted);line-height:1.85;white-space:pre-line}
.preview-body .preview-sample{font-size:15px;line-height:1.9;color:var(--muted);margin-top:16px}
.preview-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:20px}
.preview-note{margin-top:20px;border-left:2px solid var(--line);padding:4px 0 4px 16px;font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-wrap}
.detail-task-list{margin-top:20px}
.detail-task-list .check-item{font-size:14px;min-height:44px}
#modal.reader{width:790px}
.reader .dialog-content{max-height:82vh}
.reader .dialog-top{position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line)}
.reader-body{padding:32px 68px 58px}
.reader-body h1{font-size:30px;line-height:1.4;font-weight:600;letter-spacing:-.035em;margin:0 0 24px}
.reader-body p{font-size:16px;line-height:1.95;margin:0 0 24px;color:var(--ink)}
.reader-body .reading-caption{font-size:12px;line-height:1.7;color:var(--muted);margin-bottom:28px}
.reader .preview-image{height:230px;width:100%;margin:0 0 28px}
.reader .reader-rule{height:1px;background:var(--line);margin:32px 0}
.reader-end{display:flex;justify-content:center;color:var(--secondary);padding:15px}
#modal.panel{width:440px;background:var(--card)}
.panel-content{padding:26px 26px 24px;max-height:82vh;overflow:auto}
.panel-content h1{font-size:22px;font-weight:600;margin:0 45px 24px 0;letter-spacing:-.03em}
.search-field{position:relative;margin-bottom:24px}
.search-field>.icon{position:absolute;left:14px;top:15px;color:var(--muted)}
.search-field input{width:100%;padding-left:41px;background:var(--surface)}
.field-label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:24px 0 10px}
.filter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 3px}
.panel-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:24px;padding-top:16px;gap:12px}
.panel-footer:empty{display:none}
.panel-footer p{font-size:12px;color:var(--muted)}
.editor-note{width:100%;height:130px;min-height:100px;font-size:14px;line-height:1.8;background:var(--surface);margin-top:2px}
.tag-add{display:flex;align-items:center;gap:8px;margin-top:12px}
.tag-add input{width:100%;min-width:0;background:var(--surface)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:18px}
.setting-row span{font-size:14px}
.setting-row small{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.settings-note{font-size:13px;line-height:1.8;color:var(--muted);margin:18px 0 0}
.drag-ghost{position:fixed;left:0;top:0;width:244px;pointer-events:none;z-index:200;border-radius:17px;border:1px solid var(--line);background:var(--glass-thick);box-shadow:0 20px 55px rgba(0,0,0,.2);display:flex;align-items:center;padding:10px;gap:12px;-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);transform:rotate(-3deg);will-change:left,top}
.drag-ghost img{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.drag-ghost .ghost-icon{width:44px;height:50px;display:grid;place-items:center;flex:0 0 auto;background:var(--surface);border-radius:10px}
.drag-ghost strong{font-weight:550;font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drag-ghost .drag-count{position:absolute;right:-7px;top:-7px;border-radius:50%;background:var(--accent);color:#fff;width:23px;height:23px;display:grid;place-items:center;font-size:11px}
body.is-dragging{cursor:grabbing!important;user-select:none}
body.is-dragging .feed-card,body.is-dragging #orb{cursor:grabbing!important}
body.is-dragging .card-actions,body.is-dragging .dock-tools{visibility:hidden!important;opacity:0!important}
body.is-dragging #selection-bar{visibility:hidden}
.media-player{position:relative;background:var(--surface);border-radius:17px;overflow:hidden;margin-top:20px;aspect-ratio:1.55}
.media-player img{height:100%;width:100%;object-fit:cover;opacity:.4;filter:saturate(.7)}
.media-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(0deg,rgba(245,245,247,.96),rgba(245,245,247,.25));flex-direction:column;gap:15px}
.media-slide b{font-size:24px;font-weight:550;letter-spacing:-.035em}
.media-slide span{font-size:14px;color:var(--ink);line-height:1.8}
.media-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.media-step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quiet Glass · responsive · shared source */
@media (min-width:651px){
 main{padding-top:28px}
 .feed-grid .card-body{padding:16px}
 .feed-grid .feed-card h2{font-size:16px}
 .feed-grid .form-quote h2{font-size:19px}
 .feed-grid .card-footer{margin-top:12px}
 .feed-grid .event-time{font-size:24px}
}
body.opaque .glass,body.opaque .dock-tools .icon-button{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
body.opaque #orb{background:var(--card)}
@supports not (backdrop-filter:blur(1px)){.glass,.dock-tools .icon-button{background:var(--card)}}
@media (max-width:1000px){main{padding:24px 24px 110px}}
@media (max-width:650px){
 html{scrollbar-gutter:auto}
 main{padding:20px 16px 110px}
 .card-actions{right:8px;top:8px}
 .card-more-trigger{opacity:1;visibility:visible}
 .card-more-menu{right:8px;top:57px}
 #dock{right:15px;bottom:max(16px,env(safe-area-inset-bottom));width:62px}
 #orb{width:54px;height:54px;min-width:54px}
 #toast{bottom:max(24px,env(safe-area-inset-bottom));left:16px;transform:none;max-width:calc(100vw - 100px);font-size:11px;padding:8px 10px 8px 13px}
 dialog{position:fixed;inset:auto 0 0;margin:0;width:100%!important;max-width:100%;max-height:94dvh;border-radius:25px 25px 0 0;padding-bottom:env(safe-area-inset-bottom)}
 .dialog-content{max-height:82dvh}
 .dialog-top{padding:15px 18px 10px}
 .preview-image{height:210px}
 .preview-body{padding:24px 24px 28px}
 .preview-body h1{font-size:25px}
 .preview-body .preview-lead{font-size:14px}
 .reader-body{padding:24px 25px 40px}
 .reader-body h1{font-size:27px}
 .reader-body p{font-size:16px;line-height:2}
 .reader .dialog-content{max-height:85dvh}
 .reader .preview-image{height:195px}
 .panel-content{padding:26px 24px 28px;max-height:87dvh}
 .panel-content h1{font-size:20px}
 .filter-grid{gap:13px 4px}
 .drop-targets{gap:13px;bottom:max(22px,env(safe-area-inset-bottom));left:17px;transform:none}
 .drop-target{height:49px;width:49px}
 #selection-bar{left:14px;bottom:23px;transform:none;padding:4px}
}
@media (hover:none){
 .card-more-trigger{opacity:1;visibility:visible}
 .feed-card:hover .card-image{transform:none}
}
@media (prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (prefers-reduced-transparency:reduce){
 .glass,.dock-tools .icon-button{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
 dialog::backdrop{background:rgba(0,0,0,.3);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
 body:not(.is-dragging) .feed-card:hover{transform:translateY(-2px)}
}</style>

 return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${Glyphs[name]||Glyphs.file}</svg>`;

/* module: src/atoms/primitives.js */
function esc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(glyph,label,action,id='',extra='',className=''){
 return `<button type="button" class="icon-button ${className}" aria-label="${esc(label)}" data-action="${esc(action)}"${id?` data-id="${esc(id)}"`:''}${extra?` data-extra="${esc(extra)}"`:''}>${icon(glyph)}</button>`;
}
function ring(progress=0,size=22){
 const p=Math.max(0,Math.min(1,Number(progress)||0)),c=50.265;
 return `<span class="progress-ring" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="2"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 10 10)"/></svg></span>`;
}
function checkItem(c,t){return `<button class="check-item ${t.done?'is-done':''}" data-action="task" data-id="${esc(c.id)}" data-extra="${esc(t.id)}" type="button" role="checkbox" aria-checked="${!!t.done}" aria-label="${esc(t.text)}"><span class="check-dot">${t.done?icon('check',13):''}</span><span>${esc(t.text)}</span></button>`;}
function avatars(names=[]){return `<span class="avatars" aria-label="${names.length} 位参与者">${names.map((n,i)=>`<span class="avatar a${i%3}">${esc(n)}</span>`).join('')}</span>`;}
function timeString(ts){return new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});}
function eventRelative(c){
 const min=Math.ceil((c.start-Date.now())/60000);
 return min>0?`${min} 分钟后`:Date.now()<c.end?'正在进行':'已经结束';
}

/* module: src/services/feed-policy.js */
/** Pure feed policy. Clock and item state are supplied by the caller. */
const FeedPolicy = {
 sorts:['priority','unread','time'],
 cooldown:60000,
 supports(c){return ['reminder','event','task'].includes(c.type);},
 trigger(c,s={}){
   if(s.snoozedUntil>0)return s.snoozedUntil;
   if(c.type==='event')return Number(c.start)-15*60000;
   if(c.type==='task')return Number(c.due)-30*60000;
   return c.type==='reminder'?Number(c.due):NaN;
 },
 key(c,s={}){return `${c.id}:${this.trigger(c,s)}`;},
 completed(c,s={}){
   if(s.reminderDone)return true;
   return c.type==='task'&&c.tasks?.length>0&&c.tasks.every(t=>s.taskDone?s.taskDone.includes(t.id):t.done);
 },
 eligible(c,s,now){
   const at=this.trigger(c,s);
   return this.supports(c)&&Number.isFinite(at)&&at>0&&at<=now&&
     !s.dismissed&&!this.completed(c,s)&&!(c.type==='event'&&c.end<=now)&&
     s.lastReminderKey!==this.key(c,s)&&(!s.lastNotifiedAt||now-s.lastNotifiedAt>=this.cooldown);
 },
 visible(c,s,status='all'){
   if(status==='snoozed')return s.snoozedUntil>0&&!s.dismissed&&!s.reminderDone;
   if(status==='dismissed')return !!s.dismissed;
   if(status==='done')return !!s.reminderDone;
   return !s.snoozedUntil&&!s.dismissed&&!s.reminderDone;
 },
 score(c,s,now){
   if(s.dismissed||this.completed(c,s))return -1;
   const at=this.trigger(c,s);
   const urgent=Number.isFinite(at)&&at<=now&&!(c.type==='event'&&c.end<=now);
   return (urgent?100:0)+Math.max(0,Math.min(10,Number(c.priority)||0));
 },
 sort(cards,mode,items,now){
   const unique=[...new Map(cards.map(c=>[c.id,c])).values()];
   return unique.map((c,index)=>({c,index})).sort((a,b)=>{
     const x=items[a.c.id]||{},y=items[b.c.id]||{};
     if(mode==='time')return (b.c.time||0)-(a.c.time||0)||a.index-b.index;
     if(mode==='unread')return Number(!!x.read)-Number(!!y.read)||a.index-b.index;
     return this.score(b.c,y,now)-this.score(a.c,x,now)||a.index-b.index;
   }).map(x=>x.c);
 },
 label(c,s,now){
   if(s.dismissed)return '已忽略提醒';
   if(s.reminderDone)return '提醒已完成';
   const at=s.snoozedUntil||c.due;
   if(!Number.isFinite(at))return c.meta||'提醒';
   const minutes=Math.ceil((at-now)/60000);
   return minutes>0?`${minutes} 分钟后${s.snoozedUntil?' · 已延后':''}`:s.snoozedUntil?'已到期 · 等待查看':'现在可以处理';
 }
};

/* module: src/data/store.js */
/** Browser backup; local mode synchronizes it with the agent-readable repository. */
const Store = {
 key:'quiet-glass-v1', // Keep the original key so existing users migrate in place.
 state:{cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true},
 load(){
   this.state={cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true};
   let raw=null;
   try{raw=JSON.parse(localStorage.getItem(this.key)||'null');}
   catch{this.state.storageAvailable=false;}
   const valid=raw&&[1,2,3].includes(raw.version)&&raw.items&&typeof raw.items==='object'&&!Array.isArray(raw.items);
   if(valid){
     if(Number.isFinite(raw.demoStartedAt)&&raw.demoStartedAt>0)this.state.demoStartedAt=raw.demoStartedAt;
     this.state.freshIds=Array.isArray(raw.freshIds)?[...new Set(raw.freshIds.filter(id=>FreshCards.some(c=>c.id===id)))]:[];
     this.state.seconds=Math.max(0,Math.min(1e7,Number(raw.seconds)||0));
     this.state.preferences.reduceTransparency=!!raw.reduceTransparency;
     this.state.preferences.sort=FeedPolicy.sorts.includes(raw.sort)?raw.sort:'priority';
   }
   const offset=this.state.demoStartedAt-demoBase;
   this.state.cards=[...this.state.freshIds.map(id=>FreshCards.find(c=>c.id===id)),...SeedCards].map(c=>{
     const card={...c,tasks:c.tasks?.map(t=>({...t}))};
     for(const key of ['time','start','end','due'])if(Number.isFinite(card[key]))card[key]+=offset;
     return card;
   });
   if(valid&&raw.version===3&&Array.isArray(raw.cards))this.state.cards=raw.cards;
   if(valid){
     // Live cards arrive after authentication; restore their browser-local notes too.
     const restoredCards=window.__QG_RUNTIME__?Object.keys(raw.items).map(id=>({id})):this.state.cards;
     for(const c of restoredCards){
       const x=raw.items[c.id];if(!x||typeof x!=='object'||Array.isArray(x))continue;
       const timestamp=n=>Number.isFinite(n)&&n>0&&n<8.64e15?n:0;
       this.state.items[c.id]={
         seen:!!x.seen,read:!!x.read,bookmarked:!!x.bookmarked,later:!!x.later,tagsEdited:!!x.tagsEdited,
         progress:Math.max(0,Math.min(1,Number(x.progress)||0)),
         note:typeof x.note==='string'?x.note.slice(0,4000):'',
         tags:Array.isArray(x.tags)?x.tags.filter(s=>typeof s==='string').map(s=>s.slice(0,30)).slice(0,20):[],
         taskDone:Array.isArray(x.taskDone)?x.taskDone.filter(s=>typeof s==='string'):undefined,
         addedAt:timestamp(x.addedAt),snoozedUntil:timestamp(x.snoozedUntil),dismissed:!!x.dismissed,reminderDone:!!x.reminderDone,
         lastReminderKey:typeof x.lastReminderKey==='string'?x.lastReminderKey.slice(0,200):'',
         lastNotifiedAt:timestamp(x.lastNotifiedAt)
       };
       if(this.state.freshIds.includes(c.id)&&this.state.items[c.id].addedAt)c.time=this.state.items[c.id].addedAt;
     }
   }
   this.save(); // Persist the demo clock even when there has been no interaction yet.
   return this.state;
 },
 item(id){
   const defaults={seen:false,read:false,bookmarked:false,later:false,progress:0,note:'',tags:[],snoozedUntil:0,dismissed:false,reminderDone:false,lastReminderKey:'',lastNotifiedAt:0};
   this.state.items[id]={...defaults,...this.state.items[id]};
   return this.state.items[id];
 },
 card(id){return this.state.cards.find(c=>c.id===id);},
 patch(id,values){Object.assign(this.item(id),values);this.save();},
 tags(c){const s=this.item(c.id);return s.tagsEdited?[...s.tags]:[...new Set([...(c.tags||[]),...s.tags])];},
 tasks(c){
   const done=this.item(c.id).taskDone;
   return (c.tasks||[]).map(t=>({...t,done:done?done.includes(t.id):t.done}));
 },
 insert(cards){
   const known=new Set(this.state.cards.map(c=>c.id));
   const additions=cards.filter(c=>{if(known.has(c.id))return false;known.add(c.id);return true;});
   this.state.cards=[...additions,...this.state.cards];
   for(const c of additions)this.item(c.id).addedAt=c.time;
   this.state.freshIds=this.state.cards.filter(c=>FreshCards.some(f=>f.id===c.id)).map(c=>c.id);
   this.save();return additions.length;
 },
 serialized(){return {version:3,cards:this.state.cards,items:this.state.items,seconds:this.state.seconds,demoStartedAt:this.state.demoStartedAt,freshIds:this.state.freshIds,sort:this.state.preferences.sort,reduceTransparency:this.state.preferences.reduceTransparency};},
 save(){
   try{localStorage.setItem(this.key,JSON.stringify(this.serialized()));}
   catch{this.state.storageAvailable=false;}
 },
 stats(){
   return {read:this.state.cards.filter(c=>this.item(c.id).read).length,
     saved:this.state.cards.filter(c=>this.item(c.id).bookmarked).length,
     done:this.state.cards.filter(c=>c.type==='task'&&this.tasks(c).every(t=>t.done)).length};
 }
};

 query:matchMedia('(prefers-reduced-motion: reduce)'),

class FeedLayout{
 constructor(container){
   this.container=container;this.frame=0;
   this.onResize=()=>this.schedule(false);
   window.addEventListener('resize',this.onResize,{passive:true});
 }
 schedule(animate=false){
   cancelAnimationFrame(this.frame);
   this.frame=requestAnimationFrame(()=>this.layout(animate));
 }
 layout(animate=false){
   const el=this.container,width=el.clientWidth;
   const items=[...el.querySelectorAll(':scope > .feed-card')];
   if(!items.length){el.style.height='';return;}
   if(!width)return;
   // A consistent column width lets content, rather than automatic spanning,
   // establish hierarchy. Short actions stay compact; reading cards have room.
   const cols=width>=480?Math.max(2,Math.floor((width+18)/258)):1,gap=cols===1?16:18;
   const old=animate?new Map(items.map(n=>[n,n.getBoundingClientRect()])):null;
   el.dataset.columns=cols;
   items.forEach(n=>{
     n.classList.remove('is-featured');
     // Keep horizontal geometry inside the container before resize/RAF runs.
     n.style.width=`calc((100% - ${(cols-1)*gap}px) / ${cols})`;
   });
   const heights=Array(cols).fill(0);
   items.forEach(n=>{
     const span=1;
     let col=0,y=Infinity;
     for(let i=0;i<=cols-span;i++){
       const candidate=Math.max(...heights.slice(i,i+span));
       if(candidate<y){col=i;y=candidate;}
     }
     n.style.left=`calc((100% + ${gap}px) / ${cols} * ${col})`;n.style.top=y+'px';
     for(let i=col;i<col+span;i++)heights[i]=y+n.offsetHeight+gap;
   });
   el.style.height=(Math.max(...heights)-gap)+'px';
   if(old)items.forEach(n=>MotionEngine.flip(n,old.get(n)));
 }
}

/** Page and agents share one loopback service. Browser storage remains a migration backup. */
const LocalSync={
  revision:0,baseline:null,pending:[],busy:false,app:null,ready:false,failed:false,
  snapshot(){return JSON.parse(JSON.stringify({cards:Store.state.cards,items:Store.state.items,seconds:Store.state.seconds,preferences:Store.state.preferences}));},
  async request(path,body){
    const response=await fetch('/api/local/'+path,{signal:AbortSignal.timeout(5000),...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});
    const value=await response.json();if(!response.ok)throw new Error(value.error||'本地同步失败');return value;
  },
  async connect(app){
    this.app=app;
    try{
      let value=await this.request('state');
      if(!value.state)value=await this.request('initialize',this.snapshot());
      this.adopt(value);this.ready=true;
      const save=Store.save.bind(Store);
      Store.save=()=>{save();this.capture();};
      this.timer=setInterval(()=>this.refresh().catch(()=>{}),1000);
      window.addEventListener('focus',()=>this.refresh().catch(()=>{}));
    }catch(error){app.toast('无法连接本地数据：'+error.message);}
  },
  capture(){
    if(!this.ready)return;
    const next=this.snapshot(),before=this.baseline,operations=[];
    for(const [id,item] of Object.entries(next.items)){
      if(!next.cards.some(card=>card.id===id))continue;
      const values={},previous={};
      for(const [key,value] of Object.entries(item))if(JSON.stringify(value)!==JSON.stringify(before.items[id]?.[key])){values[key]=value;previous[key]=before.items[id]?.[key];}
      if(Object.keys(values).length)operations.push({op:'item.patch',id,values,before:previous});
    }
    const values={},previous={};
    for(const [key,value] of Object.entries(next.preferences))if(value!==before.preferences[key]){values[key]=value;previous[key]=before.preferences[key];}
    if(Object.keys(values).length)operations.push({op:'preferences.patch',values,before:previous});
    const seconds=next.seconds-before.seconds;if(seconds>0)operations.push({op:'reading.add',seconds});
    this.baseline=next;
    if(operations.length){this.app.grid.dataset.sync='pending';this.pending.push({operations});if(!this.failed)this.flush();}
  },
  async flush(){
    if(this.busy||!this.pending.length)return;
    this.busy=true;
    try{
      while(this.pending.length){
        const value=await this.request('operations',this.pending[0]);this.pending.shift();this.revision=value.revision;
        if(!this.pending.length)this.adopt(value);
      }
      this.app.grid.dataset.sync='saved';
    }catch(error){
      this.failed=true;
      try{localStorage.setItem('quiet-glass-unsynced',JSON.stringify({state:this.snapshot(),pending:this.pending}));}catch{}
      this.app.grid.dataset.sync='error';this.app.toast('修改尚未同步：'+error.message+'；本地草稿已保留');
    }finally{this.busy=false;}
  },
  async refresh(manual=false){
    if(!this.ready)throw new Error('本地数据尚未连接，请重新打开页面');
    if(this.busy)return;
    if(this.failed&&!manual)return;
    if(manual)this.failed=false;
    if(this.pending.length){await this.flush();if(this.pending.length)throw new Error('仍有未同步修改');return;}

    if(this.app.modalKind==='editor')return;

  },
  adopt(value){
    if(!value.state)return;
    const changed=JSON.stringify([Store.state.cards,Store.state.items,Store.state.preferences])!==JSON.stringify([value.state.cards,value.state.items,value.state.preferences]);
    this.revision=value.revision;Object.assign(Store.state,value.state);Store.state.storageAvailable=true;

    if(!changed)return;
    app.sort=Store.state.preferences.sort;app.feedNow=Date.now();
    document.body.classList.toggle('opaque',Store.state.preferences.reduceTransparency);
    app.withFeedAnchor(()=>{});
    if(['preview','reader'].includes(app.modalKind)){
      const card=Store.card(app.currentId);
      if(!card){app.closeNative();history.replaceState({glass:true,prev:null},'','#feed');}
      else{
        const reading=app.modalKind==='reader',scroll=app.dialog.querySelector('#reader-scroll')?.scrollTop||0;
        const toast=document.getElementById('toast');if(toast&&app.dialog.contains(toast))document.body.appendChild(toast);
        app.dialog.innerHTML=Panels.preview(app,card,reading);
        if(reading){const element=app.dialog.querySelector('#reader-scroll');element.scrollTop=scroll;element.addEventListener('scroll',()=>app.updateReading(card.id,element),{passive:true});}
      }
    }
    app.checkReminders();app.grid.dataset.sync='saved';app.grid.dataset.revision=value.revision;
  }
};
