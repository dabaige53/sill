<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f4f0">
<meta name="referrer" content="no-referrer">
<title>Quiet Glass · 个人信息空间</title>
<style>/* Quiet Glass · tokens · shared source */
:root{
 --canvas:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--secondary:#86868b;--faint:#e8e8ed;--surface:#f0f0f2;
 --line:rgba(0,0,0,.08);--accent:#0066cc;--accent-soft:#edf4ff;--success:#248a3d;--alert:#b45309;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 --gap:24px;--card-radius:20px;--image-radius:12px;--panel-radius:24px;
 --shadow:0 1px 2px rgba(0,0,0,.025),0 4px 16px rgba(0,0,0,.035);
 --shadow-hover:0 2px 5px rgba(0,0,0,.04),0 10px 24px rgba(0,0,0,.07);
 --glass:rgba(255,255,255,.76);--glass-thick:rgba(255,255,255,.94);
 --ease:cubic-bezier(.2,.75,.25,1);--fast:140ms;--base:220ms;--layout:320ms;
}

/* Quiet Glass · base · shared source */
*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;background:var(--canvas);min-height:100vh}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
button:disabled{opacity:.4;cursor:default}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,textarea,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
input,textarea{border:1px solid var(--line);background:rgba(20,25,29,.035);outline:0;border-radius:14px;padding:12px 14px;color:var(--ink)}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--secondary)}
::selection{background:#d8e9ff;color:var(--ink)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{flex:0 0 auto;vertical-align:middle;pointer-events:none}
main{max-width:1184px;padding:48px 32px 112px;margin:0 auto;min-height:100vh}
.feed-grid{position:relative;width:100%;min-height:80vh}
h2,p{margin:0}
.empty-card{position:relative;max-width:450px;margin:15vh auto 0;padding:40px 30px;text-align:center;background:#ffffffe8;border:1px solid white;border-radius:24px;box-shadow:var(--shadow)}
.empty-icon{display:block;color:var(--muted);margin-bottom:20px}
.empty-card h2{font-size:19px}
.empty-card p{color:var(--muted);font-size:13px;margin:13px 0 19px;line-height:1.85}

/* Quiet Glass · controls · shared source */
/* Translucency belongs to the floating tools, not the content surface. */
.glass{position:relative;background:var(--glass);border:1px solid rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2)}
.icon-button{width:44px;height:44px;min-width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;position:relative;transition:background var(--fast),transform var(--fast),color var(--fast)}
.icon-button:hover{background:var(--surface)}
.icon-button:active{transform:scale(.95)}
.icon-button.active{background:var(--accent-soft);color:var(--accent)}
.icon-button.active svg{fill:rgba(0,102,204,.08)}
#dock{position:fixed;right:26px;bottom:26px;z-index:45;display:flex;align-items:center;justify-content:center;width:64px;height:64px}
#orb{width:56px;height:56px;min-width:56px;border-radius:50%;overflow:hidden;background:var(--glass);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.14);transition:transform .24s var(--ease),box-shadow .24s}
#orb .icon{width:23px;height:23px}
#orb:hover{transform:scale(1.04);background:rgba(255,255,255,.92)}
#orb.drop-hot{transform:scale(1.2);color:var(--accent);box-shadow:0 0 0 8px rgba(0,102,204,.12),0 8px 28px rgba(0,0,0,.14)}
.dock-tools{position:absolute;bottom:72px;right:6px;display:flex;flex-direction:column;gap:8px;opacity:0;visibility:hidden;transform:translateY(10px) scale(.96);transform-origin:bottom;transition:opacity 230ms var(--ease),transform 230ms var(--ease),visibility 230ms;padding:8px 0}
.dock-tools .icon-button{background:var(--glass);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.dock-tools .icon-button:hover{background:var(--card)}
#dock.is-open .dock-tools,#dock:focus-within .dock-tools{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
#dock.filter-active:after{content:"";position:absolute;right:10px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--card);pointer-events:none}
#new-count{position:absolute;bottom:7px;right:75px;min-width:44px;height:44px;border-radius:22px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
#new-count[hidden]{display:none}
#selection-bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:43;border-radius:30px;display:flex;align-items:center;padding:4px 7px;gap:8px;max-width:calc(100vw - 110px)}
#selection-bar[hidden]{display:none}
#selection-bar .selection-count{font-size:13px;padding:0 8px;white-space:nowrap}
#selection-bar .icon-button{width:44px;min-width:44px;height:44px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 130px);padding:10px 16px;border-radius:28px;z-index:120;display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.12);background:var(--glass-thick);border:1px solid rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
#toast[hidden]{display:none}
#toast .icon-button{width:44px;height:44px;min-width:44px}
#toast-text{white-space:normal}
.filter-kind{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;padding:0;min-width:44px;min-height:68px;font-size:12px;color:var(--muted);border-radius:10px}
.filter-kind .kind-disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);transition:background 180ms,color 180ms}
.filter-kind.active{color:var(--accent)}
.filter-kind.active .kind-disc{background:var(--accent-soft);color:var(--accent)}
.filter-kind:hover .kind-disc{background:var(--faint)}
.filter-kind.active:hover .kind-disc{background:var(--accent-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag-chip{min-height:44px;padding:8px 14px;border-radius:22px;background:var(--surface);color:var(--ink);font-size:13px;border:1px solid transparent;transition:background var(--fast),color var(--fast)}
.tag-chip:hover{background:var(--faint)}
.tag-chip.active{background:var(--accent-soft);color:var(--accent)}
.text-button{background:transparent;min-height:44px;padding:8px 12px;font-size:13px;border-radius:12px;color:var(--ink);transition:background var(--fast)}
.text-button:hover{background:var(--surface)}
.solid-button{background:var(--accent);color:#fff;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:500;min-height:44px;transition:filter var(--fast),transform var(--fast)}
.solid-button:hover{filter:brightness(1.08)}
.solid-button:active{transform:scale(.98)}
.toggle{width:48px;height:44px;border-radius:16px;background:transparent;position:relative;flex-shrink:0}
.toggle:after{content:"";position:absolute;inset:9px 2px;border-radius:16px;background:#d1d1d6;transition:background 150ms}
.toggle:before{content:"";position:absolute;width:22px;height:22px;left:4px;top:11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 150ms;z-index:1}
.toggle[aria-checked=true]:after{background:var(--accent)}
.toggle[aria-checked=true]:before{transform:translateX(18px)}

/* Quiet Glass · cards · shared source
 * Content stays on opaque white surfaces. Color communicates an action or state.
 * Heights follow content; the layout engine owns column widths and placement.
 */
.feed-card,.lab-card{
 position:absolute;left:0;top:0;width:344px;background:var(--card);
 border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);
 transition:box-shadow var(--base),border-color var(--base);isolation:isolate;overflow:hidden;
}
.feed-card{cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.feed-card:hover,.feed-card:focus-within{border-color:rgba(0,0,0,.14);box-shadow:var(--shadow-hover)}
.feed-card:focus{outline:none}
.feed-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.feed-card:after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid transparent;pointer-events:none;transition:border-color var(--base)}
.card-body{padding:20px}
.feed-card h2{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.4;white-space:normal;color:var(--ink)}
.card-title-button{
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
 width:100%;min-height:44px;padding:0;text-align:left;background:none;font:inherit;
 letter-spacing:inherit;white-space:normal;line-height:inherit;border-radius:4px;
}
.feed-card p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:14px;line-height:1.55;color:var(--muted);margin-top:8px;white-space:normal}
.card-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;line-height:1.5}
.card-meta>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta>.icon{flex:0 0 auto;color:var(--secondary)}
.top-meta{min-height:18px;margin-bottom:10px;padding-right:32px}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:18px;margin-top:16px;color:var(--muted);font-size:12px;line-height:1.5}
.card-footer>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reading-state{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.progress-ring{display:inline-flex;flex:0 0 auto;color:var(--accent)}
.progress-ring svg{width:100%;height:100%}
.progress-ring circle:last-child{transition:stroke-dashoffset 300ms var(--ease)}

/* One image treatment across articles and media. */
.card-image-wrap{position:relative;display:block;width:calc(100% - 16px);padding:0;margin:8px 8px 0;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface);text-align:left}
.card-image{display:block;width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;transition:transform 500ms var(--ease)}
.card-image-wrap:focus-visible{outline-offset:-4px}
.feed-card:hover .card-image{transform:scale(1.018)}
.form-image .card-body,.type-media .card-body{padding-top:16px}
.form-image .card-footer,.type-media .card-footer{margin-top:12px}
.play-mark{position:absolute;left:12px;bottom:12px;display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.8);border-radius:50%;color:var(--ink);background:rgba(255,255,255,.9);backdrop-filter:blur(14px)}
.play-mark svg{margin-left:2px}
.media-length{position:absolute;right:12px;bottom:20px;padding:3px 8px;border-radius:6px;color:#fff;background:rgba(0,0,0,.5);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}

/* Secondary actions appear on hover or focus, while direct actions stay visible. */
.card-actions{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:4px;z-index:3}
.card-more-trigger{color:var(--secondary);background:transparent;opacity:0;visibility:hidden;transition:opacity var(--fast),background var(--fast),color var(--fast)}
.feed-card:hover .card-more-trigger,.feed-card:focus-within .card-more-trigger,.feed-card.tools-open .card-more-trigger{opacity:1;visibility:visible}
.card-more-trigger:hover,.feed-card.tools-open .card-more-trigger{color:var(--ink);background:var(--surface)}
.form-image>.card-actions .card-more-trigger,.type-media>.card-actions .card-more-trigger{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.feed-card.tools-open{overflow:visible;z-index:6}
.card-more-menu{position:absolute;right:8px;top:58px;display:flex;flex-direction:column;width:min(222px,calc(100% - 16px));padding:5px;border:1px solid var(--line);border-radius:16px;z-index:5;background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.14)}
.card-menu-item{position:relative;display:flex;align-items:center;gap:11px;min-height:44px;width:100%;padding:10px 12px;border-radius:10px;background:none;text-align:left;font-size:13px;line-height:1.5}
.card-menu-item:hover,.card-menu-item:focus-visible{background:var(--surface)}
.card-menu-item>.icon{color:var(--muted)}
.selected-tick{position:absolute;left:12px;top:12px;display:none;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.94);z-index:4}
.feed-card.is-selected:after{border-color:var(--accent)}
.feed-card.is-selected .selected-tick{display:grid}
.feed-card.is-selected:not(.form-image):not(.type-media) .top-meta{padding-left:24px}
.feed-card.is-selected:is(.type-task,.type-insight,.type-digest,.type-suggestion) .card-body>h2{padding-left:24px}
.feed-card.is-selected .reminder-status{padding-left:24px}
.feed-card.is-selected .completed-body{padding-top:34px}
.feed-card.is-read .card-image{filter:saturate(.88)}
.feed-card.is-read h2{color:var(--muted)}
.feed-card.is-drag-source{opacity:.32;box-shadow:none}

/* Quotes change typography, not the surface palette. */
.form-quote .top-meta{margin-bottom:12px}
.quote-mark{color:var(--secondary);margin-bottom:8px}
.form-quote h2{font-family:var(--font);font-size:22px;font-weight:500;line-height:1.55;letter-spacing:0}
.form-quote .card-title-button{-webkit-line-clamp:3}
.form-quote .card-footer{margin-top:16px}

/* Calendar, attachments and tasks retain only their useful structure. */
.event-meta{color:var(--muted)}
.event-date{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:12px;line-height:1.5}
.event-date>span{color:var(--secondary)}
.event-time{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:28px;line-height:1.25;font-weight:500;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.event-time span{font-size:18px;font-weight:400;color:var(--secondary)}
.event-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.avatars{display:flex}
.avatar{display:grid;place-items:center;width:28px;height:28px;margin-left:-5px;border:2px solid var(--card);border-radius:50%;font-size:10px;color:var(--muted);background:var(--surface)}
.avatar:first-child{margin-left:0}
.tiny-muted{font-size:12px;color:var(--muted)}
.attachment{display:flex;align-items:center;gap:9px;margin-top:14px;padding:0;min-height:32px;font-size:12px;color:var(--muted)}
.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment>.icon{flex:0 0 auto;color:var(--secondary)}
.attachment>.icon:last-child{color:var(--accent)}
.checklist{margin-top:8px}
.check-item{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:8px 0;background:none;text-align:left;font-size:14px;line-height:1.5}
.check-item>span:last-child{min-width:0;overflow-wrap:anywhere}
.check-dot{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border:1.2px solid #b8b8bd;border-radius:50%;transition:background var(--base),border-color var(--base)}
.check-item:hover .check-dot{border-color:var(--accent)}
.check-item.is-done{color:var(--secondary)}
.check-item.is-done>span:last-child{text-decoration:line-through;text-decoration-color:#c7c7cc}
.check-item.is-done .check-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.type-task:not(.is-complete) .card-body>h2,.type-suggestion .card-body>h2{padding-right:32px}
.type-task .card-footer{margin-top:12px}
.task-overflow{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.task-count{color:var(--ink);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.task-count>span{color:var(--muted);font-weight:400}
.completed-body{display:flex;align-items:center;gap:12px;padding:20px}
.completed-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--success);background:var(--surface);flex:0 0 auto}
.completed-body>div{min-width:0;flex:1}
.completed-body h2{margin-top:0;padding-right:32px;font-size:16px;color:var(--muted)}
.completed-body .card-title-button{min-height:44px}
.eyebrow{font-size:12px;line-height:1.5;font-weight:400;color:var(--muted)}

/* Live data and related content use whitespace instead of nested cards. */
.type-insight h2,.type-digest h2{padding-right:32px}
.reading-figure{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0 0}
.reading-figure strong{font-size:44px;line-height:1.15;font-weight:500;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.type-insight p{margin-top:6px;font-size:12px}
.stats-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.stats-trio div{display:flex;flex-direction:column}
.stats-trio b{font-size:32px;line-height:1.2;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stats-trio span{margin-top:6px;font-size:12px;color:var(--muted)}
.linked-cards{display:flex;flex-direction:column;margin-top:12px}
.linked-card{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 0;border-radius:8px;background:none;text-align:left;font-size:13px;color:var(--ink);transition:color var(--fast),background var(--fast)}
.linked-card+.linked-card{border-top:1px solid var(--line);border-radius:0}
.linked-card:hover{color:var(--accent);background:var(--surface)}
.linked-card-icon{display:grid;place-items:center;width:20px;flex:0 0 20px;color:var(--secondary)}
.linked-card>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked-card>.icon:last-child{flex:0 0 auto;color:var(--secondary)}
.suggestion-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
.suggestion-action{color:var(--accent);background:var(--accent-soft)}
.suggestion-action:hover{background:#dceaff}

/* A reminder is a compact action, not an alert-colored panel. */
.type-reminder .card-body{padding:18px 20px 12px}
.reminder-status{display:flex;align-items:center;gap:7px;min-height:18px;margin-bottom:8px;padding-right:30px;font-size:12px;line-height:1.5;color:var(--muted)}
.status-dot{width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:var(--accent)}
.reminder-row{display:flex;align-items:center;gap:12px}
.reminder-copy{flex:1;min-width:0}
.reminder-row h2{font-size:18px;line-height:1.4}
.reminder-row p{margin-top:6px;font-size:14px}
.reminder-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;font-size:12px;line-height:1.5;color:var(--muted)}
.reminder-actions{display:flex;gap:4px;flex:0 0 auto}
.reminder-actions>.icon-button{color:var(--accent)}
.reminder-actions>.reminder-complete{background:var(--accent);color:#fff}
.reminder-actions>.reminder-complete:hover{background:#0057ad}

/* Quiet Glass · overlays · shared source */
dialog{color:var(--ink);padding:0;border:1px solid var(--line);border-radius:var(--panel-radius);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.04),0 28px 100px rgba(0,0,0,.2);max-width:calc(100vw - 40px);max-height:90vh;width:620px;overflow:hidden;outline:none}
dialog::backdrop{background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]{animation:none}
.dialog-close{position:absolute;right:16px;top:16px;z-index:5;border-radius:50%}
.dialog-close .icon-button{background:var(--glass-thick);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7)}
.dialog-content{max-height:86vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 20px 13px}
.dialog-top .card-meta{max-width:75%;overflow:hidden;text-overflow:ellipsis}
.dialog-tools{display:flex;align-items:center;justify-content:space-between;gap:5px;border-top:1px solid var(--line);padding:9px 19px;background:var(--card);flex-wrap:wrap}
.dialog-tools .tools-cluster{display:flex;gap:3px}
.preview-image{height:244px;width:calc(100% - 20px);margin:0 10px;object-fit:cover;border-radius:19px}
.preview-body{padding:28px 32px 32px}
.preview-body h1{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.45;white-space:pre-line}
.preview-body .preview-lead{margin-top:16px;font-size:16px;color:var(--muted);line-height:1.85;white-space:pre-line}
.preview-body .preview-sample{font-size:15px;line-height:1.9;color:var(--muted);margin-top:16px}
.preview-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:20px}
.preview-note{margin-top:20px;border-left:2px solid var(--line);padding:4px 0 4px 16px;font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-wrap}
.detail-task-list{margin-top:20px}
.detail-task-list .check-item{font-size:14px;min-height:44px}
#modal.reader{width:790px}
.reader .dialog-content{max-height:82vh}
.reader .dialog-top{position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line)}
.reader-body{padding:32px 68px 58px}
.reader-body h1{font-size:30px;line-height:1.4;font-weight:600;letter-spacing:-.035em;margin:0 0 24px}
.reader-body p{font-size:16px;line-height:1.95;margin:0 0 24px;color:var(--ink)}
.reader-body .reading-caption{font-size:12px;line-height:1.7;color:var(--muted);margin-bottom:28px}
.reader .preview-image{height:230px;width:100%;margin:0 0 28px}
.reader .reader-rule{height:1px;background:var(--line);margin:32px 0}
.reader-end{display:flex;justify-content:center;color:var(--secondary);padding:15px}
#modal.panel{width:440px;background:var(--card)}
.panel-content{padding:26px 26px 24px;max-height:82vh;overflow:auto}
.panel-content h1{font-size:22px;font-weight:600;margin:0 45px 24px 0;letter-spacing:-.03em}
.search-field{position:relative;margin-bottom:24px}
.search-field>.icon{position:absolute;left:14px;top:15px;color:var(--muted)}
.search-field input{width:100%;padding-left:41px;background:var(--surface)}
.field-label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:24px 0 10px}
.filter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 3px}
.panel-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:24px;padding-top:16px;gap:12px}
.panel-footer p{font-size:12px;color:var(--muted)}
.editor-note{width:100%;height:130px;min-height:100px;font-size:14px;line-height:1.8;background:var(--surface);margin-top:2px}
.tag-add{display:flex;align-items:center;gap:8px;margin-top:12px}
.tag-add input{width:100%;min-width:0;background:var(--surface)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:18px}
.setting-row span{font-size:14px}
.setting-row small{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.settings-note{font-size:13px;line-height:1.8;color:var(--muted);margin:18px 0 0}
.ai-panel{position:fixed;right:28px;bottom:102px;width:404px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 128px);display:flex;flex-direction:column;z-index:48;border-radius:25px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04),0 22px 80px rgba(0,0,0,.16);overflow:hidden}
.ai-panel[hidden]{display:none}
.ai-header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 16px 22px;gap:8px;flex-shrink:0}
.ai-header>div:last-child{display:flex;flex-shrink:0}
.ai-header h2{font-size:18px;font-weight:600;letter-spacing:-.025em}
.ai-header small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.ai-header small:before{content:"";width:5px;height:5px;display:inline-block;border-radius:50%;background:var(--secondary);margin-right:6px;vertical-align:1px}
.ai-contexts{max-height:254px;min-height:0;overflow:auto;padding:0 16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;scrollbar-width:thin;flex-shrink:1}
.context-heading{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:2px 3px 6px;flex-shrink:0}
.context-heading>span:last-child{color:var(--muted);font-size:12px}
.context-card{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:start;padding:12px 4px 12px 12px;background:var(--surface);border-radius:14px;flex-shrink:0}
.context-thumbnail{width:44px;height:52px;overflow:hidden;display:grid;place-items:center;border-radius:8px;background:var(--faint);color:var(--muted)}
.context-thumbnail img{width:100%;height:100%;object-fit:cover}
.context-copy{min-width:0}
.context-meta{font-size:11px;line-height:1.5;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;min-height:44px;text-align:left;padding:4px 0;background:none;border-radius:3px;font-size:13px;line-height:1.5;font-weight:500;letter-spacing:-.01em}
.context-title:hover{color:var(--accent)}
.context-summary{font-size:12px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.context-remove{margin-top:-4px;color:var(--muted)}
.ai-empty{padding:28px 24px 30px;color:var(--muted);text-align:center}
.ai-empty .icon{margin-bottom:14px;color:var(--muted)}
.ai-empty p{font-size:15px;line-height:1.8;letter-spacing:-.02em}
.ai-empty small{display:block;font-size:12px;margin-top:12px;color:var(--muted)}
.ai-messages{padding:16px 21px;max-height:230px;min-height:0;overflow:auto;overscroll-behavior:contain;flex-shrink:1;scrollbar-width:thin}
.ai-messages:empty{padding:0}
.message{font-size:14px;line-height:1.8;white-space:pre-wrap;margin-bottom:16px}
.message.user{background:var(--surface);color:var(--ink);margin-left:28px;padding:12px 14px;border-radius:16px 16px 4px 16px}
.message.demo{color:var(--ink);padding:4px 3px}
.message.demo .message-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.ai-compose{padding:16px;position:relative;flex-shrink:0}
.ai-compose textarea{width:100%;display:block;resize:none;min-height:108px;padding:13px 53px 13px 14px;background:var(--surface);line-height:1.7;font-size:14px;border:1px solid transparent;border-radius:16px}
.ai-compose textarea:focus{border-color:var(--accent)}
.ai-compose>.icon-button{position:absolute;right:23px;bottom:24px;background:var(--accent);color:#fff;width:44px;height:44px;min-width:44px;border-radius:12px}
.ai-compose>.icon-button:hover{background:var(--accent);filter:brightness(1.08)}
.drop-targets{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:20px;align-items:center}
.drop-targets[hidden]{display:none}
.drop-target{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;transition:transform 180ms,box-shadow 180ms}
.drop-target.drop-hot{transform:scale(1.15);color:var(--accent);box-shadow:0 0 0 8px rgba(0,102,204,.12),0 8px 25px rgba(0,0,0,.12)}
.drag-ghost{position:fixed;left:0;top:0;width:244px;pointer-events:none;z-index:200;border-radius:17px;border:1px solid var(--line);background:var(--glass-thick);box-shadow:0 20px 55px rgba(0,0,0,.2);display:flex;align-items:center;padding:10px;gap:12px;-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);transform:rotate(-3deg);will-change:left,top}
.drag-ghost img{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.drag-ghost .ghost-icon{width:44px;height:50px;display:grid;place-items:center;flex:0 0 auto;background:var(--surface);border-radius:10px}
.drag-ghost strong{font-weight:550;font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drag-ghost .drag-count{position:absolute;right:-7px;top:-7px;border-radius:50%;background:var(--accent);color:#fff;width:23px;height:23px;display:grid;place-items:center;font-size:11px}
body.is-dragging{cursor:grabbing!important;user-select:none}
body.is-dragging .feed-card,body.is-dragging #orb{cursor:grabbing!important}
body.is-dragging .card-actions,body.is-dragging .dock-tools{visibility:hidden!important;opacity:0!important}
body.is-dragging #selection-bar{visibility:hidden}
.media-player{position:relative;background:var(--surface);border-radius:17px;overflow:hidden;margin-top:20px;aspect-ratio:1.55}
.media-player img{height:100%;width:100%;object-fit:cover;opacity:.4;filter:saturate(.7)}
.media-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(0deg,rgba(245,245,247,.96),rgba(245,245,247,.25));flex-direction:column;gap:15px}
.media-slide b{font-size:24px;font-weight:550;letter-spacing:-.035em}
.media-slide span{font-size:14px;color:var(--ink);line-height:1.8}
.media-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.media-step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Quiet Glass · catalog · shared source */
.lab-card{padding:24px;cursor:default}
.lab-card .lab-number{display:block;font-size:10px;color:var(--muted);letter-spacing:.13em;margin-bottom:16px}
.lab-card h1{font-size:29px;font-weight:600;line-height:1.35;letter-spacing:-.035em;margin:0}
.lab-card h2{font-size:17px;font-weight:550;letter-spacing:-.025em}
.lab-card p{font-size:13px;line-height:1.7;color:var(--muted);margin-top:12px}
.lab-card .lab-preview{margin:22px 0 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lab-card .lab-footer{margin-top:24px;display:flex;gap:6px}
.lab-card .lab-caption{font-size:10px;line-height:1.7;color:var(--muted);margin-top:15px}
.lab-intro{background:var(--surface)}
.material-sample{position:relative;width:100%;height:148px;background:radial-gradient(ellipse at 25% 75%,#dae5ef,transparent 63%),radial-gradient(ellipse at 65% 20%,#e4e9ef,transparent 53%),var(--surface);border-radius:16px;display:grid;place-items:center}
.material-sample .glass{border-radius:24px;display:flex;padding:4px}
.swatches{display:flex;gap:10px;align-items:center;margin-top:22px}
.swatch{height:43px;flex:1;border-radius:12px;border:1px solid #00000008}
.type-sample{margin-top:20px;line-height:1.5;font-size:23px;letter-spacing:-.05em}
.type-sample small{display:block;margin-top:8px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
.ring-range{width:100%;accent-color:var(--accent);padding:0;margin-top:16px}
.motion-sample{height:98px;width:100%;display:grid;place-items:center;background:var(--surface);border-radius:17px}
.motion-cube{width:45px;height:45px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 10px #0000000a}
.lab-state-row{display:flex;gap:10px;margin-top:20px}
.lab-state{flex:1;min-width:0;background:white;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:11px}
.lab-state.read{background:var(--surface);color:var(--muted)}
.lab-state .mini-lines{height:4px;background:var(--line);width:90%;margin:10px 0;border-radius:3px}
.source-card{padding:25px}
.source-card h2{font-size:17px;line-height:1.55;word-break:break-word}
.source-card p{font-size:12px;line-height:1.9}
.source-card .source-link{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:22px;gap:10px}
.source-card .source-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Catalogue surfaces are separate from the product's quiet feed. */
body:is([data-view="icons"],[data-view="cards"],[data-view="library"],[data-view="sources"]){background:var(--canvas)}
body:is([data-view="icons"],[data-view="cards"],[data-view="library"],[data-view="sources"]) main{max-width:1424px;padding:58px 52px 130px}
.feed-grid.is-catalog{display:block;min-height:80vh;height:auto!important;--catalog-line:var(--line);--catalog-muted:var(--muted)}
.is-catalog .catalog-header{position:relative;padding:0 0 34px;margin:0 0 48px;border-bottom:1px solid var(--catalog-line)}
.catalog-eyebrow,.catalog-header .eyebrow,.catalog-header-eyebrow{display:block;font-size:10px;line-height:1.5;font-weight:500;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.catalog-header h1{font-size:52px;font-weight:600;line-height:1.14;letter-spacing:-.045em;margin:20px 0 16px}
.catalog-header p{font-size:14px;line-height:1.75;color:var(--muted);max-width:600px;margin:0}
.catalog-header-main,.catalog-header-title,.catalog-heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
.catalog-count{display:flex;align-items:baseline;gap:9px;color:var(--muted);flex-shrink:0;font-size:12px;font-variant-numeric:tabular-nums}
.catalog-count strong,.catalog-count b{font-size:44px;line-height:1;font-weight:400;letter-spacing:-.04em;color:var(--ink)}
.catalog-nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:30px}
.catalog-nav a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 16px;border:1px solid transparent;border-radius:24px;color:var(--muted);font-size:12px;transition:color var(--fast),background var(--fast),border-color var(--fast)}
.catalog-nav a:hover{background:var(--surface);color:var(--ink)}
.catalog-nav a[aria-current="page"],.catalog-nav a.is-active{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 1px 2px #00000005}
.catalog-nav a:last-child{margin-left:auto;color:var(--accent)}
.catalog-section{margin:0 0 54px;scroll-margin-top:24px;min-width:0}
.catalog-section-head,.catalog-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:24px}
.catalog-section-head h2,.catalog-section-heading h2{margin:7px 0 0;font-size:24px;font-weight:500;letter-spacing:-.045em;line-height:1.4}
.catalog-section-head>p,.catalog-section-heading>p{max-width:440px;font-size:13px;line-height:1.7;color:var(--catalog-muted);margin:0}
.catalog-section-head>.catalog-eyebrow+h2,.catalog-section-heading>.catalog-eyebrow+h2{margin:0}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.catalog-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;line-height:1.7;letter-spacing:0;color:var(--muted);overflow-wrap:anywhere}
.catalog-note,.catalog-caption,.specimen-caption{font-size:11px;line-height:1.85;color:var(--catalog-muted)}
.catalog-note{margin-top:18px}
.catalog-caption{margin-top:15px}
.catalog-note code,.catalog-caption code{padding:2px 4px;border-radius:4px;background:var(--surface)}

/* Specification copy stays available without competing with the specimen. */
.catalog-details{min-width:0;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.7}
.catalog-details>summary{min-height:44px;padding:12px 0;cursor:pointer;font-size:12px;line-height:20px;color:var(--muted)}
.catalog-details>summary:hover{color:var(--ink)}
.catalog-details>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.catalog-details[open]{padding-bottom:12px}
.catalog-details p{margin:0 0 10px;font-size:12px;line-height:1.75}
.catalog-details>code{display:block;font:11px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.component-details{margin-top:4px;padding-inline:2px}


/* Every glyph is the actual shared SVG, with a consistent optical stage. */
.icon-catalog-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:stretch}
.icon-tile{min-width:0;display:flex;flex-direction:column;background:transparent;border:0;border-radius:0;overflow:hidden}
.icon-tile:hover .icon-tile-preview{background:#e7e7ec}
.icon-tile-preview{display:grid;place-items:center;height:104px;background:var(--surface);border-radius:14px;color:var(--ink);transition:background var(--base)}
.icon-tile-trigger{width:48px;height:48px;min-width:48px;border-radius:15px}
.icon-tile-trigger>.icon{width:25px;height:25px}
.icon-tile-meta{padding:14px 4px 8px;flex:1}
.icon-tile-meta h3{font-size:13px;font-weight:550;line-height:1.5;margin:0 0 2px;letter-spacing:-.02em}
.icon-tile-meta p{font-size:10px;line-height:1.7;color:var(--muted);margin:8px 0 0}
.icon-tile-sizes{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px 4px;border-top:1px solid var(--line);color:var(--secondary)}
.icon-size-sample{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:28px}
.icon-size-sample>span{display:grid;place-items:center;height:32px}
.icon-size-sample small{font-size:9px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-state-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border-block:1px solid var(--line);overflow:hidden;background:var(--line)}
.icon-state-sample{display:grid;grid-template-columns:70px 1fr;grid-template-rows:auto auto;column-gap:16px;align-items:center;background:var(--card);padding:22px 24px}
.icon-state-preview{grid-row:1 / 3;display:grid;place-items:center;height:65px;width:65px;background:var(--surface);border-radius:16px;color:var(--ink)}
.icon-state-sample strong{font-size:13px;font-weight:550;align-self:end;padding-bottom:3px}
.icon-state-sample>span{font-size:10px;color:var(--muted);align-self:start;line-height:1.7}

/* Real CardShell specimens retain the same content and controls as the feed. */
.card-specimen{min-width:0}
.card-specimen>header{display:flex;flex-direction:column;gap:7px;margin:0 2px 14px}
.specimen-kicker{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);font-size:9px;letter-spacing:.075em;line-height:1.5}
.card-specimen>header h3{font-size:14px;line-height:1.5;font-weight:500;letter-spacing:-.02em;margin:0}
.catalog-card-stage{position:relative;min-width:0;padding:0}
.catalog-card-stage>.feed-card{position:relative;left:auto;top:auto;width:100%;transform:none!important;max-width:100%}
.card-specimen.is-passive .feed-card{cursor:default}
.card-specimen.is-passive .feed-card:hover{box-shadow:var(--shadow)}
.card-specimen.is-passive .card-more-trigger{visibility:hidden;opacity:0}
.catalog-state-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.card-specimen.is-passive .is-complete{background:var(--card);border-color:var(--line)}
.card-specimen.is-passive .is-snoozed{background:var(--surface);border-color:var(--line)}
.catalog-card-stage .is-bookmarked:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);z-index:2;pointer-events:none}
.catalog-caption strong{font-weight:550;color:var(--ink)}
.catalog-card-stage .feed-card.tools-open{z-index:10}

/* Components have a labelled specification area and a separate working stage. */
.catalog-component-grid,.component-catalog-grid,.catalog-grid:has(>.component-specimen){grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:stretch}
.component-specimen{min-width:0;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column}
.component-specimen.wide,.component-specimen.is-wide{grid-column:1/-1}
.component-specimen>header,.component-heading{padding:0 2px 18px}
.component-title{font-size:16px;font-weight:550;line-height:1.5;letter-spacing:-.035em;margin:7px 0 0}
.component-description{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 0;max-width:50em}
.component-preview{position:relative;padding:28px;display:flex;align-items:center;justify-content:center;flex:1;min-width:0;min-height:160px;overflow-wrap:anywhere;border-radius:16px;background:var(--card)}
.component-preview>input:not([type=range]),.component-preview>textarea{max-width:100%}
.component-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 2px;border:0;background:transparent}
.component-footer .specimen-caption{flex:1;min-width:100px;font-size:10px}
.component-footer .catalog-code{color:var(--muted)}
.component-specimen>.specimen-caption{padding:0 25px 20px}
.specimen-stack{display:flex;flex-direction:column;gap:12px;width:100%;min-width:0}
.specimen-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;min-width:0}
.specimen-states{display:flex;align-items:stretch;justify-content:center;gap:12px;flex-wrap:wrap;width:100%}
.specimen-state{display:flex;flex:1;min-width:70px;flex-direction:column;align-items:center;gap:14px;padding:14px 10px;font-size:11px;color:var(--muted)}
.specimen-state strong{font-size:11px;font-weight:500;color:var(--ink)}
.specimen-state>span,.specimen-state>small{font-size:10px;line-height:1.6}
.specimen-window{position:relative;width:100%;background:var(--card);border:0;border-radius:12px;padding:19px;min-width:0;overflow:hidden}
.specimen-toolbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px;border-radius:28px}
.specimen-menu{max-width:260px;width:100%;padding:5px;border:1px solid var(--line);border-radius:17px;background:var(--card);box-shadow:0 12px 30px #0000000d}
.specimen-menu .card-menu-item{font-size:12px}
.specimen-ai{width:100%;max-width:400px;padding:8px;background:transparent;border:0;border-radius:16px;display:flex;flex-direction:column;gap:16px}
.specimen-ai .context-card{width:100%}
.specimen-ai .ai-compose{padding:0}
.specimen-ai .ai-compose>.icon-button{right:7px;bottom:8px}
.specimen-ai .ai-compose textarea{min-height:96px}
.specimen-toast,.specimen-selection{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%;padding:5px 10px 5px 17px;border-radius:29px;font-size:12px}
.specimen-drop{display:flex;align-items:center;justify-content:center;gap:20px;min-height:102px;padding:18px 25px;border:1px dashed #b8c9df;border-radius:20px;background:var(--accent-soft)}
.specimen-drop .drop-target{position:relative}
.specimen-token{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 2px;border-bottom:1px solid var(--line);background:transparent;font-size:12px;min-width:0}
.specimen-token span{color:var(--muted)}
.specimen-token code{font-size:10px;overflow-wrap:anywhere}
.is-catalog .lab-card{position:relative;left:auto;top:auto;width:auto;height:auto;transform:none!important}
.is-catalog>.lab-card{margin-bottom:24px}
.is-catalog .source-card{height:100%;display:flex;flex-direction:column;box-shadow:none;background:var(--card);border-color:var(--line)}
.is-catalog .source-card h2{font-size:17px;line-height:1.6}
.is-catalog .source-card .source-link{margin-top:auto;padding-top:24px;min-height:44px;color:var(--accent)}
.is-catalog .source-card .lab-number{font-size:9px;letter-spacing:.11em}
.is-catalog .source-card p{margin-bottom:20px}
.catalog-section-head .eyebrow,.catalog-section-heading .eyebrow{display:block;font-size:10px;line-height:1.5;font-weight:500;letter-spacing:.14em;color:var(--muted)}
.catalog-caption p+p{margin-top:5px}

/* Component registry and independent reference index. */
.component-specimen>header>.specimen-caption{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.04em;color:var(--muted)}
.component-footer>code{flex:1;min-width:130px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}
.specimen-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.specimen-actions .text-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;font-size:12px;padding:6px 0 6px 10px;color:var(--accent)}
.specimen-focus{outline:2px solid var(--accent);outline-offset:4px}
.specimen-window h4{font-size:19px;font-weight:500;line-height:1.6;letter-spacing:-.04em;margin:17px 0 10px;white-space:pre-line}
.specimen-window>p{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 18px}
.specimen-reading{padding:25px 30px}
.specimen-reading h4{font-family:"Songti SC","Noto Serif CJK SC",STSong,serif;font-size:22px;line-height:1.65;font-weight:500}
.specimen-note{font-size:12px;line-height:1.7;margin-top:22px;padding:4px 14px;border-left:2px solid var(--line);color:var(--secondary)}
.specimen-media{width:100%;overflow:hidden;border-radius:17px;background:var(--surface)}
.specimen-media .card-image-wrap{margin:0;width:100%;border-radius:17px}
.specimen-media .card-image{height:206px}
.specimen-selection-icons{display:flex;align-items:center;gap:17px;padding:10px;color:var(--ink)}
.specimen-toast{background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px #0000000a;min-height:52px;color:var(--ink)}
.component-preview .empty-card{width:100%;max-width:100%;margin:0;padding:25px 20px;border:0;background:transparent;box-shadow:none;border-radius:16px}
.component-preview .empty-card h2{font-size:16px;font-weight:500}
.component-preview .empty-card p{font-size:11px;margin:9px 0 12px}
.component-preview .empty-icon{margin-bottom:11px}
.component-preview .specimen-menu,.component-preview .specimen-ai{margin-inline:auto}
.component-preview .attachment{margin-top:0;min-width:0}
.component-preview .field-label,.component-preview .setting-row,.component-preview .checklist{margin-top:0}
.component-preview .search-field{margin-bottom:0}
.component-preview .setting-row{border:0;padding:10px 0}
.component-preview .ai-compose{padding:0}
.component-preview .ai-compose>.icon-button{right:7px;bottom:8px}
.component-preview kbd{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:7px 9px;border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;background:var(--surface);color:var(--ink);white-space:nowrap}
.component-specimen.is-wide .specimen-ai{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:none;padding:18px}
.component-specimen.is-wide .specimen-ai .context-heading{grid-column:1/-1}
.source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.is-catalog .source-grid .source-card{min-width:0;border:1px solid var(--line);border-radius:18px;padding:25px;transition:box-shadow var(--base),border-color var(--base)}
.is-catalog .source-grid .source-card:hover{border-color:var(--line);box-shadow:0 5px 18px #00000006}
.source-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}
.source-topline>.specimen-caption{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--muted)}
.source-kind{font-size:9px;line-height:1.5;color:var(--muted);padding:4px 8px;background:var(--surface);border-radius:5px;letter-spacing:.02em}
.source-card h3{font-size:16px;line-height:1.55;font-weight:550;letter-spacing:-.035em;margin:0 0 12px}
.source-card h3 a{display:inline;box-decoration-break:clone}
.source-card h3 a:hover{color:var(--accent)}
.source-card .source-link{font-size:10px}

/* Quiet Glass · responsive · shared source */
body.opaque .glass,body.opaque .ai-panel,body.opaque .dock-tools .icon-button{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
body.opaque #orb{background:var(--card)}
@supports not (backdrop-filter:blur(1px)){.glass,.ai-panel,.dock-tools .icon-button{background:var(--card)}}
@media (max-width:1000px){main{padding:24px 24px 110px}}

 html{scrollbar-gutter:auto}

@media (hover:none){

}

}
@media (prefers-reduced-transparency:reduce){

 dialog::backdrop{background:rgba(0,0,0,.3);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
 body:not(.is-dragging) .feed-card:hover{transform:translateY(-2px)}
}

/* module: src/services/feed-policy.js */
/** Pure feed policy. Clock and item state are supplied by the caller. */
const FeedPolicy = {
 sorts:['priority','unread','time'],
 cooldown:60000,
 supports(c){return ['reminder','event','task'].includes(c.type);},
 trigger(c,s={}){
   if(s.snoozedUntil>0)return s.snoozedUntil;
   if(c.type==='event')return Number(c.start)-15*60000;
   if(c.type==='task')return Number(c.due)-30*60000;
   return c.type==='reminder'?Number(c.due):NaN;
 },
 key(c,s={}){return `${c.id}:${this.trigger(c,s)}`;},
 completed(c,s={}){
   if(s.reminderDone)return true;
   return c.type==='task'&&c.tasks?.length>0&&c.tasks.every(t=>s.taskDone?s.taskDone.includes(t.id):t.done);
 },
 eligible(c,s,now){
   const at=this.trigger(c,s);
   return this.supports(c)&&Number.isFinite(at)&&at>0&&at<=now&&
     !s.dismissed&&!this.completed(c,s)&&!(c.type==='event'&&c.end<=now)&&
     s.lastReminderKey!==this.key(c,s)&&(!s.lastNotifiedAt||now-s.lastNotifiedAt>=this.cooldown);
 },
 visible(c,s,status='all'){
   if(status==='snoozed')return s.snoozedUntil>0&&!s.dismissed&&!s.reminderDone;
   if(status==='dismissed')return !!s.dismissed;
   if(status==='done')return !!s.reminderDone;
   return !s.snoozedUntil&&!s.dismissed&&!s.reminderDone;
 },
 score(c,s,now){
   if(s.dismissed||this.completed(c,s))return -1;
   const at=this.trigger(c,s);
   const urgent=Number.isFinite(at)&&at<=now&&!(c.type==='event'&&c.end<=now);
   return (urgent?100:0)+Math.max(0,Math.min(10,Number(c.priority)||0));
 },
 sort(cards,mode,items,now){
   const unique=[...new Map(cards.map(c=>[c.id,c])).values()];
   return unique.map((c,index)=>({c,index})).sort((a,b)=>{
     const x=items[a.c.id]||{},y=items[b.c.id]||{};
     if(mode==='time')return (b.c.time||0)-(a.c.time||0)||a.index-b.index;
     if(mode==='unread')return Number(!!x.read)-Number(!!y.read)||a.index-b.index;
     return this.score(b.c,y,now)-this.score(a.c,x,now)||a.index-b.index;
   }).map(x=>x.c);
 },
 label(c,s,now){
   if(s.dismissed)return '已忽略提醒';
   if(s.reminderDone)return '提醒已完成';
   const at=s.snoozedUntil||c.due;
   if(!Number.isFinite(at))return c.meta||'提醒';
   const minutes=Math.ceil((at-now)/60000);
   return minutes>0?`${minutes} 分钟后${s.snoozedUntil?' · 已延后':''}`:s.snoozedUntil?'已到期 · 等待查看':'现在可以处理';
 }
};

/* module: src/data/store.js */
/** Browser-local demo state. v2 keeps v1 reading flags and adds reminder lifecycle. */
const Store = {
 key:'quiet-glass-v1', // Keep the original key so existing users migrate in place.
 state:{cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true},
 load(){
   this.state={cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true};
   let raw=null;
   try{raw=JSON.parse(localStorage.getItem(this.key)||'null');}
   catch{this.state.storageAvailable=false;}
   const valid=raw&&[1,2].includes(raw.version)&&raw.items&&typeof raw.items==='object'&&!Array.isArray(raw.items);
   if(valid){
     if(Number.isFinite(raw.demoStartedAt)&&raw.demoStartedAt>0)this.state.demoStartedAt=raw.demoStartedAt;
     this.state.freshIds=Array.isArray(raw.freshIds)?[...new Set(raw.freshIds.filter(id=>FreshCards.some(c=>c.id===id)))]:[];
     this.state.seconds=Math.max(0,Math.min(1e7,Number(raw.seconds)||0));
     this.state.preferences.reduceTransparency=!!raw.reduceTransparency;
     this.state.preferences.sort=FeedPolicy.sorts.includes(raw.sort)?raw.sort:'priority';
   }
   const offset=this.state.demoStartedAt-demoBase;
   this.state.cards=[...this.state.freshIds.map(id=>FreshCards.find(c=>c.id===id)),...SeedCards].map(c=>{
     const card={...c,tasks:c.tasks?.map(t=>({...t}))};
     for(const key of ['time','start','end','due'])if(Number.isFinite(card[key]))card[key]+=offset;
     return card;
   });
   if(valid){
     // Live cards arrive after authentication; restore their browser-local notes too.
     const restoredCards=window.__QG_RUNTIME__?Object.keys(raw.items).map(id=>({id})):this.state.cards;
     for(const c of restoredCards){
       const x=raw.items[c.id];if(!x||typeof x!=='object'||Array.isArray(x))continue;
       const timestamp=n=>Number.isFinite(n)&&n>0&&n<8.64e15?n:0;
       this.state.items[c.id]={
         seen:!!x.seen,read:!!x.read,bookmarked:!!x.bookmarked,later:!!x.later,tagsEdited:!!x.tagsEdited,
         progress:Math.max(0,Math.min(1,Number(x.progress)||0)),
         note:typeof x.note==='string'?x.note.slice(0,4000):'',
         tags:Array.isArray(x.tags)?x.tags.filter(s=>typeof s==='string').map(s=>s.slice(0,30)).slice(0,20):[],
         taskDone:Array.isArray(x.taskDone)?x.taskDone.filter(s=>typeof s==='string'):undefined,
         addedAt:timestamp(x.addedAt),snoozedUntil:timestamp(x.snoozedUntil),dismissed:!!x.dismissed,reminderDone:!!x.reminderDone,
         lastReminderKey:typeof x.lastReminderKey==='string'?x.lastReminderKey.slice(0,200):'',
         lastNotifiedAt:timestamp(x.lastNotifiedAt)
       };
       if(this.state.freshIds.includes(c.id)&&this.state.items[c.id].addedAt)c.time=this.state.items[c.id].addedAt;
     }
   }
   this.save(); // Persist the demo clock even when there has been no interaction yet.
   return this.state;
 },
 item(id){
   if(!this.state.items[id])this.state.items[id]={seen:false,read:false,bookmarked:false,later:false,progress:0,note:'',tags:[],snoozedUntil:0,dismissed:false,reminderDone:false,lastReminderKey:'',lastNotifiedAt:0};
   return this.state.items[id];
 },
 card(id){return this.state.cards.find(c=>c.id===id);},
 patch(id,values){Object.assign(this.item(id),values);this.save();},
 tags(c){const s=this.item(c.id);return s.tagsEdited?[...s.tags]:[...new Set([...(c.tags||[]),...s.tags])];},
 tasks(c){
   const done=this.item(c.id).taskDone;
   return (c.tasks||[]).map(t=>({...t,done:done?done.includes(t.id):t.done}));
 },
 insert(cards){
   const known=new Set(this.state.cards.map(c=>c.id));
   const additions=cards.filter(c=>{if(known.has(c.id))return false;known.add(c.id);return true;});
   this.state.cards=[...additions,...this.state.cards];
   for(const c of additions)this.item(c.id).addedAt=c.time;
   this.state.freshIds=this.state.cards.filter(c=>FreshCards.some(f=>f.id===c.id)).map(c=>c.id);
   this.save();return additions.length;
 },
 save(){
   try{localStorage.setItem(this.key,JSON.stringify({version:2,items:this.state.items,seconds:this.state.seconds,demoStartedAt:this.state.demoStartedAt,freshIds:this.state.freshIds,sort:this.state.preferences.sort,reduceTransparency:this.state.preferences.reduceTransparency}));}
   catch{this.state.storageAvailable=false;}
 },
 stats(){
   return {read:this.state.cards.filter(c=>this.item(c.id).read).length,
     saved:this.state.cards.filter(c=>this.item(c.id).bookmarked).length,
     done:this.state.cards.filter(c=>c.type==='task'&&this.tasks(c).every(t=>t.done)).length};
 }
};

const MotionEngine={
 query:matchMedia('(prefers-reduced-motion: reduce)'),
 panelAnimations:new WeakMap(),
 layoutAnimations:new WeakMap(),
 returnLayers:new Set(),
 get reduced(){return this.query.matches;},
 animate(el,keyframes,options={}){
   if(!el||!el.animate)return null;
   if(this.reduced){
     const opacity=keyframes.map(k=>({opacity:k.opacity??1}));
     return el.animate(opacity,{duration:70,easing:'linear',...options,delay:0,duration:70});
   }
   return el.animate(keyframes,{duration:260,easing:'cubic-bezier(.2,.75,.25,1)',...options});
 },
 enter(el,delay=0){return this.animate(el,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:320,delay});},
 press(el){return this.animate(el,[{transform:'scale(1)'},{transform:'scale(.93)',offset:.35},{transform:'scale(1)'}],{duration:240});},
 capture(el){
   if(!el)return null;
   const rect=el.getBoundingClientRect();
   if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight)return null;
   const title=el.querySelector('[data-shared="title"]')||el.querySelector('.card-title-button,h2,h1');
   return {rect,title:title?.getBoundingClientRect(),radius:getComputedStyle(el).borderTopLeftRadius};
 },

/* module: src/interactions/layout.js */
class FeedLayout{
 constructor(container){
   this.container=container;this.frame=0;
   this.onResize=()=>this.schedule(false);
   window.addEventListener('resize',this.onResize,{passive:true});
 }
 schedule(animate=false){
   cancelAnimationFrame(this.frame);
   this.frame=requestAnimationFrame(()=>this.layout(animate));
 }
 layout(animate=false){
   const el=this.container,width=el.clientWidth;
   if(el.classList.contains('is-catalog')){el.style.height='';return;}
   const items=[...el.querySelectorAll(':scope > .feed-card,:scope > .lab-card')];
   if(!items.length){el.style.height='';return;}
   if(!width)return;
   // A consistent column width lets content, rather than automatic spanning,
   // establish hierarchy. Short actions stay compact; reading cards have room.
   const cols=width>=1000?3:width>=650?2:1,gap=cols===1?16:24;
   const old=animate?new Map(items.map(n=>[n,n.getBoundingClientRect()])):null;
   el.dataset.columns=cols;
   items.forEach(n=>{
     n.classList.remove('is-featured');
     // Keep horizontal geometry inside the container before resize/RAF runs.
     n.style.width=`calc((100% - ${(cols-1)*gap}px) / ${cols})`;
   });
   const heights=Array(cols).fill(0);
   items.forEach(n=>{
     const span=1;
     let col=0,y=Infinity;
     for(let i=0;i<=cols-span;i++){
       const candidate=Math.max(...heights.slice(i,i+span));
       if(candidate<y){col=i;y=candidate;}
     }
     n.style.left=`calc((100% + ${gap}px) / ${cols} * ${col})`;n.style.top=y+'px';
     for(let i=col;i<col+span;i++)heights[i]=y+n.offsetHeight+gap;
   });
   el.style.height=(Math.max(...heights)-gap)+'px';
   if(old)items.forEach(n=>MotionEngine.flip(n,old.get(n)));
 }
}

/** Drag sources are immutable references. Drops trigger explicit application actions. */
class DragManager{
 constructor(app){
   this.app=app;this.pending=null;this.active=null;this.timer=0;this.suppressUntil=0;this.ghost=null;
   document.addEventListener('pointerdown',e=>{
     if(e.pointerType==='touch'||e.button!==0||app.dialog.open)return;
     const card=this.source(e.target);if(!card)return;
     this.pending={id:card.dataset.card,x:e.clientX,y:e.clientY,element:card};
   });
   document.addEventListener('pointermove',e=>{
     if(e.pointerType==='touch')return;
     if(this.pending&&!this.active&&Math.hypot(e.clientX-this.pending.x,e.clientY-this.pending.y)>8)this.start(this.pending);
     if(this.active){e.preventDefault();this.move(e.clientX,e.clientY);}
   });
   document.addEventListener('pointerup',e=>{
     if(e.pointerType==='touch')return;
     if(this.active)this.finish(e.clientX,e.clientY);this.pending=null;
   });
   document.addEventListener('pointercancel',e=>{
     // Touch has its own non-passive lifecycle below. A browser may cancel the
     // compatibility pointer stream before touchmove can prevent panning.
     if(e.pointerType==='touch')return;
     if(this.active)this.cancel();this.pending=null;
   });
   document.addEventListener('dragstart',e=>{if(e.target.closest?.('[data-card]'))e.preventDefault();});
   document.addEventListener('touchstart',e=>{
     if(e.touches.length!==1||app.dialog.open)return;
     const card=this.source(e.target);if(!card)return;
     const t=e.touches[0];this.pending={id:card.dataset.card,x:t.clientX,y:t.clientY,element:card};
     clearTimeout(this.timer);
     this.timer=setTimeout(()=>{if(this.pending)this.start(this.pending);},380);
   },{passive:true});
   document.addEventListener('touchmove',e=>{
     const t=e.touches[0];if(!t)return;
     if(this.active){e.preventDefault();this.move(t.clientX,t.clientY);}
     else if(this.pending&&Math.hypot(t.clientX-this.pending.x,t.clientY-this.pending.y)>8){clearTimeout(this.timer);this.pending=null;}
   },{passive:false});
   document.addEventListener('touchend',e=>{
     clearTimeout(this.timer);
     if(this.active){e.preventDefault();const t=e.changedTouches[0];this.finish(t.clientX,t.clientY);}
     this.pending=null;
   },{passive:false});
   document.addEventListener('touchcancel',()=>{clearTimeout(this.timer);this.cancel();this.pending=null;},{passive:true});
   document.addEventListener('keydown',e=>{if(e.key==='Escape'&&this.active){e.preventDefault();e.stopImmediatePropagation();this.cancel();}},true);
   window.addEventListener('blur',()=>this.cancel());
 }
 source(target){
   if(!(target instanceof Element)||target.closest('button,input,textarea,a,dialog,.card-actions'))return null;
   return target.closest('[data-card]');
 }
 start(p){
   if(this.active)return;
   const ids=this.app.selected.has(p.id)?[...this.app.selected]:[p.id],c=Store.card(p.id);if(!c)return;
   this.active={...p,ids,hot:null};this.suppressUntil=Date.now()+1000;
   document.body.classList.add('is-dragging');
   document.querySelectorAll('[data-card]').forEach(n=>{if(ids.includes(n.dataset.card))n.classList.add('is-drag-source');});
   document.getElementById('drop-targets').hidden=false;
   this.ghost=document.createElement('div');this.ghost.className='drag-ghost';
   this.ghost.innerHTML=`${c.image?`<img src="${Assets[c.image]}" alt="">`:`<span class="ghost-icon">${icon(CardTypes[c.type].icon,23)}</span>`}<strong>${esc(c.title)}</strong>${ids.length>1?`<span class="drag-count">${ids.length}</span>`:''}`;
   document.body.appendChild(this.ghost);this.move(p.x,p.y);MotionEngine.enter(this.ghost);
   this.app.announce(`已提起${ids.length}张卡片。移动到 AI、收藏、稍后读或标签区域，或按 Escape 取消。`);
 }
 hit(x,y){
   return [...document.querySelectorAll('[data-drop]')].filter(n=>!n.hidden&&n.getClientRects().length).find(n=>{
     const r=n.getBoundingClientRect(),pad=n.id==='orb'?20:10;
     return x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad;
   })||null;
 }
 move(x,y){
   if(!this.active||!this.ghost)return;
   this.ghost.style.left=Math.max(8,Math.min(innerWidth-252,x-120))+'px';
   this.ghost.style.top=Math.max(8,y-45)+'px';
   const hot=this.hit(x,y);
   if(hot!==this.active.hot){
     this.active.hot?.classList.remove('drop-hot');hot?.classList.add('drop-hot');this.active.hot=hot;
   }
 }
 finish(x,y){
   if(!this.active)return;
   const active=this.active,target=this.hit(x,y),ghost=this.ghost;
   this.cleanup();
   if(target){
     const rect=target.getBoundingClientRect(),r=ghost.getBoundingClientRect();
     MotionEngine.animate(ghost,[{opacity:1,transform:'rotate(-3deg) scale(1)'},{opacity:0,transform:`translate(${rect.left+rect.width/2-r.left-r.width/2}px,${rect.top+rect.height/2-r.top-r.height/2}px) scale(.28)`}],{duration:250});
     setTimeout(()=>ghost.remove(),260);
     this.app.drop(active.ids,target.dataset.drop);
   }else{
     const rect=active.element.getBoundingClientRect(),r=ghost.getBoundingClientRect();
     MotionEngine.animate(ghost,[{opacity:1,transform:'rotate(-3deg)'},{opacity:0,transform:`translate(${rect.left+rect.width/2-r.left-r.width/2}px,${rect.top+rect.height/2-r.top-r.height/2}px) scale(.8)`}],{duration:220});
     setTimeout(()=>ghost.remove(),230);this.app.announce('拖拽已取消，卡片没有变化。');
   }
 }
 cancel(){if(this.active)this.finish(-1000,-1000);}
 cleanup(){
   this.active?.hot?.classList.remove('drop-hot');document.body.classList.remove('is-dragging');
   document.querySelectorAll('.is-drag-source').forEach(n=>n.classList.remove('is-drag-source'));
   document.getElementById('drop-targets').hidden=true;
   this.active=null;this.pending=null;this.ghost=null;this.suppressUntil=Date.now()+400;
 }
}

   el.innerHTML=`${icon(['grid','grip','sparkles','check'][this.mediaIndex],32)}<b>${labels[this.mediaIndex]}</b><span>${esc(c.body[this.mediaIndex])}</span>`;
   document.getElementById('media-step').textContent=`${this.mediaIndex+1} / 4`;
   MotionEngine.enter(el);
 }
 pauseMedia(){clearInterval(this.mediaTimer);this.mediaTimer=null;const b=this.dialog?.querySelector('[data-action="media-play"]');if(b){b.innerHTML=icon('play');b.setAttribute('aria-label','播放演示片段');}}
 playMedia(){
   if(this.mediaTimer){this.pauseMedia();return;}
   if(this.mediaIndex===3)this.mediaIndex=0;
   this.paintMedia();const b=this.dialog.querySelector('[data-action="media-play"]');b.innerHTML=icon('pause');b.setAttribute('aria-label','暂停演示片段');
   this.mediaTimer=setInterval(()=>{
     if(document.hidden)return;
     if(this.mediaIndex<3){this.mediaIndex++;this.paintMedia();Store.patch(this.currentId,{progress:(this.mediaIndex+1)/4,read:this.mediaIndex===3});this.refreshCard(this.currentId);}
     else this.pauseMedia();
   },2500);
 }
 tick(){
   if(!document.hidden){
     this.checkReminders();
     const minute=Math.floor(Date.now()/60000);
     if(this.clockMinute!==minute){this.clockMinute=minute;
       this.grid.querySelectorAll('[data-card]').forEach(node=>{
         const c=Store.card(node.dataset.card);
         const label=node.querySelector(c?.type==='event'?'.event-meta span':'.reminder-label');
         if(label)label.textContent=c.type==='event'?eventRelative(c):FeedPolicy.label(c,Store.item(c.id),Date.now());
       });
     }
   }
   if(this.modalKind==='reader'&&this.dialog.open&&!document.hidden&&Date.now()-this.lastActivity<60000){
     Store.state.seconds++;
     document.querySelectorAll('[data-live-time]').forEach(n=>n.textContent=minutes(Store.state.seconds));
     if(Store.state.seconds%5===0)Store.save();
   }
 }
 download(name,text,type='text/plain'){
   const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 click(e){
   if(Date.now()<this.drag.suppressUntil)return;
   const el=e.target.closest?.('[data-action]');
   if(el?.closest('.card-more-menu'))this.closeMore(true);
   else if(!el?.matches('[data-action="card-more"]')&&!e.target.closest?.('.card-more-menu'))this.closeMore();
   if(el){e.preventDefault();e.stopPropagation();this.action(el.dataset.action,el.dataset.id,el.dataset.extra,el,e);return;}
   const card=e.target.closest?.('[data-card]');
   if(card&&!e.target.closest('button,a,input,textarea')){this.navigate('#card/'+card.dataset.card);return;}
 }
 action(name,id='',extra='',el=null,event=null){
   switch(name){
     case 'orb':{
       const touch=event?.pointerType==='touch'||event?.sourceCapabilities?.firesTouchEvents||matchMedia('(hover:none)').matches;
       if(touch&&!this.touchDockExpanded){this.touchDockExpanded=true;this.openDock();}else this.openAI();break;
     }
     case 'ai':this.openAI();break;
     case 'filter':this.openPanel('filter');break;
     case 'settings':this.openPanel('settings');break;
     case 'refresh':this.refresh();break;
     case 'show-new':this.showNew();break;
     case 'top':window.scrollTo({top:0,behavior:MotionEngine.reduced?'instant':'smooth'});break;
     case 'view-feed':case 'view-icons':case 'view-cards':case 'view-library':case 'view-sources':this.closeNative();this.navigate('#'+name.slice(5));break;
     case 'card-open':case 'preview':this.navigate('#card/'+id);break;
     case 'context-preview':this.closeAI();this.navigate('#card/'+id);break;
     case 'reader':this.navigate('#read/'+id);break;
     case 'close':this.closeModal();break;
     case 'card-ai':this.attach([id]);break;
     case 'bookmark':this.setFlag(id,'bookmarked',!Store.item(id).bookmarked);break;
     case 'later':this.setFlag(id,'later',!Store.item(id).later);break;
     case 'task':this.toggleTask(id,extra);break;
     case 'edit':this.bulkEditIds=null;this.openPanel('editor',id);break;
     case 'card-more':this.more(id);break;
     case 'toggle-read':{
       const before={...Store.item(id)},read=!before.read;Store.patch(id,{read,seen:read,progress:read?1:0});this.refreshCard(id);
       this.toast(read?'已标记为已读':'已恢复为未读',()=>{Store.patch(id,before);this.refreshCard(id);});break;
     }
     case 'select':this.selected.has(id)?this.selected.delete(id):this.selected.add(id);this.updateSelection();break;
     case 'clear-selection':this.selected.clear();this.updateSelection();break;
     case 'selected-ai':this.attach([...this.selected]);break;
     case 'selected-bookmark':this.drop([...this.selected],'bookmark');this.selected.clear();this.updateSelection();break;
     case 'sort-feed':if(FeedPolicy.sorts.includes(extra)){this.sort=extra;this.feedNow=Date.now();Store.state.preferences.sort=extra;Store.save();this.repaintFilter();}break;
     case 'filter-type':this.filter.type=extra;this.repaintFilter();break;
     case 'filter-status':this.filter.status=extra;this.repaintFilter();break;
     case 'filter-tag':this.filter.tag=this.filter.tag===extra?'':extra;this.repaintFilter();break;
     case 'clear-filter':this.filter={type:'all',status:'all',tag:'',query:''};if(this.modalKind==='filter')this.repaintFilter();else this.renderCurrent(true);break;
     case 'apply-filter':this.closeNative();this.mode='feed';this.baseMode='feed';history.replaceState({glass:true,prev:null},'','#feed');this.renderCurrent(true);window.scrollTo(0,0);break;
     case 'editor-tag':this.editTags.has(extra)?this.editTags.delete(extra):this.editTags.add(extra);el.classList.toggle('active',this.editTags.has(extra));el.setAttribute('aria-pressed',this.editTags.has(extra));break;
     case 'add-tag':{
       const field=document.getElementById('tag-new'),value=field.value.trim().slice(0,30);if(!value)return;
       if(this.editTags.size>=20){this.toast('最多保留 20 个标签');return;}
       this.editTags.add(value);const tags=document.getElementById('editor-tags');
       const b=[...tags.querySelectorAll('button')].find(n=>n.dataset.extra===value);
       if(b){b.classList.add('active');b.setAttribute('aria-pressed','true');}else tags.insertAdjacentHTML('beforeend',tagChip(value,true,'editor-tag'));
       field.value='';break;
     }
     case 'save-note':{
       const note=document.getElementById('note-editor').value.slice(0,4000);
       const ids=this.bulkEditIds||[id];
       ids.forEach((cardId,i)=>{Store.patch(cardId,{tags:[...this.editTags],tagsEdited:true,...(i===0?{note}:{})});this.refreshCard(cardId);});
       this.bulkEditIds=null;this.closeModal();this.toast(Store.state.storageAvailable?'标签与备注已保存':'本次已保存；当前环境不能持久存储');break;
     }
     case 'toggle-transparency':Store.state.preferences.reduceTransparency=!Store.state.preferences.reduceTransparency;Store.save();document.body.classList.toggle('opaque',Store.state.preferences.reduceTransparency);document.querySelectorAll('[data-action="toggle-transparency"]').forEach(n=>n.setAttribute('aria-checked',Store.state.preferences.reduceTransparency));break;
     case 'undo':if(this.undoAction){const fn=this.undoAction;this.undoAction=null;fn();this.toast('已撤销');}break;
     case 'ai-close':this.closeAI();break;
     case 'ai-clear':this.contexts=[];this.messages=[];this.aiVersion=(this.aiVersion||0)+1;this.aiBusy=false;this.paintAI();break;
     case 'ai-remove':{
       const index=this.contexts.indexOf(id);this.contexts=this.contexts.filter(x=>x!==id);this.paintAI();
       const next=this.contexts[Math.min(Math.max(0,index),this.contexts.length-1)];
       const target=next?document.getElementById('ai-contexts').querySelector(`.context-card[data-context="${CSS.escape(next)}"] .context-remove`):null;
       (target||document.getElementById('ai-input')).focus({preventScroll:true});break;
     }
     case 'ai-send':this.sendAI();break;
     case 'external':{const url=Store.card(id)?.url;if(url&&url.startsWith('https://'))window.open(url,'_blank','noopener,noreferrer');break;}
     case 'download-calendar':{
       const c=Store.card(id),date=x=>new Date(x).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
       this.download('quiet-glass-demo.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Quiet Glass//Demo//ZH\r\nBEGIN:VEVENT\r\nUID:${c.id}@quiet-glass.demo\r\nDTSTAMP:${date(Date.now())}\r\nDTSTART:${date(c.start)}\r\nDTEND:${date(c.end)}\r\nSUMMARY:演示-${c.title}\r\nDESCRIPTION:演示日程，不包含真实会议链接。\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`,'text/calendar');this.toast('已生成演示日程文件');break;
     }
     case 'download-attachment':{
       const c=Store.card(id);
       if(c.attachment.endsWith('.csv'))this.download('demo-analysis.csv','\ufeff方案,演示评价\n常驻工具,干扰较多\n按需显现,保留内容重点\n仅手势,需要替代入口\n','text/csv');
       else this.download(c.attachment,'方案对比 · 演示附件\n\n方向一：常驻导航。容易发现功能，但会占据阅读空间。\n方向二：按需显现。内容优先，操作在需要时出现。\n方向三：仅靠手势。视觉最干净，但需要提供等价的点击入口。\n\n这是本地交互演示内容，不是来自真实邮箱的文件。');
       this.toast('已生成演示附件');break;
     }
     case 'snooze':case 'dismiss-reminder':case 'complete-reminder':case 'restore-reminder':this.changeReminder(id,name);break;
     case 'media-play':this.playMedia();break;
     case 'media-next':this.pauseMedia();this.mediaIndex=Math.min(3,this.mediaIndex+1);this.paintMedia();break;
     case 'media-prev':this.pauseMedia();this.mediaIndex=Math.max(0,this.mediaIndex-1);this.paintMedia();break;
     case 'catalog-check':{
       const done=el.getAttribute('aria-checked')!=='true';el.setAttribute('aria-checked',String(done));el.classList.toggle('is-done',done);el.querySelector('.check-dot').innerHTML=done?icon('check',12):'';break;
     }
     case 'catalog-context-remove':{
       const stage=el.closest('.component-preview'),cards=[...stage.querySelectorAll('.context-card')],card=el.closest('.context-card'),index=cards.indexOf(card);
       const focus=cards[index+1]?.querySelector('.context-remove')||cards[index-1]?.querySelector('.context-remove')||stage.closest('.component-specimen').querySelector('.component-footer button');card?.remove();
       const count=stage.querySelectorAll('.context-card').length,heading=stage.querySelector('.context-heading');
       if(heading)heading.innerHTML=count?`<span>${count} 个引用</span><small>发送前可调整</small>`:'<span>还没有引用</span><small>可从卡片加入 AI</small>';focus?.focus({preventScroll:true});break;
     }
     case 'catalog-compose':{
       const value=el.closest('.ai-compose').querySelector('textarea').value;this.openAI();document.getElementById('ai-input').value=value;document.getElementById('ai-input').focus();break;
     }
     case 'catalog-toast':this.toast('收藏已保存',()=>this.toast('已撤销'));break;
     case 'lab-icon':MotionEngine.press(el);if(extra==='refresh')MotionEngine.animate(el.querySelector('svg'),[{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:550});else el.classList.toggle('active');break;
     case 'lab-tag':el.classList.toggle('active');el.setAttribute('aria-pressed',el.classList.contains('active'));break;
     case 'lab-motion':{
       const n=document.getElementById('motion-cube');
       if(extra==='enter')MotionEngine.enter(n);
       else if(extra==='lift')MotionEngine.animate(n,[{transform:'translateY(0)'},{transform:'translateY(-17px) scale(1.06)',offset:.5},{transform:'translateY(0)'}],{duration:520});
       else MotionEngine.animate(n,[{transform:'scale(1)'},{transform:'scale(.82)',offset:.25},{transform:'scale(1.06)',offset:.7},{transform:'scale(1)'}],{duration:450});break;
     }
   }
 }
 repaintFilter(){
   const active=document.activeElement,searchFocused=active?.id==='filter-search',pos=active?.selectionStart;
   const action=active?.dataset.action,extra=active?.dataset.extra;
   const liveToast=document.getElementById('toast');if(liveToast&&this.dialog.contains(liveToast))document.body.appendChild(liveToast);
   this.dialog.innerHTML=Panels.filter(this);
   if(searchFocused){const n=document.getElementById('filter-search');n.focus();try{n.setSelectionRange(pos,pos);}catch{}}
   if(!searchFocused&&action){[...this.dialog.querySelectorAll('[data-action]')].find(n=>n.dataset.action===action&&n.dataset.extra===extra)?.focus({preventScroll:true});}
   if(this.mode==='feed')this.renderCurrent(false);this.updateFilterIndicator();
 }
 input(e){
   const name=e.target.dataset.input;
   if(name==='search'){
     this.filter.query=e.target.value;
     document.getElementById('filter-result').textContent=`${this.filtered().length} 张卡片`;
     clearTimeout(this.searchTimer);this.searchTimer=setTimeout(()=>{if(this.mode==='feed')this.renderCurrent(false);this.updateFilterIndicator();},140);
   }else if(name==='lab-ring'){
     const value=Number(e.target.value)/100;
     document.getElementById('lab-rings').innerHTML=ring(value,24)+ring(value,36)+ring(value,52)+ring(value,22);
   }
 }
 key(e){
   const menu=e.target.closest?.('.card-more-menu');
   if(menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
     const items=[...menu.querySelectorAll('button')],index=items.indexOf(document.activeElement);
     const next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
     e.preventDefault();items[next]?.focus();return;
   }
   if(e.key==='Escape'&&this.grid.querySelector('.card-more-menu')){e.preventDefault();this.closeMore(true);return;}
   if(e.key==='Tab'&&this.dialog.open){
     const focusable=[...this.dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(n=>n.getClientRects().length&&getComputedStyle(n).visibility!=='hidden');
     const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
     if(first&&last){
       if(e.shiftKey&&(active===first||!focusable.includes(active))){e.preventDefault();last.focus();return;}
       if(!e.shiftKey&&active===last){e.preventDefault();first.focus();return;}
     }
   }
   if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();this.openPanel('filter');return;}
   if(e.isComposing)return;
   if(e.target.id==='ai-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.sendAI();return;}
   if(e.target.id==='tag-new'&&e.key==='Enter'){e.preventDefault();this.action('add-tag',this.editId);return;}
   if(e.key==='Escape'&&!this.dialog.open){if(!document.getElementById('ai-panel').hidden)this.closeAI();this.hideDock();return;}
   if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();this.navigate('#card/'+e.target.dataset.card);}
 }
}
