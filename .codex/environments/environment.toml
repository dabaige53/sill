version = 1
name = "sill"

[setup]
script = '''
set -eu
node -e 'if (Number(process.versions.node.split(".")[0]) < 24) { console.error("Sill requires Node.js 24+"); process.exit(1); }'
npm ci
npm run build'''

[cleanup]
script = '''
set -eu
rm -rf -- node_modules dist tests/artifacts apps/apple/.build'''

[[actions]]
name = "启动本地页面"
icon = "run"
command = "npm run build && node --input-type=module -e 'import { startLocal } from \"./server/local/index.ts\"; const server = await startLocal({ port: 0 }); console.log(\"http://127.0.0.1:\" + server.address().port + \"/#feed\");'"

[[actions]]
name = "运行检查"
icon = "test"
command = "npm test"

[[actions]]
name = "构建 Mac"
