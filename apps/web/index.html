<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>Sill · {{TITLE}}</title>
<script id="sill-theme-bootstrap">
(() => {
  let preference = "system";
  try {
    const saved = localStorage.getItem("sill-theme");
    if (saved === "light" || saved === "dark") preference = saved;
  } catch {}
  const theme = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.dataset.themePreference = preference;
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
  // In a Home Screen app the transparent status bar reveals page pixels.
  // Do not also request a separately painted browser-chrome color.
  if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) {
    document.documentElement.dataset.standalone = "true";
    for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.remove();
  }
})();
</script>
</head>
<body>
<noscript>{{COPY:web.javascriptRequired}}</noscript>
<script>window.__PAGE__="feed";</script>
<script type="module" src="/index.ts"></script>
</body>
</html>
