name: Setup Sill CI
description: Prepare the existing Node runtime and npm dependencies
inputs:
  node-version:
    description: Node major version for this job
    required: true
  cache:
    description: npm to restore the package download cache, empty to disable
    default: ''
  cache-write:
    description: Allow the designated job to save npm downloads on main or manual runs
    default: 'false'
  install:
    description: standard, ignore-scripts, or none
    default: standard
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Identify npm cache
      if: ${{ inputs.cache == 'npm' }}
      id: npm
      shell: bash
      run: |
        echo "path=$(npm config get cache)/_cacache" >> "$GITHUB_OUTPUT"
        echo "version=$(node --version)-npm$(npm --version)" >> "$GITHUB_OUTPUT"
    - name: Restore npm downloads
      if: ${{ inputs.cache == 'npm' }}
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.npm.outputs.path }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ steps.npm.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - name: Install dependencies
      if: ${{ inputs.install == 'standard' }}
      shell: bash
      run: npm ci
    - name: Install dependencies without lifecycle scripts
      if: ${{ inputs.install == 'ignore-scripts' }}
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Save npm downloads
      if: ${{ inputs.cache == 'npm' && inputs.cache-write == 'true' && steps.restore.outputs.cache-hit != 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.npm.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
