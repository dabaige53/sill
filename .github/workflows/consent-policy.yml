name: Offline MCP consent policy
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: sill-consent-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          install: none
      - run: npm run ci:test:consent
