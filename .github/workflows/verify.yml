name: Verify Sill
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: sill-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          install: ignore-scripts
      - name: Verify source, generated pages and core behavior
        run: npm run ci:verify:web
  browser:
    name: browser (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [motion, navigation, layout]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          install: ignore-scripts
      - name: Build browser fixture
        run: npm run ci:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run ci:test:web-browser -- ${{ matrix.group }}
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ matrix.group }}
          path: tests/artifacts/
          if-no-files-found: ignore
