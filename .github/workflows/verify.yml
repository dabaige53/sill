name: Verify Sill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source, generated pages and core behavior
        run: npm run lint:web && npm test && node scripts/verify.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: tests/artifacts/
          if-no-files-found: ignore
  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:apple
      - run: npm run build:macos && npm run test:macos
