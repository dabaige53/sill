name: Verify Sill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source, generated pages and core behavior
        run: npm run lint:web && npm test && node scripts/verify.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: |
          status=0
          npm run test:material-density || status=1
          npm run test:motion-material || status=1
          npm run test:pwa-touch || status=1
          node tests/e2e/photo-toolbar-browser.ts || status=1
          node tests/e2e/card-actions-settings-browser.ts || status=1
          node tests/e2e/drawer-browser.ts || status=1
          node tests/e2e/search-browser.ts || status=1
          node tests/e2e/refresh-motion-browser.ts || status=1
          npm run test:browser || status=1
          npm run test:selection-browser || status=1
          exit "$status"
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: tests/artifacts/
          if-no-files-found: ignore
