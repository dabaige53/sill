name: Verify Quiet Glass
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify source, generated pages and core behavior
        run: python3 tests/verify.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Verify stack gestures and reading widths
        run: node tests/stack-browser.cjs
      - name: Build and verify isolated public preview
        run: |
          bash deploy/preview/rebuild.sh
          node deploy/preview/verify.cjs
          SILL_TEST_HTML=deploy/preview/index.html node tests/stack-browser.cjs
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: tests/artifacts/
          if-no-files-found: ignore
