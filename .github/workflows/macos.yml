name: Verify Sill macOS
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      card_content:
        description: Verify shared card content without browser automation
        type: boolean
        default: false
concurrency:
  group: sill-macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          install: ignore-scripts
          cache: npm
          cache-write: 'true'
      - uses: ./.github/actions/swift-cache
        id: swift-cache
        with:
          configuration: debug
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check Apple formatting
        run: npm run lint:apple
      - name: Verify shared card content
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.card_content }}
        run: npm run ci:verify:card-content
      - name: Run Swift tests without UI automation
        if: ${{ !cancelled() }}
        run: npm run ci:test:apple
      - uses: ./.github/actions/swift-cache
        if: ${{ success() && steps.swift-cache.outputs.cache-hit != 'true' }}
        with:
          configuration: debug
          save: 'true'
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
