name: Verify Sill macOS
on:
  workflow_call:
  push:
    branches: [main]
    paths: &apple-inputs
      - 'apps/apple/**'
      - 'contracts/**'
      - 'design-system/**'
      - 'assets/**'
      - 'tests/apple/**'
      - 'scripts/build-macos.ts'
      - 'scripts/format.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.swift-format'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *apple-inputs
  workflow_dispatch:
    inputs:
      card_content:
        description: Verify shared card content without browser automation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Apple formatting
        run: npm run lint:apple
      - name: Verify shared card content
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.card_content }}
        run: |
          npm run contracts:check
          npm run lint:web
          npm run typecheck
          npm run build
          node --import tsx --test tests/web/card.test.ts tests/web/card-metadata.test.ts tests/web/card-content.test.ts tests/web/cloud-card.test.ts tests/contracts/card.test.ts tests/server/card-display-policy.test.ts
      - name: Run Swift tests without UI automation
        if: ${{ !cancelled() }}
        run: node tests/apple/run.ts
