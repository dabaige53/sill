name: Build Sill DMG
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Match local builds: Xcode 27.2 on macOS 27, so CI and local apps link and render the same way.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
          install: ignore-scripts
          cache: npm
          cache-write: 'true'
      - uses: ./.github/actions/swift-cache
        id: swift-cache
        with:
          configuration: release
      - name: Import stable signing certificate
        env:
          CERTIFICATE: ${{ secrets.SILL_MAC_SIGNING_P12 }}
          PASSWORD: ${{ secrets.SILL_MAC_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$CERTIFICATE" -a -n "$PASSWORD" || { echo "::error::SILL_MAC_SIGNING_P12 secrets are missing"; exit 1; }
          keychain="$RUNNER_TEMP/sill-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/sill-signing.p12"
          security import "$RUNNER_TEMP/sill-signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sill-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-certificate -c "Sill Self-Signed" -Z "$keychain" | awk '/SHA-1/ { print $3 }')"
          test -n "$identity" || { echo "::error::Signing certificate not found"; exit 1; }
          echo "SILL_MAC_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: npm run build:macos
      - name: Check stable designated requirement
        run: codesign -d -r- dist/macos/Sill.app 2>&1 | grep -q 'certificate leaf'
      - name: Check the app keeps the Web-matched appearance
        run: test "$(plutil -extract UIDesignRequiresCompatibility raw dist/macos/Sill.app/Contents/Info.plist)" = true
      - name: Package and verify internal DMG
        run: npm run package:macos
      - uses: ./.github/actions/swift-cache
        if: ${{ success() && steps.swift-cache.outputs.cache-hit != 'true' }}
        with:
          configuration: release
          save: 'true'
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/macos/*-internal.dmg
            dist/macos/*-internal.json
            dist/macos/installer-background.png
          if-no-files-found: error
