name: Sill integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: sill-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # PGlite hits Node 24's Wasm cleanup crash: nodejs/node#66366.
          # Match the Node 26 runtime used for the local release checks.
          node-version: '26'
          cache: npm
          cache-write: 'true'
      - run: npm test
      - run: npm run plugin:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local-browser
      - name: Retain live integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-verification
          path: tests/artifacts/
          if-no-files-found: ignore
