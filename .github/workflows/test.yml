name: Sill integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # PGlite hits Node 24's Wasm cleanup crash: nodejs/node#66366.
          # Match the Node 26 runtime used for the local release checks.
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run plugin:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local-browser
      - name: Retain live integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-integration-verification
          path: tests/artifacts/
          if-no-files-found: ignore
