name: Sill authenticated data
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Node service coverage runs once in test.yml via npm test.
      - run: npm run test:supabase:postgres
      - id: cloudbuild
        run: npm run build:cloud
      - id: chromium
        run: npx playwright install --with-deps chromium
      - if: ${{ !cancelled() && steps.cloudbuild.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:cloud-browser
      - if: ${{ !cancelled() && steps.cloudbuild.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:cloud-app-browser
      - if: ${{ !cancelled() && steps.cloudbuild.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:cloud-operations
      - if: ${{ !cancelled() && steps.cloudbuild.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:cloud-welcome
      - if: ${{ !cancelled() && steps.cloudbuild.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:oauth-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-data-evidence
          path: |
            tests/artifacts/cloud-*.png
            tests/artifacts/cloud-recovery/
            tests/artifacts/oauth-*.png
          if-no-files-found: ignore
