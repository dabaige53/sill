name: Sill authenticated data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:supabase
      - run: npm run test:oauth
      - run: npm run test:cloud-app
      - run: npm run test:supabase:postgres
      - run: npm run build:cloud
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud-browser
      - run: npm run test:cloud-app-browser
      - run: npm run test:cloud-welcome
      - run: npm run test:oauth-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-data-evidence
          path: |
            tests/artifacts/cloud-*.png
            tests/artifacts/cloud-recovery/
            tests/artifacts/oauth-*.png
          if-no-files-found: ignore
