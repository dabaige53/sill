<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Sill · 授权设计预览</title><style>
:root{--card:#fff;--ink:#1d1d1f;--secondary:#68686d;--surface:#f0f0f2;--line:rgba(0,0,0,.08);--accent:#0066cc;--accent-soft:#edf4ff;--control-radius:12px;--dur-press:120ms;--dur-hover:160ms;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--card);font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-width:280px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:active{transform:scale(.98)}button{transition:transform var(--dur-press) ease-out,background var(--dur-hover) ease}button:disabled{cursor:default;transform:none}header{height:104px;padding:32px 48px;display:flex;align-items:center;justify-content:space-between;gap:16px}.wordmark{font-size:21px;font-weight:650;letter-spacing:-.7px}.preview-label{font-size:12px;color:var(--secondary);border:1px solid var(--line);padding:6px 10px;border-radius:999px}main{min-height:calc(100svh - 200px);display:grid;place-items:center;padding:32px 24px 76px}.login{width:100%;max-width:352px}.brand-symbol{width:45px;height:45px;display:block;margin:0 0 25px;color:var(--ink)}h1{font-size:28px;line-height:1.3;letter-spacing:-.8px;margin:0 0 10px;font-weight:600}.intro{font-size:14px;color:var(--secondary);line-height:1.7;margin:0 0 34px}.field{margin-bottom:20px}label,.field-heading{display:block;font-size:13px;font-weight:500;margin-bottom:9px}.field-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}.field-heading label{margin:0}.text-button{border:0;background:transparent;color:var(--secondary);padding:10px 0;font-size:12px;min-height:44px}.field-heading .text-button{margin-top:-10px;margin-bottom:-3px}.input-wrap{position:relative}input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--control-radius);background:#fafafa;color:var(--ink);font-size:16px;outline:none;transition:border-color var(--dur-hover) ease,box-shadow var(--dur-hover) ease}input::placeholder{color:#929298;font-size:14px}input:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}input[type=password],input.password-visible{padding-right:54px}.reveal{position:absolute;right:4px;top:2px;width:44px;height:44px;border:0;background:transparent;color:var(--secondary);display:grid;place-items:center}.reveal svg{width:19px;height:19px}.primary,.secondary-button{width:100%;min-height:48px;padding:12px 16px;border-radius:var(--control-radius);font-size:14px;font-weight:550}.primary{background:var(--accent);color:#fff;border:1px solid transparent}.secondary-button{background:var(--card);color:var(--ink);border:1px solid var(--line)}.divider{display:flex;align-items:center;gap:16px;color:#929298;font-size:12px;margin:23px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.note{text-align:center;font-size:12px;color:var(--secondary);line-height:1.8;margin:20px 0 0}.status{font-size:13px;line-height:1.7;color:var(--secondary);margin:14px 0 0;overflow-wrap:anywhere}.status:empty{display:none}.back{margin-top:14px;width:100%;font-size:13px}.email-display{display:block;color:var(--ink);font-weight:500;overflow-wrap:anywhere;margin-top:8px}.mail-symbol{width:44px;height:44px;margin:0 0 25px;color:var(--accent)}footer{min-height:96px;padding:16px 48px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:var(--secondary);font-size:12px}.signature{letter-spacing:.08em}.preview-controls{display:flex;align-items:center;gap:16px}.preview-controls button{border:0;padding:8px 0;min-height:44px;background:none;color:var(--secondary);font-size:12px}.preview-controls button[aria-pressed=true]{color:var(--ink)}[hidden]{display:none!important}@media(hover:hover){.primary:hover{background:#0057ad}.secondary-button:hover{background:#fafafa}.text-button:hover,.preview-controls button:hover{color:var(--accent)}}
@media(max-width:600px){header{height:86px;padding:24px}.wordmark{font-size:20px}main{padding:36px 28px 48px;min-height:calc(100svh - 200px);align-items:start}.login{margin:clamp(16px,5svh,48px) auto 0}h1{font-size:26px}.brand-symbol{margin-bottom:22px}footer{padding:12px 24px max(24px,env(safe-area-inset-bottom));flex-direction:column;gap:5px}.signature{font-size:11px}.preview-controls{gap:20px}}@media(max-height:700px) and (min-width:601px){main{padding:16px 24px 32px}header{height:80px}.brand-symbol{margin-bottom:16px}.intro{margin-bottom:24px}}
.intro:empty{display:none}h1{margin-bottom:30px}.intro:not(:empty){margin-top:-16px}.page-link{color:var(--secondary);font-size:12px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.page-link:hover{color:var(--accent)}.page-link:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.preview-controls{flex-wrap:wrap;justify-content:center}

.consent{width:100%;max-width:400px}.connection{display:flex;align-items:center;gap:20px;margin-bottom:28px}.connection .brand-symbol{margin:0;width:44px;height:44px}.client-mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;font-family:ui-monospace,monospace;font-size:20px;letter-spacing:-3px;padding-right:3px}.connection-line{width:28px;height:1px;background:var(--line)}.consent h1{font-size:26px;letter-spacing:-.6px;line-height:1.5;margin-bottom:18px}.account{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;padding-bottom:24px;border-bottom:1px solid var(--line);color:var(--secondary)}.account span{overflow-wrap:anywhere}.account a{color:var(--accent);text-decoration:none;white-space:nowrap;min-height:44px;display:flex;align-items:center;margin:-10px 0}.permissions{list-style:none;padding:8px 0;margin:0}.permissions li{display:flex;align-items:center;gap:14px;padding:14px 0;font-size:14px}.permissions svg{width:20px;height:20px;flex:none;color:var(--secondary)}.scope{font-size:12px;color:var(--secondary);line-height:1.7;margin:0 0 24px}.scope strong{font-weight:400;color:var(--ink)}.actions{display:flex;gap:12px}.actions>*{flex:1}.revoke{color:var(--secondary);font-size:12px;line-height:1.7;margin:18px 0 0;text-align:center}.outcome{margin-top:24px}.outcome .secondary-button{margin-top:20px}@media(max-width:600px){.consent{margin:clamp(16px,5svh,48px) auto 0}.consent h1{font-size:24px}}

/* Center the identity and heading; keep form content readable. */
.login>.brand-symbol,.login>.mail-symbol{margin-left:auto;margin-right:auto}.login>h1,.login>.intro,.login>.status,.consent>h1,.outcome{text-align:center}.connection{justify-content:center}

main{min-height:100svh;padding:48px 24px 80px}@media(max-width:600px){main{min-height:100svh;padding:64px 28px 40px;align-items:start}.login,.consent{margin:24px auto 0}}
</style></head><body>

<main><section class="consent" aria-labelledby="title"><div class="connection"><span class="client-mark" aria-hidden="true">&gt;_</span><span class="connection-line" aria-hidden="true"></span><svg class="brand-symbol"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V7.5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2V20M14 20v-8a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v8M2.5 20h19M6.75 10h1.5"/></svg></div>
<h1 id="title" tabindex="-1">允许 Codex 访问窗台？</h1>
<div id="request"><div class="account"><span>you@example.com</span><a href="login.html">切换账号</a></div>
<ul class="permissions" aria-label="申请权限">
<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>读取卡片</span></li>
<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>创建与修改卡片</span></li>
<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></svg><span>删除卡片</span></li>
</ul><p class="scope">范围：<strong>所有卡片，含以后新增的卡片</strong></p>
<div class="actions"><button class="secondary-button" id="cancel">取消</button><button class="primary" id="approve">允许访问</button></div>
<p class="revoke">可在「已授权客户端」中撤销。</p></div>
<div class="outcome" id="outcome" hidden><p class="status" role="status" id="status"></p><button class="secondary-button" id="again">返回授权页</button></div>
</section></main>

<script>
const $=id=>document.getElementById(id);
function result(approved){$('request').hidden=true;$('outcome').hidden=false;$('title').textContent=approved?'已允许访问':'已取消授权';$('status').textContent='演示状态 · 未更改实际权限';$('title').focus();}
$('approve').onclick=()=>result(true);$('cancel').onclick=()=>result(false);$('again').onclick=()=>{$('request').hidden=false;$('outcome').hidden=true;$('title').textContent='允许 Codex 访问窗台？';$('title').focus();};
</script></body></html>
