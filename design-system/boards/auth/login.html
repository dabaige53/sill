<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="256x256" href="../../../assets/sill-icon.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="256x256" href="../../../assets/sill-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sill"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)"><title>Sill · 登录</title><link rel="stylesheet" href="login.css"><main class="login-page"><img class="auth-logo" src="../../../assets/sill-icon.png" alt=""><h1 id="title" tabindex="-1">登录窗台</h1><form id="password-form"><div class="auth-field"><input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " maxlength="254" required><label for="email">邮箱</label></div><div class="auth-field password-wrap"><input id="password" name="password" type="password" autocomplete="current-password"  maxlength="256" placeholder=" " required><label for="password">密码</label><button type="button" id="reveal" class="reveal" aria-label="显示密码" aria-pressed="false"><svg class="eye-on" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20M10.58 10.587a2 2 0 0 0 2.828 2.83M9.88 5.09A10.94 10.94 0 0 1 12 4.9c4.418 0 8.2 2.7 10 7.1a13.5 13.5 0 0 1-3.23 4.54M6.61 6.61A13.53 13.53 0 0 0 2 12c1.8 4.4 5.582 7.1 10 7.1a10.9 10.9 0 0 0 5.39-1.49"/></svg></button></div><button type="submit">登录并继续</button></form><p id="status" role="status" aria-live="polite" aria-atomic="true"></p></main><script>
const fetch = async (path) => ({ok:true,json:async()=>({message:path==='/auth/login'?"演示状态 · 未发送邮件":"演示状态 · 未提交登录"})});

 const $=id=>document.getElementById(id),status=$('status');let mode='password',busy=false,waiting=false,checking=false,continued=false;
 // The original tab owns continuation. A cross-tab signal is only a hint; the server session is authoritative.
 async function continueLogin(){if(!waiting||checking||continued)return;checking=true;try{const response=await fetch('/auth/session',{cache:'no-store'});if(response.ok){continued=true;location.assign("/");}}catch{}finally{checking=false;}}
 let loginChannel;try{loginChannel=new BroadcastChannel('sill-auth');loginChannel.onmessage=event=>{if(event.data==='session-changed')void continueLogin();};}catch{}
 window.addEventListener('focus',continueLogin);window.addEventListener('pageshow',continueLogin);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void continueLogin();});
 function show(next){if(busy)return;waiting=false;mode=next;$('email-address').hidden=false;const password=next==='password';$('password-form').hidden=!password;$('alternate').hidden=!password;$('email-form').hidden=password;$('back').hidden=password;$('title').textContent=password?"登录窗台":next==='reset'?"重新设置密码":"通过邮件登录";$('email-submit').textContent=next==='reset'?"发送重设链接":"发送登录链接";if(!password)$('backup-email').value=$('email').value;else $('email').value=$('backup-email').value;status.textContent='';$('title').focus();}
 $('reveal').onclick=()=>{const visible=$('password').type==='password';$('password').type=visible?'text':'password';$('reveal').setAttribute('aria-pressed',String(visible));$('reveal').setAttribute('aria-label',visible?"隐藏密码":"显示密码");};
 $('email-login')?.addEventListener('click',()=>show('email'));$('forgot')?.addEventListener('click',()=>show('reset'));$('back')?.addEventListener('click',()=>show('password'));
 async function submit(event,path,extra={}){event.preventDefault();if(busy)return;const form=event.target,button=form.querySelector('button[type=submit]'),idleLabel=button.textContent,processing="正在处理…";busy=true;button.textContent=processing;form.setAttribute('aria-busy','true');button.disabled=true;status.textContent="正在处理…";try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...Object.fromEntries(new FormData(form)),...extra})});const data=await response.json();if(!response.ok){status.textContent=response.status===429?"操作过于频繁，请稍后再试。":response.status===401?"邮箱或密码不正确，或登录已过期。":response.status===403?"此账号尚无 Sill 工作台访问权限。":"暂时未能完成，请稍后重试。";return;}if(data.location){location.assign(data.location);return;}status.textContent=data.message;if(form.id==='email-form'){waiting=mode==='email';$('email-address').hidden=true;$('title').textContent="查看邮件";$('email-submit').textContent="重新发送邮件";}$('password').value='';}catch{status.textContent="连接失败，请检查网络后重试。";}finally{busy=false;button.disabled=false;if(button.textContent===processing)button.textContent=idleLabel;form.removeAttribute('aria-busy');}}
 $('password-form').addEventListener('submit',e=>submit(e,'/auth/password'));
 $('email-form')?.addEventListener('submit',e=>submit(e,'/auth/login',{setupPassword:mode==='reset'}));
 </script></html>
