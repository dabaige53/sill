<!doctype html>
<!-- html-validate-disable no-inline-style -- Design canvas requires inline styles for direct property editing. -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Sill · 添加备份位置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- html-validate-disable-next element-name -- Design canvas runtime hoists helmet styles into the document head. -->
<helmet><style>
body{margin:0}a{color:#0066cc;text-decoration:none}a:hover{color:#0057ad}button,input{font:inherit;box-sizing:border-box}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #0066cc;outline-offset:3px}
@media(max-width:650px){.stage{padding:0!important;background:#f5f5f7!important}.window{border-radius:0!important;box-shadow:none!important}.nav{display:none!important}.main{padding:24px 20px!important}.layout{height:auto!important}.window-head{padding:16px 20px!important}}
</style></helmet>
<div class="stage" style="min-height:880px;box-sizing:border-box;background:#dedee2;padding:96px 24px;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;font-size:14px;line-height:1.5">
<section class="window" aria-label="设置" style="width:100%;max-width:840px;border-radius:28px;background:#f5f5f7;box-shadow:0 24px 80px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);overflow:hidden">
<header class="window-head" style="display:flex;justify-content:space-between;align-items:center;padding:16px 32px 0;min-height:60px">
<h1 style="font-size:34px;line-height:1.25;letter-spacing:-.025em;margin:0;font-weight:700">设置</h1>
<button type="button" aria-label="关闭设置" disabled style="width:44px;height:44px;border:0;border-radius:50%;background:#e9e9ee;color:#636366;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
</header>
<div class="layout" style="display:flex;height:560px">
<nav class="nav" aria-label="设置分组" style="flex:0 0 200px;box-sizing:border-box;padding:28px 12px 28px 20px;display:flex;flex-direction:column;gap:4px">
<button type="button" disabled style="text-align:left;min-height:44px;padding:0 16px;background:transparent;border:0;color:#636366;border-radius:10px">桌面</button>
<button type="button" disabled style="text-align:left;min-height:44px;padding:0 16px;background:transparent;border:0;color:#636366;border-radius:10px">外观</button>
<button type="button" disabled style="text-align:left;min-height:44px;padding:0 16px;background:transparent;border:0;color:#636366;border-radius:10px">快捷键</button>
<button type="button" disabled style="text-align:left;min-height:44px;padding:0 16px;background:transparent;border:0;color:#636366;border-radius:10px">数据与隐私</button>
<a href="Main.dc.html" aria-current="page" style="display:flex;align-items:center;min-height:44px;padding:0 16px;background:#fff;color:#1d1d1f;border-radius:10px;font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.06)">备份与恢复</a>
<button type="button" disabled style="text-align:left;min-height:44px;padding:0 16px;background:transparent;border:0;color:#636366;border-radius:10px">关于</button>
</nav>
<main class="main" style="flex:1;min-width:0;padding:24px 32px 28px;overflow:auto;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:12px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:6px;min-height:44px;font-size:13px;margin-top:-12px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>备份与恢复</a>
<h2 style="font-size:22px;line-height:1.3;letter-spacing:-.02em;margin:0">添加备份位置</h2>
</div>
<div role="group" style="display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-radius:12px;background:#e9e9ee" aria-label="备份方式">
<!-- html-validate-disable-next attr-case -- Design canvas binds events using JSX camelCase. -->
<button type="button" onClick="{{pickWebdav}}" aria-pressed="{{webdav}}" style="{{webdavStyle}}">WebDAV / 坚果云</button>
<!-- html-validate-disable-next attr-case -- Design canvas binds events using JSX camelCase. -->
<button type="button" onClick="{{pickR2}}" aria-pressed="{{r2}}" style="{{r2Style}}">Cloudflare R2</button>
</div>
<div style="display:flex;flex-direction:column;gap:0;border:1px solid rgba(0,0,0,.06);border-radius:14px;background:#fff;overflow:hidden">
<sc-if value="{{webdav}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:0">
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.06)"><span style="font-size:13px;font-weight:500">WebDAV 文件夹地址（HTTPS）</span><input type="url" name="endpoint" autocomplete="off" placeholder="https://" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.06)"><span style="font-size:13px;font-weight:500">账号</span><input type="text" name="username" autocomplete="off" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px"><span style="font-size:13px;font-weight:500">应用密码</span><input type="password" name="password" autocomplete="new-password" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
</div>
</sc-if>
<sc-if value="{{r2}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:0">
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.06)"><span style="font-size:13px;font-weight:500">Cloudflare Account ID</span><input type="text" name="accountId" autocomplete="off" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.06)"><span style="font-size:13px;font-weight:500">Bucket</span><input type="text" name="bucket" autocomplete="off" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid rgba(0,0,0,.06)"><span style="font-size:13px;font-weight:500">Access Key ID</span><input type="text" name="accessKeyId" autocomplete="off" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
<label style="display:flex;flex-direction:column;gap:8px;padding:16px 18px"><span style="font-size:13px;font-weight:500">Secret Access Key</span><input type="password" name="secretAccessKey" autocomplete="new-password" style="min-height:44px;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;color:#1d1d1f;background:#fff;font-size:16px"></label>
</div>
</sc-if>
</div>
<div style="display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:12px">
<a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;color:#636366">取消</a>
<a href="Configured.dc.html" style="min-height:44px;padding:0 18px;border:0;border-radius:10px;background:#0066cc;color:#fff;display:flex;align-items:center;gap:8px;font-weight:600"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 12 2 2 4-4"></path><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"></path></svg>验证并添加</a>
</div>
</main>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const webdav = this.state.provider !== 'r2';
    const base = 'flex:1;min-height:44px;padding:0 12px;border:0;border-radius:9px;font-size:13px;font-weight:500;';
    return {
      webdav, r2: !webdav,
      webdavStyle: base + (webdav ? 'background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.08)' : 'background:transparent;color:#636366'),
      r2Style: base + (!webdav ? 'background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.08)' : 'background:transparent;color:#636366'),
      pickWebdav: () => this.setState({provider:'webdav'}),
      pickR2: () => this.setState({provider:'r2'})
    };
  }
}
</script>
</body>
</html>
