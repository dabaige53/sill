<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>移动 · 搜索首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat{background-size:cover;background-position:center}
.cv-arch{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/architecture.jpg)}
.cv-coast{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/coast.jpg)}
.cv-bot{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/botanical.jpg)}
.cv-mtn{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/mountain.jpg)}
.cv-coast2{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/coast.jpg);background-position:left}
.cv-arch2{background-image:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.5)),url(screens/architecture.jpg);background-position:right}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased">
  <div style="height: 54px"></div>
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 44px">搜索</h1>
    <button type="button" aria-label="设置" style="width: 44px; height: 44px; display: grid; place-items: center">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #f0f0f2; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"/></svg></span>
    </button>
  </header>
  <label style="margin: 0 16px; height: 44px; border-radius: 22px; background: #f0f0f2; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #636366">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; flex: none"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.6-4.6"/></svg>
    <input type="search" placeholder="卡片、备注、来源" aria-label="搜索" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 17px; color: #1d1d1f; outline: none">
  </label>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px">
    <button type="button" class="cat cv-arch" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">资讯</span></button>
    <button type="button" class="cat cv-coast" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">消息</span></button>
    <button type="button" class="cat cv-bot" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">笔记</span></button>
    <button type="button" class="cat cv-mtn" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">待办</span></button>
    <button type="button" class="cat cv-coast2" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">日程</span></button>
    <button type="button" class="cat cv-arch2" style="aspect-ratio: 16 / 10; border-radius: 12px; position: relative; overflow: hidden; text-align: left"><span style="position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 17px; font-weight: 700">媒体</span></button>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(rgba(255,255,255,0), #ffffff 70%)"></div>
  <nav aria-label="主导航" style="position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); height: 60px; padding: 4px; border-radius: 30px; background: rgba(255,255,255,.88); box-shadow: 0 0 0 .5px rgba(0,0,0,.07), 0 10px 30px -10px rgba(0,0,0,.25); display: flex">
    <button type="button" aria-label="主页" style="width: 76px; border-radius: 26px; display: grid; place-items: center; color: rgba(29,29,31,.62)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button type="button" aria-label="AI" style="width: 76px; border-radius: 26px; display: grid; place-items: center; color: rgba(29,29,31,.62)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><path d="M5 18.5V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8z"/></svg></button>
    <button type="button" aria-label="搜索" aria-current="page" style="width: 76px; border-radius: 26px; background: rgba(0,0,0,.06); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.6-4.6"/></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
