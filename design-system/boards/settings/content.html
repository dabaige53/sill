/* Sill · base · shared source */
* {
	box-sizing: border-box;
	/* A held card must not pass its motion state to its menu or other children. */
	--motion-managed-transform: initial;
}
html {
	-webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: transparent;
	background: var(--canvas);
	scroll-behavior: auto;
	scrollbar-gutter: auto;
	scrollbar-width: none;
	/* The app owns pull-to-refresh; do not also start the browser refresh/bounce. */
	overscroll-behavior-y: none;
}
/* Hide the page track without disabling wheel, touch or keyboard scrolling. */
html::-webkit-scrollbar {
	display: none;
}
body {
	overscroll-behavior-y: none;
	margin: 0;
	font-family: var(--font);
	color: var(--ink);
	font-size: var(--text-control);
	line-height: 1.6;
	-webkit-font-smoothing: antialiased;
	background: var(--canvas);
	min-height: 100dvh;
}
button,
input,
textarea,
select {
	font: inherit;
}
button {
	color: inherit;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
	border: 0;
	background: none;
	padding: 0;
}
button:disabled {
	opacity: 0.4;
	cursor: default;
}
a {
	color: inherit;
	text-decoration: none;
}
img {
	display: block;
	max-width: 100%;
}
mark {
	background: var(--highlight);
	color: inherit;
	border-radius: 3px;
	padding: 0 var(--space-1);
}
button,
input,
textarea,
a {
	-webkit-tap-highlight-color: transparent;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible,
summary:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}
input,
textarea {
	border: 1px solid var(--line);
	background: var(--surface);
	outline: 0;
	border-radius: var(--control-radius);
	padding: var(--space-12) var(--space-14);
	color: var(--ink);
}
textarea {
	resize: vertical;
}
input::placeholder,
textarea::placeholder {
	color: var(--secondary);
}
::selection {
	background: var(--selection);
	color: var(--fixed-ink);
}
.sr-only {
	position: absolute;
	width: 1px;
	height: 1px;
	padding: 0;
	margin: calc(-1 * var(--space-1));
	overflow: hidden;
	clip: rect(0, 0, 0, 0);
	white-space: nowrap;
	border: 0;
}
.icon {
	flex: 0 0 auto;
	vertical-align: middle;
	pointer-events: none;
}
main {
	width: 100%;
	padding: var(--space-40) var(--space-40) var(--space-140);
	margin: 0 auto;
	min-height: 100dvh;
}
.feed-grid {
	position: relative;
	width: 100%;
	max-width: var(--feed-max);
	margin: 0 auto;
	min-height: 60dvh;
}
h1,
h2,
p {
	margin: 0;
}
.empty-card {
	position: relative;
	max-width: 420px;
	margin: 12dvh auto 0;
	padding: var(--space-32) var(--space-28);
	text-align: center;
	color: var(--muted);
}
.empty-card h2 {
	font-size: var(--text-body);
	font-weight: 400;
	color: var(--muted);
}
.empty-card p {
	font-size: var(--text-meta);
	margin-top: var(--space-8);
}
/* Layout writes inline width/left/top for every feed item; an empty desk stays in flow. */
.feed-grid > .empty-card {
	position: relative;
	left: auto !important;
	top: auto !important;
	width: auto !important;
}
/* Drop links or text anywhere on the window to capture them. */
body.is-dropping:after {
	content: "";
	position: fixed;
	inset: 16px;
	border: 2px dashed var(--accent);
	border-radius: 24px;
	background: color-mix(in srgb, var(--accent-soft) 70%, transparent);
	pointer-events: none;
	z-index: 300;
}
.drop-hint {
	position: fixed;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	z-index: 301;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--space-6);
	pointer-events: none;
	font-size: var(--text-input);
	font-weight: 600;
}
.drop-hint small {
	font-size: var(--text-meta);
	font-weight: 500;
	color: var(--accent);
}
.drop-hint[hidden] {
	display: none;
}
/* The end of the desk is a short line, not a sentence. */
.feed-end {
	width: 28px;
	height: 3px;
	border-radius: 2px;
	background: var(--line);
	margin: var(--space-40) auto 0;
}
body.feed-more .feed-end,
main:has(.welcome, .empty-card) .feed-end {
	display: none;
}
/* Recovery lives in the top layer and never participates in the card layout. */
#sync-status {
	flex: none;
	width: var(--hit-target);
	margin: 0;
}
#sync-status[hidden] {
	display: none;
}
#sync-status > .icon-button {
	color: var(--alert);
	background: transparent;
}
#sync-status > .icon-button::before {
	content: "";
	position: absolute;
	inset: var(--space-2);
	border-radius: 50%;
	background: var(--alert-soft);
}
#sync-status > .icon-button > .icon {
	position: relative;
	width: var(--space-20);
	height: var(--space-20);
}
body > #sync-status {
	position: fixed;
	top: var(--space-20);
	right: var(--space-12);
}
#sync-status-panel {
	position: fixed;
	inset: auto var(--space-12) auto auto;
	top: var(--sync-panel-top, var(--space-64));
	width: min(var(--preview-short-width), calc(100vw - var(--space-24)));
	max-height: calc(100dvh - var(--sync-panel-top, var(--space-64)) - var(--space-12));
	margin: 0;
	padding: var(--space-16);
	overflow: auto;
	overflow-wrap: anywhere;
	border: 1px solid var(--line);
	border-radius: var(--card-radius-sm);
	background: var(--card);
	color: var(--ink);
	box-shadow: var(--shadow-float);
}
#sync-status-panel .sync-status-copy strong {
	display: block;
	font-size: var(--text-body);
	font-weight: 600;
}
#sync-status-panel .sync-status-copy p {
	margin: var(--space-6) 0 0;
	font-size: var(--text-control);
	line-height: 1.6;
	color: var(--muted);
}
.sync-status-actions {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: var(--space-8);
	margin-top: var(--space-16);
}
#sync-status-panel .sync-status-retry {
	color: var(--accent);
}
#sync-status-panel .sync-status-discard {
	margin-left: auto;
	color: var(--muted);
}
/* @design nav-capsule — recovery actions replace the duplicate offline pill. */
body:has(#sync-status:not([hidden])) #dock #offline {
	display: none;
}

/* Controls suppress text selection; reading content keeps native copy/link menus. */
button,
[role="button"] {
	touch-action: manipulation;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}
a {
	touch-action: manipulation;
}

/* Nested app panels follow the same hidden-track rule as the page. */
.settings-main::-webkit-scrollbar,
.search-results::-webkit-scrollbar,
.ai-context::-webkit-scrollbar,
.selection-context::-webkit-scrollbar,
#selection-menu::-webkit-scrollbar,
#modal.panel .sheet::-webkit-scrollbar,
.cloud-compose-body::-webkit-scrollbar {
	display: none;
}

/* Sill · controls · shared source */
/* Liquid glass, for the functional layer only (bars, round buttons, menus floating over content).
   A clear, lightly tinted lens: little fill, a short blur with lifted saturation so the content
   beneath still shows its colour, a bright specular rim on the top-left, a softer one bottom-right,
   and a hairline that separates it from white cards. The lens light is a highlight, not decoration. */
.glass {
	position: relative;
	isolation: isolate;
	background: var(--glass);
	border: 0;
	box-shadow:
		inset 0 1px 0.5px var(--glass-edge),
		inset 1px 0 0.5px var(--glass-shade),
		inset 0 -1px 1px var(--glass-shade),
		inset 0 0 0 0.5px var(--glass-shade),
		0 0 0 0.5px var(--glass-rim),
		var(--shadow-glass);
	-webkit-backdrop-filter: var(--glass-filter);
	backdrop-filter: var(--glass-filter);
}
.glass::before {
	content: "";
	position: absolute;
	inset: 0;
	z-index: -1;
	border-radius: inherit;
	pointer-events: none;
	background: radial-gradient(120% 90% at 20% 0%, var(--glass-shade), transparent 60%);
}
.icon-button {
	width: 44px;
	height: 44px;
	min-width: 44px;
	padding: 0;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	border-radius: 50%;
	background: transparent;
	position: relative;
	color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
	.icon-button:hover {
		background: var(--surface);
	}
}
.icon-button:active {
	background: var(--surface);
}
.icon-button.active {
	color: var(--accent);
}
.icon-button.active svg {
	fill: currentColor;
	fill-opacity: 0.9;
}

/* The bottom rail: one navigation capsule, centred. Home, search, AI and settings; a glass lens
   marks where you are and slides between places. Anything else that floats at the bottom
   (selection, new content, offline) sits beside it on the same baseline. */
:root {
	--rail-edge: 28px;
	--rail-bottom: 28px;
	--rail-row: 60px;
	--rail-gap: 8px;
	--rail-tuck: var(--dur-tuck);
	--nav-tab: 76px;
}
#dock {
	position: fixed;
	left: var(--rail-edge);
	right: var(--rail-edge);
	bottom: var(--rail-bottom);
	z-index: 45;
	display: flex;
	justify-content: center;
	align-items: center;
	gap: var(--rail-gap);
	pointer-events: none;
}
body:has(#modal[open] .settings-layout) #dock {
	display: none;
}
#dock > * {
	pointer-events: auto;
}
#dock.is-tucked {
	transform: var(--motion-toolbar-transform, translateY(20px));
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
/* Descendants opt into hit testing normally, so suppress them throughout the fade. */
#dock.is-tucked *,
body:has(#modal[open]:not(.page)) #dock * {
	pointer-events: none;
}
.nav-capsule {
	position: relative;
	display: flex;
	align-items: center;
	height: var(--rail-row);
	padding: var(--space-4);
	border-radius: var(--pill-radius);
}
.nav-tab {
	position: relative;
	z-index: 1;
	width: var(--nav-tab);
	height: 100%;
	padding: 0;
	border: 0;
	border-radius: var(--pill-radius);
	background: none;
	color: color-mix(in srgb, var(--ink) 62%, transparent);
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: var(--space-2);
	font: inherit;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
}
.nav-tab[aria-current="page"] {
	color: var(--ink);
}
.nav-icon {
	display: grid;
	place-items: center;
	height: 28px;
}
/* The current destination is immediate; the merged motion rules keep the lens stable. */
.nav-lens {
	position: absolute;
	top: 4px;
	bottom: 4px;
	left: 0;
	width: var(--lens-w, var(--nav-tab));
	translate: var(--lens-x, 4px) 0;
	border-radius: var(--pill-radius);
	background: var(--glass-press);
	box-shadow:
		inset 0 1px 0.5px var(--glass-edge),
		inset 0 -0.5px 0.5px var(--glass-shade);
}
/* A filter in effect: a small dot under the search icon, never a count. */
#dock.filter-active .nav-tab[data-extra="search"] .nav-icon::after {
	content: "";
	position: absolute;
	width: 5px;
	height: 5px;
	border-radius: 50%;
	background: var(--ink);
	translate: 11px -9px;
}
.nav-tab .nav-icon {
	position: relative;
}
/* Settings uses the same line weight and color as the other navigation icons. */
.account-wrap {
	position: relative;
	display: grid;
	place-items: center;
	width: 28px;
	height: 28px;
}
/* Scroll edge: where the feed meets the rail it softens and blurs a little, so the glass reads
   against calm content. It belongs to the rail and leaves with it. */
.scroll-edge {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	height: calc(var(--rail-bottom) + var(--rail-row) + 20px);
	z-index: 44;
	pointer-events: none;
	background: linear-gradient(
		to top,
		color-mix(in srgb, var(--canvas) 70%, transparent),
		color-mix(in srgb, var(--canvas) 0%, transparent)
	);
}
.scroll-edge.is-tucked {
	opacity: 0;
}
/* New content and offline float just above the capsule, centred, so the capsule never shifts.
   New content sits outside the dock so the phone can lift it to the top (ADR 0036). */
#dock #offline {
	position: absolute;
	left: 50%;
	bottom: calc(100% + 10px);
	translate: -50% 0;
}
#new-count {
	position: fixed;
	z-index: 46;
	left: 50%;
	bottom: calc(var(--rail-bottom) + var(--rail-row) + 10px);
	translate: -50% 0;
	height: 40px;
	padding: 0 var(--space-16);
	border-radius: var(--pill-radius);
	font-size: var(--text-meta);
	font-weight: 600;
	color: var(--ink);
	display: inline-flex;
	align-items: center;
	gap: var(--space-6);
}
#new-count:has(.new-sources) {
	padding-left: var(--space-8);
}
.new-sources {
	display: inline-flex;
	margin-right: var(--space-2);
}
.new-sources > span {
	display: grid;
	place-items: center;
	width: 24px;
	height: 24px;
	margin-left: calc(-1 * var(--space-6));
	border-radius: 50%;
	background: var(--card);
	border: 1px solid var(--line);
	color: var(--secondary);
}
.new-sources > span:first-child {
	margin-left: 0;
}
/* Desktop: the notice rides with the capsule and leaves with it. */
body:has(#dock.is-tucked) #new-count,
body:has(#modal[open]) #new-count {
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
#new-count[hidden] {
	display: none;
}
/* Busy: one quiet arc travelling around the settings icon. No percentages, no spinner text. */
.orb-arc {
	position: absolute;
	inset: -3px;
	width: 34px;
	height: 34px;
	pointer-events: none;
	opacity: 0;
}
.orb-arc circle {
	fill: none;
	stroke: var(--accent);
	stroke-width: 2;
	stroke-linecap: round;
	stroke-dasharray: 22 78;
	transform-origin: center;
}
#dock.is-busy .orb-arc {
	opacity: 0.9;
}
/* Done: the arc closes and a check shows over the settings icon, then both fade. */
.orb-done {
	position: absolute;
	inset: 0;
	display: grid;
	place-items: center;
	border-radius: 50%;
	background: var(--glass-thick);
	color: var(--accent);
	opacity: 0;
	scale: 0.8;
	pointer-events: none;
}
#dock.is-done .orb-done {
	opacity: 1;
	scale: 1;
}
#dock.is-done .orb-arc {
	opacity: 0.9;
}
#dock.is-done .orb-arc circle {
	stroke-dasharray: 100 0;
}
/* Offline: a quiet pill above the rail; a tap retries. */
#offline {
	height: 40px;
	padding: 0 var(--space-14);
	border-radius: var(--pill-radius);
	font-size: var(--text-meta);
	font-weight: 500;
	color: var(--alert);
	display: inline-flex;
	align-items: center;
	gap: var(--space-8);
}
#offline:before {
	content: "";
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--alert);
}
#offline[hidden] {
	display: none;
}

/* Selection takes the rail row; new-content and offline pills step aside. */
:is(#selection-bar, #search-selection-bar) {
	position: relative;
	justify-content: safe center;
	height: var(--rail-row);
	border-radius: var(--pill-radius);
	display: flex;
	align-items: center;
	padding: var(--space-4);
	gap: var(--space-2);
	max-width: calc(100vw - 2 * var(--rail-edge) - 3 * var(--nav-tab) - 8px - var(--rail-gap));
	overflow: visible;
	scrollbar-width: none;
}
#dock:has(#selection-bar:not([hidden])) #offline,
body:has(#selection-bar:not([hidden])) #new-count {
	display: none;
}
:is(#selection-bar, #search-selection-bar)[hidden] {
	display: none;
}
.selection-count {
	display: grid;
	place-items: center;
	min-width: 28px;
	height: 28px;
	margin: 0 var(--space-8);
	padding: 0 var(--space-8);
	border-radius: var(--pill-radius);
	background: var(--accent-fill);
	color: var(--fixed-white);
	font-size: var(--text-meta);
	font-weight: 600;
}
.toolbar-sep {
	width: 1px;
	height: 22px;
	background: var(--line-hover);
	margin: 0 var(--space-6);
	flex: none;
}
/* A card's own verbs (reply, open the source, join, remind again) follow the rule in accent;
   the shared verbs before it stay in ink (ADR 0037). */
.float-bar .icon-button.is-own {
	color: var(--accent);
}
.float-bar .icon-button,
:where(#dock) button {
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
}
/* One name for touch, pointer and keyboard; edge controls open their names inward. */
.float-bar .icon-button::after {
	--tip-x: -50%;
	content: attr(aria-label);
	position: absolute;
	bottom: calc(100% + 10px);
	left: 50%;
	translate: var(--tip-x) 4px;
	padding: var(--space-6) var(--space-10);
	border-radius: 10px;
	background: var(--ink);
	color: var(--card);
	font-size: var(--text-meta);
	font-weight: 500;
	line-height: 1.3;
	white-space: nowrap;
	pointer-events: none;
	opacity: 0;
}
.float-bar .icon-button:is(:first-child, :last-child)::after {
	--tip-x: 0px;
}
.float-bar .icon-button:last-child::after {
	left: auto;
	right: 50%;
}
.float-bar .icon-button.is-tipping::after,
.float-bar .icon-button.is-hover-tipping::after,
.float-bar .icon-button:focus-visible::after {
	opacity: 1;
	translate: var(--tip-x) 0;
}
#toast {
	position: fixed;
	right: var(--rail-edge);
	bottom: calc(var(--rail-bottom) + var(--rail-row) + 12px);
	max-width: min(420px, calc(100vw - 2 * var(--rail-edge)));
	min-height: 44px;
	padding: 0 var(--space-6) 0 var(--space-18);
	border-radius: var(--pill-radius);
	z-index: 120;
	display: flex;
	align-items: center;
	gap: var(--space-8);
	font-size: var(--text-meta);
}
/* The row is taken (selection, new content, offline) or a sheet is open: rise one row. */
#modal #toast {
	bottom: calc(var(--rail-bottom) + var(--rail-row) + 12px);
}
#toast.is-alert {
	color: var(--ink);
}
#toast.is-alert .icon-button {
	width: 44px;
	height: 44px;
	min-width: 44px;
}
body.is-dragging #toast {
	visibility: hidden;
}
#toast[hidden] {
	display: none;
}
#toast-text {
	white-space: normal;
	padding: var(--space-10) 0;
}
#toast-text:only-child {
	padding-right: var(--space-12);
}
#toast-action .text-link {
	padding: var(--space-10) var(--space-12);
}
#toast-action:empty {
	display: none;
}

/* Desktop bottom rail (ADR 0049): the AI box replaces the navigation capsule.
   Selection takes the same 640 × 60 slot; a carried card brings the AI box back. */
.ai-dock {
	display: none;
}
@media (min-width: 651px) {
	#dock .nav-capsule,
	#dock .selection-ai-target {
		display: none;
	}
	.ai-dock {
		position: relative;
		display: flex;
		align-items: center;
		gap: var(--space-4);
		width: min(640px, 100%);
		height: var(--rail-row);
		padding: 0 var(--space-12);
		border-radius: 30px;
	}
	#dock:has(#selection-bar:not([hidden])) .ai-dock {
		display: none;
	}
	#dock.is-ai-drag #selection-bar {
		display: none;
	}
	#dock.is-ai-drag:has(#selection-bar) .ai-dock {
		display: flex;
	}
	.ai-dock.is-ready {
		background: color-mix(in srgb, var(--accent) 7%, var(--card));
		box-shadow:
			0 0 0 2px var(--accent),
			0 16px 40px -14px color-mix(in srgb, var(--accent) 45%, transparent);
	}
	/* While a card is carried, an accent ring keeps spreading out of the box. */
	.ai-dock-pulse {
		position: absolute;
		inset: 0;
		z-index: -1;
		border-radius: var(--pill-radius);
		box-shadow: 0 0 0 2px var(--accent);
		opacity: 0;
		pointer-events: none;
	}
	.ai-dock.is-ready .ai-dock-input::placeholder {
		color: var(--accent);
		font-weight: 600;
		opacity: 1;
	}
	.ai-dock-button {
		display: grid;
		place-items: center;
		flex: none;
		width: 36px;
		height: 36px;
		padding: 0;
		border: 0;
		border-radius: 50%;
		background: none;
		color: var(--ink);
	}
	.ai-dock-button:disabled {
		color: var(--secondary);
		cursor: default;
	}
	.ai-dock-send > span {
		display: grid;
		place-items: center;
		width: 32px;
		height: 32px;
		border-radius: 50%;
		background: var(--faint);
		color: var(--card);
	}
	.ai-dock-send:not(:disabled) > span {
		background: var(--ink);
	}
	.ai-dock-input {
		flex: 1;
		min-width: 0;
		height: 36px;
		padding: 0 var(--space-4);
		border: 0;
		border-radius: 0;
		background: transparent;
		color: var(--ink);
		font-size: 16px;
		line-height: 36px;
	}
	.ai-dock-input:focus-visible {
		outline: 0;
	}
	.ai-dock-context:empty {
		display: none;
	}
	.ai-dock-context {
		position: absolute;
		left: 0;
		right: 0;
		bottom: calc(100% + var(--space-8));
		display: flex;
		flex-wrap: wrap;
		gap: var(--space-8);
	}
	.ai-dock-chip {
		display: inline-flex;
		align-items: center;
		gap: var(--space-6);
		max-width: 260px;
		height: 30px;
		padding: 0 var(--space-6) 0 var(--space-10);
		border-radius: var(--space-10);
		background: var(--card);
		box-shadow: inset 0 0 0 1px var(--line-card);
		font-size: var(--text-meta);
	}
	.ai-dock-chip-title {
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.ai-dock-chip button {
		display: grid;
		place-items: center;
		width: 18px;
		height: 18px;
		padding: 0;
		border: 0;
		background: none;
		color: var(--muted);
	}
	/* New content and offline wait under the top bar, clear of the AI box and its context. */
	#new-count,
	#dock #offline {
		position: fixed;
		top: calc(var(--space-12) + var(--space-60) + var(--space-10));
		bottom: auto;
	}
	body:has(#dock.is-tucked) #new-count {
		opacity: 1;
		visibility: visible;
		pointer-events: auto;
	}
	#dock #selection-bar {
		width: max-content;
		max-width: 100%;
		justify-content: center;
	}
	#dock #selection-bar .icon-button {
		width: 44px;
		height: 44px;
	}
}

@media (min-width: 651px) {
	/* One glass for the bottom rail: the AI box, the selection bars and detail tools all keep
	   the `.glass` lens (clear tint, bright edge, strong blur), like Apple's Liquid Glass. */
	.ai-dock,
	#selection-bar,
	#search-selection-bar,
	dialog:not(.lightbox) > .float-bar {
		background: var(--glass);
		-webkit-backdrop-filter: var(--glass-filter);
		backdrop-filter: var(--glass-filter);
	}
	/* The search field and the AI box take typing across the whole capsule. */
	.ai-dock {
		cursor: text;
	}
	.ai-dock-context {
		cursor: default;
	}
	.ai-dock-send:disabled > span {
		color: var(--secondary);
	}
	.ai-dock-send .icon {
		width: var(--space-20);
		height: var(--space-20);
	}
}

@media (min-width: 651px) {
	.ai-dock-input::placeholder {
		color: var(--secondary);
		opacity: 1;
	}
	#search-selection-bar {
		width: max-content;
		margin-inline: auto;
	}
}

@media (min-width: 651px) {
	.ai-dock-tools {
		position: absolute;
		bottom: 100%;
		padding-bottom: var(--space-4);
		right: var(--space-12);
		display: flex;
		gap: var(--space-4);
	}
	.ai-dock-tools button {
		border-radius: 50%;
	}
	.ai-dock,
	.ai-dock .ai-dock-input,
	.ai-dock .ai-dock-restore {
		touch-action: none;
	}
	.ai-dock-restore {
		display: none;
	}
	.ai-dock.is-collapsed {
		width: var(--rail-row);
		padding: 0;
		justify-content: center;
	}
	.ai-dock.is-collapsed > :not(.ai-dock-restore, .ai-dock-surface) {
		display: none;
	}
	.ai-dock.is-collapsed > .ai-dock-restore {
		display: grid;
		width: 100%;
		height: 100%;
	}
}

@media (min-width: 651px) {
	.ai-dock.is-moving,
	.ai-dock.is-moving * {
		user-select: none;
	}
}

@media (min-width: 651px) {
	.ai-dock {
		isolation: isolate;
	}
	.ai-dock-surface {
		position: absolute;
		inset: 0;
		border-radius: inherit;
		pointer-events: none;
		z-index: -1;
	}
	.ai-dock .ai-dock-restore {
		cursor: pointer;
	}
}

@media (min-width: 651px) and (hover: hover) and (pointer: fine) {
	.ai-dock-tools {
		opacity: 0;
		pointer-events: none;
	}
	.ai-dock:hover .ai-dock-tools,
	.ai-dock:has(:focus-visible) .ai-dock-tools {
		opacity: 1;
		pointer-events: auto;
	}
}

/* Chips, segmented controls and switches. */
.chips {
	display: flex;
	gap: var(--space-8);
	flex-wrap: wrap;
}
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--space-6);
	min-height: 36px;
	padding: 0 var(--space-14);
	border-radius: var(--pill-radius);
	background: var(--card);
	color: var(--ink);
	font-size: var(--text-meta);
	white-space: nowrap;
	box-shadow: 0 1px 3px var(--fixed-black-6);
}
.chip .icon {
	color: var(--secondary);
}
@media (hover: hover) and (pointer: fine) {
	.chip:hover {
		background: var(--surface);
	}
}
.chip:active {
	background: var(--surface);
}
.chip.active {
	background: var(--ink);
	color: var(--card);
}
.chip.active .icon {
	color: var(--card);
}
.chip.soft {
	background: var(--surface);
	box-shadow: none;
}
.chip.soft.active {
	background: var(--ink);
}
.tag-pill {
	display: inline-flex;
	align-items: center;
	gap: var(--space-2);
	height: 32px;
	padding: 0 var(--space-4) 0 var(--space-12);
	border-radius: var(--pill-radius);
	background: var(--surface);
	color: var(--ink);
	font-size: var(--text-meta);
	font-weight: 500;
}
.tag-pill button {
	width: 24px;
	height: 24px;
	display: grid;
	place-items: center;
	color: inherit;
	opacity: 0.6;
	border-radius: 50%;
}
@media (hover: hover) and (pointer: fine) {
	.tag-pill button:hover {
		opacity: 1;
	}
}
.segmented {
	display: inline-flex;
	padding: var(--space-2);
	border-radius: 10px;
	background: var(--surface);
	flex: none;
}
.segmented button {
	min-height: 30px;
	padding: 0 var(--space-12);
	border-radius: 8px;
	font-size: var(--text-meta);
	color: var(--muted);
	white-space: nowrap;
}
/* Touch has no hover: every control darkens a little while pressed. */
.segmented button:not(.on):active {
	background: var(--faint);
}
.segmented button.on {
	background: var(--card);
	color: var(--ink);
	font-weight: 500;
	box-shadow: 0 1px 3px var(--fixed-black-10);
}
.toggle {
	width: 51px;
	height: 31px;
	border-radius: var(--pill-radius);
	background: var(--toggle-off);
	position: relative;
	flex: none;
}
.toggle:before {
	content: "";
	position: absolute;
	width: 27px;
	height: 27px;
	left: 2px;
	top: 2px;
	border-radius: 50%;
	background: var(--fixed-white);
	box-shadow: 0 2px 4px var(--fixed-black-15);
}
.toggle[aria-checked="true"] {
	background: var(--toggle-on);
}
.toggle[aria-checked="true"]:before {
	transform: translateX(20px);
}
.text-button {
	background: transparent;
	min-height: 44px;
	padding: var(--space-8) var(--space-12);
	font-size: var(--text-meta);
	border-radius: var(--control-radius);
	color: var(--ink);
}
@media (hover: hover) and (pointer: fine) {
	.text-button:hover {
		background: var(--surface);
	}
}
.text-button:active {
	background: var(--surface);
}
.solid-button {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-6);
	background: var(--accent-fill);
	color: var(--fixed-white);
	border-radius: var(--pill-radius);
	padding: 0 var(--space-20);
	font-size: var(--text-control);
	font-weight: 500;
	min-height: 44px;
	white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) {
	.solid-button:hover {
		filter: brightness(1.08);
	}
}
.solid-button small {
	font-size: var(--text-caption);
	opacity: 1;
	font-family: var(--rounded);
}
.soft-button {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-6);
	background: var(--surface);
	color: var(--ink);
	border-radius: var(--pill-radius);
	padding: 0 var(--space-20);
	font-size: var(--text-control);
	font-weight: 500;
	min-height: 44px;
}
@media (hover: hover) and (pointer: fine) {
	.soft-button:hover {
		background: var(--faint);
	}
}
.soft-button:active {
	background: var(--faint);
}

#search-selection-bar {
	flex: none;
	align-self: center;
	max-width: calc(100% - 2 * var(--rail-edge));
	margin: 0 auto max(var(--rail-edge), env(safe-area-inset-bottom));
}

/* Local AI receiver shares the active selection rail, never a side drop palette. */
.selection-ai-target {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(100% + var(--rail-gap));
	min-height: 48px;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-10);
	padding: var(--space-10) var(--space-14);
	border: 1px solid var(--line-hover);
	border-radius: var(--pill-radius);
	color: var(--ink);
	font-size: var(--text-meta);
	white-space: nowrap;
}
.selection-ai-target.is-ready {
	border-color: var(--accent);
	box-shadow: 0 0 0 2px var(--accent);
	background: var(--card);
}
.selection-ai-wave {
	display: flex;
	align-items: center;
	gap: var(--space-3);
	height: 18px;
}
.selection-ai-wave i {
	width: 3px;
	height: 10px;
	background: currentColor;
	border-radius: 3px;
}
.selection-ai-wave i:nth-child(2) {
	height: 18px;
}
.selection-drag-preview {
	position: fixed;
	left: 0;
	top: 0;
	z-index: 100;
	width: max-content;
	pointer-events: none;
	will-change: transform;
}
#search-selection-bar {
	margin-top: var(--space-60);
}

/* Shared home filters. The phone head stays in responsive.css (ADR 0036). @design top-bar */
.home-top {
	position: sticky;
	top: 0;
	z-index: 20;
	width: calc(100% - var(--feed-left, var(--margin-lg)) * 2);
	margin: var(--space-12) auto 0;
	background: var(--canvas);
}
.home-top.is-tucked {
	transform: translateY(-100%);
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
.home-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	height: var(--space-60);
}
.home-mark {
	padding: 0;
	min-height: var(--hit-target);
	background: none;
	color: var(--ink);
	font-size: var(--text-figure);
	font-weight: 700;
	line-height: 1;
	letter-spacing: -0.04em;
}
.home-account {
	display: grid;
	place-items: center;
	width: var(--hit-target);
	height: var(--hit-target);
	padding: 0;
	border-radius: 50%;
}
.home-account .account-wrap {
	width: var(--space-36);
	height: var(--space-36);
	border-radius: 50%;
	background: var(--faint);
	color: var(--secondary);
}
/* Home tabs are the same solid pill as the search type chips (ADR 0048). */
.home-tabs {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	min-height: var(--hit-target);
	overflow-x: auto;
	scrollbar-width: none;
}
.home-tabs::-webkit-scrollbar {
	display: none;
}
.home-tab {
	flex: none;
	height: var(--space-32);
	padding: 0 var(--space-14);
	border: 0;
	border-radius: var(--pill-radius);
	background: var(--card);
	box-shadow: inset 0 0 0 1px var(--line-card);
	color: var(--ink);
	font: inherit;
	font-size: var(--text-control);
	white-space: nowrap;
}
.home-tab[aria-pressed="true"] {
	background: var(--ink);
	color: var(--card);
	font-weight: 600;
	box-shadow: none;
}
body:has(:is(#modal, #search-background)[open].page) .home-top {
	visibility: hidden;
}
/* Desktop-only parts of the top bar stay out of the phone row. */
.home-brand {
	position: relative;
	display: flex;
	align-items: center;
	min-width: 0;
}
.home-logo,
.home-menu-toggle,
.home-edge-blur,
.home-menu,
.home-search,
.home-kinds {
	display: none;
}
@media (min-width: 651px) {
	.home-top {
		top: var(--space-10);
		width: calc(100% - var(--space-12) * 2);
		margin-top: var(--space-10);
	}
	.home-top {
		opacity: 1;
	}
	.home-top.is-tucked,
	.home-top.is-entering {
		/* Include the sticky offset and glass feather in the shared travel. */
		transform: translateY(calc(-100% - var(--space-10) - var(--space-12)));
		opacity: 1;
		visibility: hidden;
		pointer-events: none;
	}
	@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
		.home-top {
			background: transparent;
		}
		.home-top > .home-heading,
		.home-top > .home-kinds {
			position: relative;
			z-index: 1;
		}
		.home-top::before,
		.home-top::after,
		.home-edge-blur {
			content: "";
			display: block;
			position: absolute;
			inset: calc(-1 * var(--space-10)) calc(-1 * var(--space-12)) calc(-1 * var(--space-12));
			z-index: 0;
			pointer-events: none;
		}
		.home-top::before {
			-webkit-backdrop-filter: var(--edge-blur-soft);
			backdrop-filter: var(--edge-blur-soft);
			-webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
			mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
		}
		.home-top::after {
			-webkit-backdrop-filter: var(--edge-blur-mid);
			backdrop-filter: var(--edge-blur-mid);
			-webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 85%);
			mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 85%);
		}
		.home-edge-blur {
			-webkit-backdrop-filter: var(--edge-blur-strong);
			backdrop-filter: var(--edge-blur-strong);
			-webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
			mask-image: linear-gradient(to bottom, #000 0%, transparent 65%);
		}
	}

	#feed-grid {
		max-width: none;
	}
	main {
		padding-inline: var(--space-12);
		padding-top: var(--space-10);
		min-height: calc(100dvh - var(--space-130));
	}
	/* Brand and account align with the outer card edges. */
	.home-heading {
		height: var(--space-64);
		gap: var(--space-8);
	}
	.home-brand {
		gap: var(--space-2);
		margin-right: auto;
	}
	.home-mark {
		display: flex;
		align-items: center;
		gap: var(--space-10);
		line-height: var(--space-40);
		letter-spacing: -0.02em;
	}
	.home-logo {
		display: flex;
	}
	.home-menu-toggle {
		display: grid;
		place-items: center;
		width: var(--space-36);
		height: var(--space-36);
		padding: 0;
		border: 0;
		border-radius: var(--space-10);
		background: none;
		color: var(--muted);
	}
	.home-menu-toggle .icon {
		rotate: 90deg;
	}
	.home-menu-toggle[aria-expanded="true"] {
		background: var(--faint);
		color: var(--ink);
	}
	.home-menu:not([hidden]) {
		transform-origin: top right;
		position: absolute;
		z-index: 50;
		top: calc(100% + var(--space-8));
		left: calc(100% - var(--space-36) - var(--space-6));
		display: flex;
		flex-direction: column;
		width: 220px;
		padding: var(--space-6);
		border-radius: var(--space-14);
		background: var(--card);
		box-shadow:
			0 0 0 0.5px var(--line-hover),
			var(--shadow-float);
	}
	.home-menu-item {
		display: flex;
		align-items: center;
		gap: var(--space-6);
		height: 40px;
		padding: 0 var(--space-12) 0 var(--space-6);
		border: 0;
		border-radius: 9px;
		background: none;
		color: var(--ink);
		font: inherit;
		font-size: var(--text-body);
		text-align: left;
	}
	.home-menu-item[aria-checked="true"] {
		font-weight: 600;
		background: var(--faint);
	}
	.home-menu-check {
		display: grid;
		place-items: center;
		width: 24px;
		height: 24px;
		visibility: hidden;
	}
	.home-menu-item[aria-checked="true"] .home-menu-check {
		visibility: visible;
	}
	.home-menu-label {
		flex: 1;
	}
	.home-menu-key {
		font-size: var(--text-meta);
		color: var(--muted);
		font-weight: 400;
	}
	@media (hover: hover) and (pointer: fine) {
		.home-menu-item:hover {
			background: var(--faint);
		}
	}
	.home-search {
		position: relative;
		isolation: isolate;
		display: flex;
		align-items: center;
		gap: var(--space-8);
		width: var(--search-width);
		min-width: 0;
		flex-shrink: 1;
		height: var(--space-40);
		padding: 0 var(--space-8) 0 var(--space-14);
		border-radius: 20px;
		background: transparent;
		color: var(--muted);
		cursor: text;
	}
	.home-search::before {
		content: "";
		position: absolute;
		inset: 0;
		z-index: -1;
		border-radius: inherit;
		background: color-mix(in srgb, var(--glass) 35%, transparent);
		backdrop-filter: var(--glass-filter);
		-webkit-backdrop-filter: var(--glass-filter);
		box-shadow: inset 0 0 0 1px var(--line-card);
		transform-origin: right center;
		pointer-events: none;
	}
	/* At rest a short capsule; a query or tab keeps it open, focus stretches it. No focus ring. */
	.home-search:is(.has-text, .has-token) {
		width: var(--search-tagged-width);
	}
	.home-search.is-open {
		width: var(--search-focused-width);
	}
	.home-search > .icon {
		flex: none;
		width: var(--space-20);
		height: var(--space-20);
	}
	.home-search input {
		flex: 1;
		min-width: 0;
		height: 100%;
		padding: 0;
		border: 0;
		border-radius: 0;
		background: transparent;
		color: var(--ink);
		font-size: var(--text-body);
	}
	.home-search input:focus-visible {
		outline: 0;
	}
	.home-search input::-webkit-search-cancel-button {
		display: none;
	}
	.home-search-key {
		flex: none;
		padding-right: var(--space-6);
		font-size: var(--text-meta);
		color: var(--muted);
	}
	.home-search.has-text .home-search-key {
		display: none;
	}
	.home-search-token {
		flex: none;
		height: 24px;
		padding: 0 9px;
		border: 0;
		border-radius: var(--pill-radius);
		background: var(--ink);
		color: var(--card);
		font: inherit;
		font-size: var(--text-meta);
		font-weight: 600;
	}
	.home-search-token[hidden],
	.home-search-clear[hidden] {
		display: none;
	}
	/* # conditions follow the tab token: accent, like the phone search tokens. */
	.home-search-marks {
		display: flex;
		flex: none;
		gap: var(--space-6);
	}
	.home-search-marks:empty,
	.home-hash-slot:empty {
		display: none;
	}
	.home-search-token.is-hash {
		background: var(--accent);
		color: var(--fixed-white);
	}
	/* The # list floats under the field; arrows move the highlight, Enter picks it. */
	.home-search .search-hash {
		z-index: 60;
		top: calc(100% + var(--space-8));
		left: 0;
		right: 0;
		cursor: default;
	}
	.home-search .search-hash-option:first-of-type {
		background: none;
	}
	.home-search .search-hash-option.is-active,
	.home-search .search-hash-option:focus-visible {
		background: var(--faint);
	}
	@media (hover: hover) and (pointer: fine) {
		.home-search .search-hash-option:hover {
			background: var(--faint);
		}
	}
	/* Type chips: one row under the top bar while there is text (web-interaction.md 搜索). */
	.home-kinds {
		display: flex;
		align-items: center;
		height: var(--space-32);
		margin-bottom: var(--space-2);
	}
	.home-kinds[hidden] {
		display: none;
	}
	.home-kinds .chip {
		min-height: var(--space-32);
		height: var(--space-32);
		background: var(--surface);
		box-shadow: none;
		font-size: var(--text-control);
	}
	.home-kinds .chip.active {
		background: var(--ink);
		color: var(--card);
		font-weight: 600;
	}
	.home-search-clear {
		display: grid;
		place-items: center;
		flex: none;
		width: 28px;
		height: 28px;
		padding: 0;
		border: 0;
		background: none;
		color: var(--card);
	}
	.home-search-clear .icon {
		box-sizing: content-box;
		padding: 3px;
		border-radius: 50%;
		background: var(--secondary);
	}
	.home-account {
		margin-right: calc(-1 * var(--space-2));
	}
	.home-account .account-wrap > .icon {
		width: var(--space-20);
		height: var(--space-20);
	}
	.home-account .account-wrap {
		width: var(--space-40);
		height: var(--space-40);
		background: var(--card);
		box-shadow: inset 0 0 0 1px var(--line-card);
		color: var(--ink);
	}
	.home-tabs {
		display: none;
	}
}

/* Sill · cards · shared source
 * Content stays on opaque white surfaces. Color communicates an action or state.
 * Heights follow content; the layout engine owns column widths and placement.
 */
.feed-item {
	position: absolute;
	left: 0;
	top: 0;
	width: 340px;
}
.feed-card {
	position: relative;
	display: flex;
	flex-direction: column;
	background: var(--card);
	border: 1px solid var(--line-card);
	border-radius: var(--card-radius);
	box-shadow: var(--shadow);
	isolation: isolate;
	overflow: hidden;
	cursor: pointer;
	touch-action: pan-y;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}
.feed-item.feed-card {
	position: absolute;
}
@media (hover: hover) and (pointer: fine) {
	.feed-card:hover {
		border-color: var(--line-hover);
		box-shadow: var(--shadow-hover);
	}
}
.feed-card:focus-within {
	border-color: var(--line-hover);
	box-shadow: var(--shadow-hover);
}
.feed-card:focus {
	outline: none;
}
.feed-card:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 4px;
}
/* Restored pointer focus must not masquerade as keyboard selection. */
:root[data-input-modality="pointer"] .feed-card:focus-visible,
:root[data-input-modality="pointer"] .feed-card .card-title-button:focus-visible {
	outline: none;
}
.feed-card:after {
	content: "";
	position: absolute;
	inset: 0;
	border-radius: inherit;
	border: 2px solid transparent;
	pointer-events: none;
}
.card-body {
	display: flex;
	flex-direction: column;
	gap: var(--block-gap);
	padding: var(--card-padding);
	min-width: 0;
}
.card-title,
.card-summary,
.preview-full {
	overflow-wrap: anywhere;
}

/* head: source icon · source · meta, with one timely value on the right. @design card-type */
.card-head {
	display: flex;
	align-items: center;
	gap: var(--space-6);
	min-height: 20px;
	font-size: var(--text-card-meta);
	line-height: 18px;
	color: var(--muted);
}
.has-cover .card-head-right {
	opacity: 1;
}
.card-head > .icon,
.card-head > .source-icons {
	flex: none;
	color: var(--secondary);
}
.card-src {
	min-width: 0;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.card-head-right {
	margin-left: auto;
	flex: none;
	display: inline-flex;
	align-items: center;
	gap: var(--space-4);
}
.has-cover .card-head {
	padding-right: 0;
}
.source-icons {
	display: inline-flex;
}
.source-icons span {
	display: grid;
	place-items: center;
	width: 20px;
	height: 20px;
	border-radius: 50%;
	background: var(--card);
	border: 1px solid var(--line);
	margin-left: calc(-1 * var(--space-6));
}
.source-icons span:first-child {
	margin-left: 0;
}
.card-progress {
	display: inline-flex;
	align-items: center;
	gap: var(--space-4);
	color: var(--accent);
	font-weight: 500;
}
.event-relative {
	color: var(--accent);
	font-weight: 500;
}
/* A reminder shows the source's time: muted until it comes due, then amber. */
.reminder-label {
	color: var(--muted);
	font-weight: 500;
}
.reminder-label.is-due {
	color: var(--alert);
}
.task-count,
.stack-count {
	color: var(--ink);
	font-weight: 600;
}

/* text: title 2 lines, summary 3 with or without a cover. Full text lives in the reader.
   @design card-type @design card-summary */
.card-title {
	margin: 0;
	font-size: var(--text-card-title);
	font-weight: 600;
	letter-spacing: -0.02em;
	line-height: 22px;
	color: var(--ink);
}
.card-title-button {
	display: -webkit-box;
	-webkit-box-orient: vertical;
	-webkit-line-clamp: 2;
	overflow: hidden;
	width: 100%;
	padding: 0;
	text-align: left;
	background: none;
	font: inherit;
	letter-spacing: inherit;
	line-height: inherit;
	color: inherit;
	border-radius: 4px;
	white-space: pre-line;
}
.card-summary {
	display: -webkit-box;
	-webkit-box-orient: vertical;
	-webkit-line-clamp: var(--summary-lines);
	overflow: hidden;
	margin: 0;
	font-size: var(--text-summary);
	line-height: 1.5;
	color: var(--muted);
}
.card-summary.clamp-2 {
	-webkit-line-clamp: 2;
}
.card-summary.reading-summary {
	-webkit-line-clamp: var(--summary-reading-lines);
}
.card-summary.indent {
	padding-left: var(--space-34);
}
.quote-body {
	gap: var(--space-10);
	padding-bottom: var(--space-22);
}
.quote-text {
	font-size: var(--text-quote);
	line-height: 1.55;
	font-weight: 500;
	letter-spacing: -0.01em;
}
.quote-text .card-title-button {
	-webkit-line-clamp: 4;
}
.note-text {
	font-size: var(--text-body);
	line-height: 1.55;
	font-weight: 400;
	letter-spacing: 0;
}
.note-text .card-title-button {
	-webkit-line-clamp: 6;
}
.key-points {
	list-style: none;
	margin: var(--space-2) 0 0;
	padding: 0;
	display: flex;
	flex-direction: column;
	gap: var(--space-4);
}
.key-points li {
	display: flex;
	align-items: baseline;
	gap: var(--space-10);
	font-size: var(--text-body);
	line-height: 1.5;
	color: var(--ink);
}
/* On a card, key points read at the summary size (A type: 14/22). */
.feed-card .key-points li {
	font-size: var(--text-summary);
	line-height: 1.5;
}
.key-points li span {
	min-width: 0;
	overflow-wrap: anywhere;
}
.feed-card .key-points li span {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.key-points i {
	width: 10px;
	flex: none;
	font-style: normal;
	font-size: var(--text-meta);
	font-weight: 600;
	color: var(--accent);
	text-align: right;
}
.num {
	font-family: var(--rounded);
	font-variant-numeric: tabular-nums;
}

/* media: covers arrive from their dominant color, fading in once decoded; do not animate a blur over each large image. */
.card-cover {
	position: relative;
	flex: none;
	margin: var(--cover-inset) var(--cover-inset) 0;
	aspect-ratio: 16 / 9;
	border-radius: var(--cover-radius);
	overflow: hidden;
	background: var(--surface);
}
.card-image {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
	opacity: 0;
}
.card-image.is-loaded {
	opacity: 1;
	filter: none;
	transform: none;
}
.media-length {
	position: absolute;
	right: 12px;
	bottom: 12px;
	padding: var(--space-2) var(--space-8);
	border-radius: 8px;
	color: var(--fixed-white);
	background: var(--fixed-black-55);
	font-size: var(--text-caption);
	line-height: 1.5;
}
.photo-grid {
	display: grid;
	gap: var(--space-2);
}
.photo-grid.n2 {
	grid-template-columns: 1fr 1fr;
}
.photo-grid.n3 {
	grid-template-columns: 2fr 1fr;
	grid-template-rows: 1fr 1fr;
}
.photo-grid.n3 img:first-child {
	grid-row: span 2;
}
.mini-player {
	display: flex;
	align-items: center;
	gap: var(--space-10);
	margin-top: var(--space-4);
	font-size: var(--text-caption);
	color: var(--muted);
}
.bar {
	position: relative;
	flex: 1;
	height: 4px;
	border-radius: 2px;
	background: var(--faint);
	overflow: hidden;
}
.bar i {
	position: absolute;
	inset: 0 auto 0 0;
	background: var(--ink);
	border-radius: 2px;
}

/* data and list blocks */
.sender {
	display: flex;
	align-items: center;
	gap: var(--space-10);
}
.sender > span:last-child {
	display: flex;
	flex-direction: column;
	min-width: 0;
}
.sender b {
	font-size: var(--text-body);
	font-weight: 600;
	line-height: 1.3;
}
.sender small {
	font-size: var(--text-caption);
	line-height: 1.4;
	color: var(--muted);
}
.avatar {
	display: inline-grid;
	place-items: center;
	flex: none;
	border-radius: 50%;
	font-size: var(--text-caption);
	font-weight: 600;
	color: var(--fixed-white);
}
.avatars {
	display: inline-flex;
}
.avatars .avatar {
	border: 2px solid var(--card);
	margin-left: calc(-1 * var(--space-6));
	font-size: 10px;
}
.avatars .avatar:first-child {
	margin-left: 0;
}
.people {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	padding-top: var(--space-4);
	font-size: var(--text-meta);
	color: var(--muted);
}
.ref {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	min-height: 36px;
	padding: 9px var(--space-10);
	border-radius: var(--space-12);
	background: var(--surface);
	font-size: var(--text-meta);
	color: var(--ink);
	text-align: left;
	width: 100%;
}
.ref > span {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.ref > .icon {
	flex: none;
	color: var(--secondary);
}
@media (hover: hover) and (pointer: fine) {
	button.ref:hover {
		background: var(--faint);
	}
}
button.ref:active {
	background: var(--faint);
}
.refs {
	display: flex;
	flex-direction: column;
	gap: var(--space-6);
}
.attachment {
	align-self: flex-start;
	width: auto;
	margin-top: var(--space-4);
	padding-right: var(--space-12);
}
.event-time {
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: var(--space-12);
	padding-top: var(--space-4);
}
.event-start {
	font-size: var(--text-figure);
	line-height: 1.1;
	font-weight: 600;
	letter-spacing: -0.02em;
}
.event-end {
	display: flex;
	flex-direction: column;
	align-items: flex-end;
	padding-bottom: var(--space-3);
	font-size: var(--text-body);
	line-height: 1.35;
	font-weight: 500;
}
.event-end small {
	font-size: var(--text-meta);
	font-weight: 400;
	color: var(--muted);
}
.stats-trio {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: var(--space-8);
	padding: var(--space-6) 0 var(--space-2);
}

.checklist {

/* @design card-type: the circle stays centered on the first text line. */

/* The reminder's circle sits before its title, on the card and in its detail alike. */
.reminder-row {

/* The circle is the reminder's only action: a 44px target around a 22px mark, Sill state only. */

.card-actions-row {

}
.pill {

@media (hover: hover) and (pointer: fine) {

}
.pill.soft:active {

}
.pill.primary {

}
@media (hover: hover) and (pointer: fine) {

		filter: brightness(1.08);
	}
}
.pill.primary:active {
	filter: brightness(1.08);
}
.pill.primary .icon {
	opacity: 0.85;
}

/* The more button: hidden at rest, a glass circle with bold dots on hover or focus.
   It stays focusable; touch screens keep it visible (responsive.css). */
.card-actions {
	position: absolute;
	right: 12px;
	top: 12px;
	display: flex;
	z-index: 3;
}
.card-more-trigger {
	width: 32px;
	height: 32px;
	min-width: 32px;
	color: var(--ink);
	background: var(--glass);
	border: 1px solid var(--fixed-white-72);
	box-shadow: 0 2px 8px var(--fixed-black-8);
	opacity: 0;
	pointer-events: none;
}
.card-more-trigger .icon {
	width: 16px;
	height: 16px;
	stroke-width: 2.4;
}
.card-more-trigger:before {
	content: "";
	position: absolute;
	inset: -6px;
}
@media (hover: hover) and (pointer: fine) {
	.feed-card:hover .card-more-trigger {
		opacity: 1;
		pointer-events: auto;
	}
}
.feed-card:focus-within .card-more-trigger,
.feed-card.tools-open .card-more-trigger {
	opacity: 1;
	pointer-events: auto;
}
@media (hover: hover) and (pointer: fine) {
	.card-more-trigger:hover {
		background: var(--card);
	}
}
.feed-card.tools-open .card-more-trigger {
	background: var(--card);
}
.feed-card.tools-open {
	overflow: visible;
	z-index: 6;
}
/* Selection stays on the original card. No corner checkmark or lifted copy. */
.selection-surface.is-selecting .feed-card .card-actions {
	visibility: hidden;
}
.selection-surface.is-selecting .feed-card:not(.is-selected):after {
	border-color: var(--line-hover);
}
.feed-card.is-selected:after {
	border-color: var(--accent);
}
.feed-card.is-drag-source {
	opacity: 0.32;
	box-shadow: none;
}

/* Read, ended and completed keep their color even after pointer or keyboard focus. */
.feed-card.is-read,
.feed-card.is-ended,
.feed-card.is-complete {
	background: var(--card-read);
	border-color: var(--line-read);
	box-shadow: none;
}
.feed-card.is-read .card-title,
.feed-card.is-ended .card-title,
.feed-card.is-complete .card-title,

}

}
@media (hover: hover) and (pointer: fine) {

.feed-card.is-ended:focus-within,

/* Desktop density changes width only; text determines the card's height. */

.source-marks {

.media-play-mark {

.media-cover-timeline .media-card-progress {

.sender small {

}
.pr-card-heading {

}
.pr-state {

	padding: 3px 9px;

}

.pr-state-closed {

}

}

}
.pr-detail {

}

}
.pr-file > span {
	white-space: nowrap;

.mail-attachments {

/* CardTypeDetails: compact grey task circles; detail circles keep their larger size. */
.feed-card .check-dot {
	width: 18px;
	height: 18px;
	flex-basis: 18px;
}
.feed-card .check-item > .check-dot {
	margin-top: calc((1lh - 18px) / 2);
}
.feed-card .reminder-check {
	margin-inline: -13px;
	margin-bottom: -13px;
}
.feed-card .reminder-row {
	gap: var(--space-10);
}
.feed-card .card-summary.indent {
	padding-left: var(--space-28);
}
.preview-title-row .reminder-check {
	margin-inline: -10px;
	margin-bottom: -10px;
}
.preview-title-row .reminder-check .check-dot {

.mini-play-mark .icon {

/* Stacks: one place on the desk, layered edges, opened in place. */
@media (hover: hover) and (pointer: fine) {
	.stack-card:hover {
		overflow: visible;
		background: transparent;
		border-color: transparent;
		box-shadow: none;
	}
}
.stack-card,
.stack-card:focus-within {
	overflow: visible;
	background: transparent;
	border-color: transparent;
	box-shadow: none;
}
.deck-edge {
	position: absolute;
	left: 10px;
	right: 10px;
	bottom: -6px;
	height: 24px;
	border-radius: 0 0 18px 18px;
	background: var(--card);
	border: 1px solid var(--line-card);
	border-top: 0;
	box-shadow: var(--shadow);
	z-index: 0;
}
.deck-edge.deep {
	left: 20px;
	right: 20px;
	bottom: -11px;
	opacity: 0.7;
	z-index: -1;
}
/* The deck: every piece is a whole card in the same place. The top one moves with the hand; the next waits just beneath. */
.deck {
	position: relative;
	z-index: 1;
	display: grid;
	touch-action: pan-y;
	user-select: none;
	-webkit-user-select: none;
}
.deck-card {
	grid-area: 1 / 1;
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--card);
	border: 1px solid var(--line-card);
	border-radius: var(--card-radius);
	box-shadow: var(--shadow);
	transform-origin: 50% 100%;
	visibility: hidden;
	will-change: transform;
}
.deck-card.is-top {
	visibility: visible;
	z-index: 3;
}
@media (hover: hover) and (pointer: fine) {
	.stack-card:hover .deck-card.is-top {
		border-color: var(--line-hover);
		box-shadow: var(--shadow-hover);
	}
}
.stack-card:focus-within .deck-card.is-top {
	border-color: var(--line-hover);
	box-shadow: var(--shadow-hover);
}
.deck-card.is-next {
	visibility: visible;
	z-index: 2;
	transform: translateY(6px);
	box-shadow: none;
}
.deck-card.is-prev {
	z-index: 4;
}
.deck.is-dragging {
	cursor: grabbing;
}
/* While a card is in the hand or in flight it passes over the neighbouring columns. */
.stack-card:has(.deck.is-dragging),
.stack-card:has(.deck[data-busy]),
.stack-card:has(.deck-card[style*="transform"]) {
	z-index: 20;
}
.stack-count {
	color: var(--muted);
	font-weight: 500;
}
.stack-card .card-head-right {
	opacity: 1;
}
.stack-pos {
	color: var(--ink);
	font-weight: 600;
}
.stack-open {
	display: flex;
	flex-direction: column;
	gap: var(--space-10);
}
.stack-open-head {
	display: flex;
	align-items: center;
	gap: var(--space-6);
	min-height: 28px;
	padding: 0 var(--space-4);
	font-size: var(--text-meta);
	color: var(--muted);
}
.stack-open-head .icon {
	color: var(--secondary);
}
.stack-open-head .text-link {
	margin-left: auto;
}
.feed-card.is-compact .card-summary {
	display: none;
}
.feed-card.is-compact .card-body {
	padding: var(--space-14) var(--card-padding);
}
.text-link {
	background: none;
	padding: var(--space-6) var(--space-2);
	font-size: var(--text-meta);
	font-weight: 500;
	color: var(--accent);
	border-radius: 6px;
}
.text-link.warn {
	color: var(--alert);
}
@media (hover: hover) and (pointer: fine) {
	.text-link:hover {
		text-decoration: underline;
	}
}
.text-link:active {
	opacity: 0.6;
}

/* The two shelf rows at the end of the desk. */
.shelf-entry {
	display: flex;
	flex-direction: column;
	gap: var(--space-10);
}
.shelf-row {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	min-height: 48px;
	padding: 0 var(--space-18);
	border-radius: 16px;
	background: var(--faint-row);
	font-size: var(--text-control);
	color: var(--ink);
	text-align: left;
}
@media (hover: hover) and (pointer: fine) {

		background: var(--faint);
	}
}
.shelf-row > .icon {
	color: var(--muted);
}
.shelf-row span {
	color: var(--muted);
	font-size: var(--text-meta);
}
.shelf-row .num {
	margin-left: auto;
	color: var(--muted);
}
/* Pressing a card gives a little, like the prototype: it is something you can pick up. */

/* A menu's hit targets keep their size even while the touched parent settles. */
@media (hover: hover) and (pointer: fine) {
	body:not(.is-dragging) .feed-card.feed-item.tools-open:hover {
		--motion-managed-transform: none;
		transform: none;
	}
}
.feed-card.tools-open,
.feed-card.tools-open:not(.stack-card):active:not(:has(button:active)) {
	--motion-managed-transform: none;
	transform: none;
}

/* Desktop spacing groups metadata, content and supporting references. */
@media (min-width: 651px) {
	.feed-card .check-item {
		align-items: flex-start;
	}
	.feed-card .check-item > span:last-child {
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
		white-space: normal;
	}
}
.related-more {
	padding-left: 0;
}

/* Sill · overlays · shared source
 * One dialog, several shapes: a lifted card (preview), a page (reader), a sheet (panels), a lightbox (photos).
 */

dialog {
	color: var(--ink);
	padding: 0;
	border: 0;
	background: transparent;
	max-width: 100vw;
	max-height: 100dvh;
	overflow: visible;
	outline: none;
}
/* Scrim: a clean dim, no fog. The page steps back in light, not in blur. */
dialog::backdrop {
	background: var(--dim);
}
.sheet {
	position: relative;
	background: var(--card);
	border-radius: var(--sheet-radius);
	box-shadow: var(--shadow-sheet);
	overflow: hidden;
}
.sheet-scroll {
	max-height: min(78dvh, 760px);
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: none;
}
.sheet-close {
	position: absolute;
	right: 14px;
	top: 14px;
	z-index: 5;
}
.sheet-close .icon-button {
	width: 36px;
	height: 36px;
	min-width: 36px;
	background: var(--card);
	box-shadow:
		0 0 0 0.5px var(--line-card),
		var(--shadow-float);
}
.grabber {
	display: none;
}

/* The card toolbar: two to three verbs as icons in one glass capsule. Words live in the content. */
.float-bar {
	background: var(--glass-thick);
	display: flex;
	align-items: center;
	gap: var(--space-4);
	padding: var(--space-4);
	height: var(--rail-row);
	border-radius: var(--pill-radius);
	width: max-content;
	max-width: calc(100vw - 32px);
}
.float-bar .solid-button,
.float-bar .pill {
	margin-left: var(--space-6);
}

/* Preview: the card lifts and grows. Its head row holds the way out; the toolbar floats inside the
   card's own bottom edge, over a scroll edge, and the text ends above it. Nothing hangs off the card. */
#modal.preview {
	width: min(760px, calc(100vw - 48px));
	margin: auto;
}
#modal.preview[open] {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 0;
}
.preview-sheet {
	position: relative;
	z-index: 1;
	width: 100%;
	display: flex;
	flex-direction: column;
	max-height: min(88dvh, 900px);
}
/* The head floats over the content: no band of white above the text. Its round buttons tuck away with
   the toolbar while reading on, and come back on a pause over a soft edge. */
.preview-sheet.is-full {
	height: 100dvh;
	max-height: 100dvh;
}
.sheet-head {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	z-index: 4;
	display: flex;
	align-items: center;
	justify-content: flex-end;
	height: 60px;
	padding: 0 var(--space-16);
	pointer-events: none;
}
.sheet-head-tools {
	display: flex;
	gap: var(--space-8);
	pointer-events: auto;
}
.sheet-head-tools.is-tucked {
	transform: var(--motion-toolbar-transform, translateY(-12px));
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
.preview-sheet:before {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	height: 76px;
	z-index: 3;
	pointer-events: none;
	opacity: 0;
	background: linear-gradient(
		to bottom,
		color-mix(in srgb, var(--card) 92%, transparent) 30%,
		color-mix(in srgb, var(--card) 0%, transparent)
	);
}
.preview-sheet.is-scrolled:not(:has(.sheet-head-tools.is-tucked)):before {
	opacity: 1;
}
/* The close disc sits in the source row above the title, so the title keeps the whole width.
   Without a source row it falls back to the first title line. */
.preview-sheet .sheet-head {
	top: var(--preview-title-top, 32px);
	height: 44px;
}
.preview-sheet #modal-title,
.preview-sheet .preview-body :is(.preview-sender, .preview-meta) {
	padding-right: var(--space-48);
}
.preview-sheet:has(.sheet-head [data-action="reader"]) #modal-title,
.preview-sheet:has(.sheet-head [data-action="reader"])
	.preview-body
	:is(.preview-sender, .preview-meta) {
	padding-right: var(--space-92);
}
.preview-sheet:has(.preview-body :is(.preview-sender, .preview-meta)) #modal-title {
	padding-right: 0;
}
.preview-title-row #modal-title {
	min-width: 0;
}
.preview-sheet.is-scrolled .sheet-head {
	top: 0;
}
.sheet-handle {
	display: none;
}
/* Floating round buttons: a white disc lifted by a soft shadow, never a grey blot. */
.sheet-head .icon-button {
	width: 36px;
	height: 36px;
	min-width: 36px;
	background: var(--card);
	color: var(--ink);
	box-shadow:
		0 0 0 0.5px var(--line-card),
		var(--shadow-float);
}
/* The visible circle is 36; the hit area reaches the 44 minimum. */
.sheet-head .icon-button:before {
	content: "";
	position: absolute;
	inset: -4px;
}
@media (hover: hover) and (pointer: fine) {
	.sheet-head .icon-button:hover {
		background: var(--surface);
	}
}
.sheet-head .icon .icon,
.sheet-head .icon-button .icon {
	width: 18px;
	height: 18px;
}
#modal.preview > .float-bar {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 18px;
	margin-inline: auto;
	z-index: 3;
}
/* Scroll edge at the foot of the card: text fades and softens where the toolbar floats. */
#modal.preview:has(> .float-bar) > .preview-sheet:after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: calc(var(--rail-row) + 18px + 44px);
	pointer-events: none;
	z-index: 2;
	/* Under the capsule the text is only a faint texture; above it, it fades in over 44px. */
	background: linear-gradient(
		to top,
		color-mix(in srgb, var(--card) 94%, transparent) 0%,
		color-mix(in srgb, var(--card) 86%, transparent) calc(var(--rail-row) + 18px),
		color-mix(in srgb, var(--card) 0%, transparent) 100%
	);
}
#modal.preview:has(> .float-bar.is-tucked) .preview-sheet:after {
	opacity: 0;
}
.preview-foot {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--space-8);
	padding-top: var(--space-10);
}
.preview-foot .text-button {
	color: var(--accent-ink);
	font-size: var(--text-control);
	padding-inline: var(--space-10);
	margin-left: calc(-1 * var(--space-10));
}
/* Stacked previews: the card below shows as an edge above this one. */
.sheet-peek {
	flex: none;
	width: 94%;
	height: 44px;
	margin-bottom: calc(-1 * var(--space-46));
	border: 1px solid var(--line-card);
	border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
	background: var(--card-read);
	box-shadow: var(--shadow-sheet);
	cursor: pointer;
}
.preview-sheet .sheet-scroll {
	flex: 0 1 auto;
	min-height: 0;
	max-height: none;
	padding-bottom: 0;
	scroll-padding-bottom: var(--gap);
}
#modal.preview:has(> .float-bar) .preview-sheet .sheet-scroll {
	padding-bottom: calc(var(--rail-row) + var(--space-40));
	scroll-padding-bottom: calc(var(--rail-row) + var(--space-40));
}
.preview-cover {
	margin: var(--space-8) var(--space-8) 0;
	aspect-ratio: 16 / 9;
	border-radius: 22px;
	overflow: hidden;
	background: var(--surface);
}
.preview-cover img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}
.preview-body {
	display: flex;
	flex-direction: column;
	gap: var(--space-14);
	padding: var(--space-26) var(--space-30) var(--space-30);
	overflow-wrap: anywhere;
}
.preview-body > .preview-cover,
.reader-body > .preview-cover {
	margin: 0;
	width: 100%;
	flex: none;
}
.preview-meta {
	min-width: 0;
	display: flex;
	align-items: center;
	gap: var(--space-6);
	font-size: var(--text-meta);
	color: var(--secondary);
}
.preview-meta > span {
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.preview-meta .icon {
	flex: none;
	color: var(--secondary);
}
.preview-body h1,
.preview-body .preview-title-row {
	font-size: 24px;
	font-weight: 600;
	letter-spacing: -0.03em;
	line-height: 1.35;
	white-space: pre-line;
}
.preview-lead {
	font-size: 16px;
	line-height: 1.7;
	color: var(--ink);
}
.preview-full p {
	font-size: 16px;
	line-height: 1.85;
	color: var(--ink);
	white-space: pre-wrap;
}
/* Detail text is one Markdown body (ADR 0063); every block keeps the paragraph rhythm. */
.preview-full > * + * {
	margin-top: var(--space-16);
}
.preview-full :is(h1, h2, h3, h4, h5, h6) {
	font-size: 18px;
	font-weight: 600;
	line-height: 1.5;
	letter-spacing: -0.01em;
	color: var(--ink);
}
.preview-full :is(h1, h2) {
	font-size: 20px;
}
.preview-full :is(ul, ol) {
	margin: 0;
	padding-left: 1.4em;
	display: flex;
	flex-direction: column;
	gap: var(--space-4);
}
.preview-full li {
	font-size: 16px;
	line-height: 1.75;
	color: var(--ink);
}
.preview-full ol > li::marker {
	color: var(--accent);
	font-weight: 600;
}
.preview-full li > :is(ul, ol) {
	margin-top: var(--space-4);
}
.preview-full blockquote {
	margin: 0;
	padding-left: var(--space-12);
	border-left: 2px solid var(--line-hover);
	color: var(--muted);
}
.preview-full a {
	color: var(--accent);
	text-decoration: underline;
	text-underline-offset: 2px;
}
.preview-full code {
	font-family: "SF Mono", ui-monospace, Menlo, monospace;
	font-size: 0.9em;
	padding: 1px 4px;
	border-radius: 4px;
	background: var(--surface);
}
.preview-full pre {
	margin: 0;
	padding: var(--space-12);
	border-radius: var(--control-radius);
	background: var(--surface);
	overflow-x: auto;
}
.preview-full pre code {
	padding: 0;
	background: none;
}
.preview-full hr {
	border: 0;
	border-top: 1px solid var(--line);
}
.preview-note {
	border: 1px solid var(--line-card);
	border-radius: var(--space-14);
	padding: var(--space-12) var(--space-14);
	font-size: var(--text-control);
	line-height: 1.6;
	color: var(--secondary);
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}
.preview-note-label {
	display: block;
	font-size: var(--text-caption);
	font-weight: 400;
	margin-bottom: var(--space-4);
}
.preview-body .preview-note p,
.reader-body .preview-note p {
	margin: 0;
	font: inherit;
	color: inherit;
}
.preview-sender {
	display: flex;
	align-items: center;
	gap: var(--space-10);
}
.preview-sender > span:last-child {
	display: flex;
	flex-direction: column;
}
.preview-sender b {
	font-size: var(--text-body);
}
.preview-sender small {
	font-size: var(--text-caption);
	color: var(--muted);
}
.detail-rows {
	display: flex;
	flex-direction: column;
}
.detail-row {
	display: flex;
	align-items: center;
	gap: var(--space-12);
	min-height: 48px;
	border-top: 1px solid var(--line);
	font-size: var(--text-body);
}
.detail-row:first-child {
	border-top: 0;
}
.detail-row > .row-icon {
	display: grid;
	place-items: center;
	width: 30px;
	height: 30px;
	border-radius: 8px;
	background: var(--surface);
	color: var(--muted);
	flex: none;
}
.detail-row > span:nth-child(2) {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.detail-row small {
	font-size: var(--text-meta);
	color: var(--muted);
	white-space: nowrap;
}
.detail-row b,
.detail-row em {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
.detail-row b {
	display: block;
	font-weight: 400;
}
.detail-row em {
	display: block;
	font-style: normal;
	font-size: var(--text-caption);
	color: var(--muted);
}
button.detail-row {
	width: 100%;
	text-align: left;
}
@media (hover: hover) and (pointer: fine) {
	button.detail-row:hover {
		background: var(--canvas);
	}
}
button.detail-row:active {
	background: var(--canvas);
}
.event-hero {
	display: flex;
	align-items: baseline;
	gap: var(--space-12);
	flex-wrap: wrap;
}
.event-hero .num:first-child {
	font-size: 52px;
	line-height: 1.05;
	font-weight: 600;
	letter-spacing: -0.03em;
}
.event-hero small {
	font-size: var(--text-body);
	color: var(--muted);
}
.why-line {
	display: flex;
	align-items: center;
	gap: var(--space-10);
	font-size: var(--text-control);
	color: var(--ink);
}
.why-line .icon {
	color: var(--secondary);
}
.detail-task-list .check-item {
	min-height: 44px;
	font-size: var(--text-body);
}
.preview-tags {
	display: flex;
	gap: var(--space-6);
	flex-wrap: wrap;
}

.preview-tags .chip {
	font-size: var(--text-caption);
	min-height: 0;
	padding: var(--space-3) var(--space-8);
	line-height: 1.5;
	max-width: 100%;
	overflow-wrap: anywhere;
}
.preview-published {
	margin-top: 0;
	display: grid;
	gap: var(--space-6);
	font-size: var(--text-caption);
	line-height: 1.6;
	color: var(--secondary);
}
.settings-hint {
	margin: var(--space-8) var(--space-4) 0;
	font-size: var(--text-meta);
}

/* Podcast cover and time presentation. */
.player {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--space-14);
	padding: var(--space-28) var(--space-28) var(--space-30);
	background: linear-gradient(180deg, var(--fixed-podcast-light), var(--card) 70%);
}
:root[data-theme="dark"] .player {
	background: linear-gradient(180deg, var(--fixed-podcast-dark), var(--card) 70%);
}
.player-art {
	width: 150px;
	height: 150px;
	border-radius: 22px;
	background: linear-gradient(
		140deg,
		var(--fixed-podcast-cover-start),
		var(--fixed-podcast-cover-mid) 55%,
		var(--fixed-podcast-cover-end)
	);
	box-shadow: 0 12px 30px var(--fixed-black-12);
}
.player h1 {
	font-size: 20px;
	text-align: center;
}
.player .preview-meta {
	justify-content: center;
}
.player-times {
	display: flex;
	justify-content: space-between;
	font-size: var(--text-caption);
	color: var(--muted);
}
/* Photos: black, large, left and right, Esc to leave. */
#modal.lightbox {
	width: 100vw;
	height: 100dvh;
	max-width: none;
	max-height: none;
	margin: 0;
	background: var(--fixed-photo-canvas);
	color: var(--fixed-white);
}
@supports (height: 100dvh) {
	#modal.lightbox {
		height: 100dvh;
	}
}
#modal.lightbox[open] {
	display: flex;
	flex-direction: column;
}
/* Recovery stays in the photo layout so it cannot cover thumbnails or discussion controls. */
#modal.lightbox #toast {
	position: static;
	flex: none;
	align-self: center;
	margin: 0 var(--rail-edge) max(var(--space-12), env(safe-area-inset-bottom));
}
#modal.lightbox::backdrop {
	background: var(--fixed-photo-canvas);
}
.lightbox-top {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: var(--space-16) var(--space-20);
	font-size: var(--text-meta);
	color: var(--fixed-white-75);
}
.lightbox-top .icon-button {
	color: var(--fixed-white);
}
@media (hover: hover) and (pointer: fine) {
	.lightbox-top .icon-button:hover {
		background: var(--fixed-white-12);
	}
}
.lightbox-stage {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-12);
	padding: 0 var(--space-20);
	min-height: 0;
}
.lightbox-stage img {
	width: min(1100px, 100%);
	height: 100%;
	border-radius: 6px;
	object-fit: contain;
	min-width: 0;
	flex: 1;
}
.lightbox-stage .icon-button {
	color: var(--fixed-white);
	flex: none;
}
@media (hover: hover) and (pointer: fine) {
	.lightbox-stage .icon-button:hover {
		background: var(--fixed-white-12);
	}
}
.lightbox-thumbs {
	display: flex;
	justify-content: center;
	gap: var(--space-6);
	padding: var(--space-16);
}
.lightbox-thumbs button {
	width: 44px;
	height: 32px;
	border-radius: 6px;
	overflow: hidden;
	opacity: 0.55;
	border: 2px solid transparent;
}
.lightbox-thumbs button.on {
	opacity: 1;
	border-color: var(--fixed-white);
}
.lightbox-thumbs img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}
#modal.lightbox > .float-bar {
	position: static;
	flex: none;
	align-self: center;
	margin: 0 auto max(var(--space-16), env(safe-area-inset-bottom));
}
.lightbox .preview-foot {
	flex: none;
	justify-content: center;
	padding: 0 var(--space-20) max(var(--space-12), env(safe-area-inset-bottom));
}
.lightbox .preview-foot .text-button {
	min-height: var(--hit-target);
	margin-left: 0;
	color: var(--fixed-white);
}
@media (hover: hover) and (pointer: fine) {
	.lightbox .preview-foot .text-button:hover {
		background: var(--fixed-white-12);
	}
}
.lightbox .preview-foot :focus-visible {
	outline-color: var(--fixed-white);
}

/* Reader: a page, not a box. A thin line on top shows how far you are. */
#modal.reader {
	width: 100vw;
	height: 100dvh;
	max-width: none;
	max-height: none;
	margin: 0;
	background: var(--card);
}
#modal.reader::backdrop {
	background: var(--card);
}
.reader-progress {
	width: 100%;
	transform-origin: left center;
	position: fixed;
	left: 0;
	top: 0;
	height: 2px;
	background: var(--accent-fill);
	z-index: 4;
}
.reader-scroll {
	height: 100dvh;
	overflow-y: auto;
	overscroll-behavior: contain;
}
.reader-body {
	display: flex;
	flex-direction: column;
	gap: var(--space-14);
	width: 100%;
	margin: 0 auto;
	padding: var(--space-88) var(--space-30) var(--space-160);
}
.reader-body .preview-meta {
	margin-bottom: 0;
}
.reader-body h1,
.reader-body .preview-title-row {
	font-size: 34px;
	line-height: 1.3;
	font-weight: 600;
	letter-spacing: -0.035em;
	margin: 0;
	white-space: pre-line;
}
.reader-body p {
	font-size: 18px;
	line-height: 1.9;
	margin: 0;
	color: var(--ink);
}
.reader-body .preview-full li {
	font-size: 18px;
	line-height: 1.9;
}
.reader-body .reader-cover {
	width: 100%;
	border-radius: 18px;
	margin: 0 0 var(--space-32);
	aspect-ratio: 16 / 9;
	object-fit: cover;
}
.reader .float-bar {
	position: fixed;
	left: 0;
	right: 0;
	bottom: max(24px, env(safe-area-inset-bottom));
	margin-inline: auto;
	z-index: 5;
}
.reader-head {
	position: fixed;
	top: max(14px, env(safe-area-inset-top));
	right: max(16px, env(safe-area-inset-right));
	z-index: 5;
	display: flex;
	gap: var(--space-2);
	padding: var(--space-4);
	border-radius: var(--pill-radius);
}
/* Bars tuck away completely while reading on; a pause or a turn back brings them back. */
dialog > .float-bar.is-tucked,
dialog > .float-bar.is-hidden {
	transform: var(--motion-toolbar-transform, translateY(calc(100% + 40px)));
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
.reader-head.is-tucked {
	transform: var(--motion-toolbar-transform, translateY(calc(-100% - 24px)));
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
}
/* The read-end ring closes into a check when the last paragraph is reached. */
.skeleton-lines {
	display: flex;
	flex-direction: column;
	gap: var(--space-14);
	margin-bottom: var(--space-28);
}
.skeleton-lines i {
	height: 12px;
	border-radius: 6px;
	background: var(--surface);
}
.skeleton-lines i:last-child {
	width: 62%;
}

.lightbox-caption {
	flex: none;
	text-align: center;
	padding: var(--space-12) var(--space-20);
	font-size: var(--text-control);
	color: var(--fixed-white-75);
}
.lightbox > .preview-note {
	flex: none;
	margin: var(--space-12) var(--space-20);
}

/* Real media controls and supplied chapters/transcript. */
.media-detail,
.media-primary,
.media-secondary,
.audio-player {
	display: flex;
	flex-direction: column;
	gap: var(--space-16);
	min-width: 0;
}
.youtube-player {
	width: 100%;
	aspect-ratio: 16 / 9;
	min-height: var(--media-player-min-height);
	border-radius: var(--cover-radius);
	overflow: hidden;
	background: var(--surface);
}
.youtube-player iframe {
	width: 100%;
	height: 100%;
	border: 0;
}
.youtube-frame {
	position: relative;
}
.youtube-poster {
	position: absolute;
	inset: 0;
	border-radius: var(--cover-radius);
	overflow: hidden;
	background: var(--surface) center / cover no-repeat;
}
.youtube-poster::after {

/* Panels: a sheet with a title, rows and quiet actions. */
#modal.panel {
	width: min(560px, calc(100vw - 32px));
	margin: auto;
}

	width: min(440px, calc(100vw - 32px));
}

.panel-content {
	padding: var(--space-28) var(--space-28) var(--space-28);
}

	font-size: var(--text-panel-title);

	margin: 0 var(--space-48) var(--space-6) 0;
	letter-spacing: -0.03em;
}
.panel-sub {
	font-size: var(--text-meta);

	margin-bottom: var(--space-18);

	gap: var(--space-12);
	margin-bottom: var(--space-14);
}

	margin: 0;
}

.panel-head .muted {

}
.muted {

	color: var(--muted);
}
.field-label {
	display: block;
	font-size: var(--text-caption);
	font-weight: 500;
	color: var(--muted);
	margin: var(--space-20) 0 var(--space-8);
}

	font-size: var(--text-caption);
	color: var(--muted);
	margin: var(--space-16) 0 var(--space-4);
}
