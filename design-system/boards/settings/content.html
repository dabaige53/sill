.panel-footer {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-12);
	margin-top: var(--space-22);
}
.panel-footer:empty {
	display: none;
}
.row-list {
	display: flex;
	flex-direction: column;
}
.row-list > * + * {
	border-top: 1px solid var(--line);
}
.list-row {
	display: flex;
	align-items: center;
	gap: var(--space-12);
	min-height: 56px;
	padding: var(--space-6) var(--space-10);
	margin: 0 calc(-1 * var(--space-10));
	border-radius: var(--control-radius);
	width: calc(100% + 20px);
	text-align: left;
	position: relative;
}
.row-list > .list-row + .list-row {
	border-top: 0;
}
.row-list > .list-row + .list-row:before {
	content: "";
	position: absolute;
	left: 10px;
	right: 10px;
	top: 0;
	border-top: 1px solid var(--line);
}
@media (hover: hover) and (pointer: fine) {
	button.list-row:hover,
	.list-row.hoverable:hover {
		background: var(--canvas);
	}
}
button.list-row:active {
	background: var(--canvas);
}
.list-row .row-icon {
	display: grid;
	place-items: center;
	width: 30px;
	height: 30px;
	border-radius: 8px;
	background: var(--surface);
	color: var(--muted);
	flex: none;
}
.list-row .row-main {
	flex: 1;
	min-width: 0;
	display: flex;
	flex-direction: column;
}
.list-row .row-main b {
	font-weight: 400;
	font-size: var(--text-body);
	min-width: 0;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.list-row .row-main small {
	font-size: var(--text-caption);
	color: var(--muted);
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.list-row .row-side {
	font-size: var(--text-meta);
	color: var(--muted);
	white-space: nowrap;
	display: flex;
	align-items: center;
	gap: var(--space-10);
}
.list-row .row-side {
	display: grid;
	flex: none;
	justify-items: end;
}
.list-row .row-side > * {
	grid-area: 1 / 1;
}
/* The date shares the cell with 放回桌面 and only fades; it must not take the click. */
.list-row .row-date {
	pointer-events: none;
}
.list-row .row-put {
	display: inline-flex;
	align-items: center;
	gap: var(--space-4);
	white-space: nowrap;
	opacity: 0;
}
@media (hover: hover) and (pointer: fine) {
	.list-row:hover .row-put {
		opacity: 1;
	}
}
.list-row:focus-within .row-put {
	opacity: 1;
}
@media (hover: hover) and (pointer: fine) {
	.list-row:hover .row-date {
		opacity: 0;
	}
}
.list-row:focus-within .row-date {
	opacity: 0;
}

/* Settings: five groups, one screen each. */
.settings-layout {
	display: grid;
	grid-template-columns: 200px minmax(0, 1fr);
	min-height: min(560px, 78dvh);
}
.settings-nav {
	display: flex;
	flex-direction: column;
	gap: var(--space-2);
	padding: var(--space-28) var(--space-16);
	background: var(--canvas);
	border-right: 1px solid var(--line);
}
.settings-nav button {
	display: flex;
	align-items: center;
	gap: var(--space-10);
	min-height: var(--space-32);
	padding: 0 var(--space-16);
	border-radius: 9px;
	font-size: var(--text-control);
	color: var(--ink);
	text-align: left;
}
@media (hover: hover) and (pointer: fine) {
	.settings-nav button:hover {
		background: var(--faint);
	}
}
.settings-nav button:active {
	background: var(--faint);
}
/* Selected is a quiet, raised row in the same ink; blue stays for the one action that commits. */
.settings-nav button.on {
	background: var(--card);
	color: var(--ink);
	font-weight: 600;
	box-shadow:
		0 0 0 0.5px var(--line-card),
		0 1px 3px var(--fixed-black-6);
}
.settings-main {
	padding: var(--space-28) var(--space-32);
	max-height: min(78dvh, 760px);
	overflow-y: auto;
	background: var(--canvas);
	scrollbar-width: none;
}
.settings-main h2 {
	font-size: var(--text-panel-title);
	margin: 0 var(--space-40) var(--space-18) 0;
}
.settings-card {
	background: var(--card);
	border: 0;
	box-shadow: 0 0 0 0.5px var(--line-card);
	border-radius: 14px;
	padding: 0 var(--space-16);
}
.settings-card + .settings-card {
	margin-top: var(--space-16);
}
.setting-row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-16);
	min-height: 48px;
	padding: var(--space-8) 0;
	font-size: var(--text-control);
}
.setting-row + .setting-row {
	border-top: 1px solid var(--line);
}
.setting-row > span:first-child {
	flex: 1;
	min-width: 0;
}
.setting-row small {
	display: block;
	font-size: var(--text-caption);
	color: var(--muted);
}
.setting-row small.setting-example {
	margin-top: var(--space-3);
	line-height: 1.4;
}
.setting-side {
	display: flex;
	align-items: center;
	gap: var(--space-10);
	font-size: var(--text-meta);
	color: var(--muted);
}
.setting-row .text-link {
	padding: 0;
}
kbd {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 24px;
	height: 24px;
	padding: 0 var(--space-6);
	border-radius: 6px;
	background: var(--surface);
	font: 500 12px var(--rounded);
	color: var(--ink);
}

/* Search owns its page; the home feed keeps its own state underneath. */
body:has(dialog.search[open]) #feed-grid {
	visibility: hidden;
}
:is(#modal, #search-background).search {
	position: fixed;
	inset: 0;
	width: 100%;
	max-width: none;
	height: 100dvh;
	max-height: none;
	margin: 0;
	padding: calc(var(--space-16) + env(safe-area-inset-top)) var(--margin-lg)
		calc(var(--rail-bottom) + var(--rail-row) + var(--space-16) + var(--kb, 0px));
	background: var(--canvas);
	z-index: 40;
	display: none;
}
:is(#modal, #search-background).search[open] {
	display: flex;
	flex-direction: column;
	gap: var(--space-12);
}
/* Same top row as home and AI (ADR 0048). The results page has no top row. */
.search-page-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	flex: none;
	min-height: var(--space-60);
}
.search-page-heading h1 {
	margin: 0;
	font-size: var(--text-figure);
	font-weight: 700;
	letter-spacing: -0.04em;
	line-height: 1.2;
}
.search-account {
	width: var(--hit-target);
	height: var(--hit-target);
}
.search-account .icon {
	box-sizing: content-box;
	padding: var(--space-8);
	border-radius: 50%;
	background: var(--surface);
}
.search:not(:has(.search-browse)) .search-page-heading {
	display: none;
}
:is(#modal, #search-background).page.search {
	background: var(--card);
}
.search-browse {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: var(--space-12);
}
.search-category {
	position: relative;
	aspect-ratio: 16 / 10;
	overflow: hidden;
	border-radius: var(--control-radius);
	text-align: left;
	background: var(--surface);
}
.search-category img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}
.search-category span {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: flex-end;
	padding: var(--space-12);
	font-size: var(--text-input);
	font-weight: 600;
	color: var(--fixed-white);
	background: var(--fixed-black-18);
	text-shadow: 0 1px 3px var(--fixed-black-55);
}
.search-category:active {
	opacity: 0.75;
}
.search-card-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col-ideal)), 1fr));
	align-items: start;
	gap: var(--gap);
}
.search-card-grid .feed-card {
	position: relative;
	width: auto;
	transform: none;
}
.search-header {
	position: relative;
	display: flex;
	align-items: center;
	gap: var(--space-8);
	flex: none;
}
.search-tokens {
	display: flex;
	flex: none;
	gap: var(--space-6);
	max-width: 60%;
	overflow-x: auto;
	scrollbar-width: none;
}
.search-token {
	flex: none;
	height: 28px;
	padding: 0 var(--space-10);
	border-radius: var(--pill-radius);
	background: var(--ink);
	color: var(--card);
	font-size: var(--text-body);
	font-weight: 600;
	white-space: nowrap;
}
.search-token.is-hash {
	background: var(--accent);
	color: var(--fixed-white);
}
/* The # list floats over the results instead of pushing them down. */
.search-hash-slot:empty {
	display: none;
}
.search-hash {
	position: absolute;
	z-index: 5;
	top: calc(100% + var(--space-8));
	left: 0;
	right: calc(var(--hit-target) + var(--space-8));
	max-height: 50vh;
	overflow-y: auto;
	padding: var(--space-6);
	border-radius: var(--control-radius);
	background: var(--card);
	box-shadow: var(--shadow-float);
}
.search-hash-label {
	padding: var(--space-8) var(--space-10) var(--space-4);
	font-size: var(--text-caption);
	font-weight: 600;
	color: var(--muted);
}
.search-hash-option {
	display: flex;
	align-items: center;
	width: 100%;
	min-height: 40px;
	padding: 0 var(--space-10);
	border-radius: var(--space-10);
	font-size: var(--text-body);
	text-align: left;
}
.search-hash-option:first-of-type,
.search-hash-option:focus-visible {
	background: var(--faint);
}
.search-header .search-pill {
	flex: 1;
	min-width: 0;
}
.search-header > .icon-button {
	flex: none;
}
.search-pill {
	display: flex;
	align-items: center;
	gap: var(--space-8);
	height: var(--space-44);
	padding: 0 var(--space-10) 0 var(--space-12);
	border-radius: var(--pill-radius);
	background: var(--surface);
}
.search-pill > .icon {
	color: var(--ink);
	stroke-width: 2;
}
.search-pill input {
	flex: 1;
	min-width: 0;
	height: 100%;
	padding: 0;
	border: 0;
	background: transparent;
	font-size: var(--text-input);
	border-radius: 0;
}
.search-pill input:focus-visible {
	outline: 0;
}
.search-count {
	font-size: var(--text-meta);
	color: var(--secondary);
	white-space: nowrap;
}
.search-pill .icon-button {
	width: 32px;
	height: 32px;
	min-width: 32px;
	color: var(--secondary);
}
.search-chips {
	display: flex;
	flex: none;
	flex-direction: column;
	align-items: stretch;
	gap: var(--space-8);
	padding-bottom: var(--space-4);
}
.search:has(.search-browse) .search-header > .icon-button {
	display: none;
}
.search:has(.search-browse) .search-header:focus-within > .icon-button {
	display: grid;
}
.search-clear[hidden] {
	display: none;
}
.search-pill:has(.search-clear:not([hidden])) .search-dictate {
	display: none;
}
.search-pill .search-dictate:disabled {
	opacity: 1;
	color: var(--ink);
}
.search-filter-items {
	display: flex;
	border: 0;
	margin: 0;
	gap: var(--space-8);
	min-width: 0;
	overflow-x: auto;
	scrollbar-width: none;
	padding: var(--space-2);
}
.search-filter-items::-webkit-scrollbar {
	display: none;
}
.search-filter-items .chip {
	flex: none;
}
.search-chips .divider {
	width: 1px;
	height: 20px;
	align-self: center;
	background: var(--line-hover);
	margin: 0 var(--space-4);
}
.search-results {
	flex: 1;
	min-height: 0;
	overflow-y: auto;
	overscroll-behavior: contain;
	padding: var(--space-2) var(--space-2) var(--space-24);
	scrollbar-width: none;
}
.search-empty {
	text-align: center;
	font-size: var(--text-body);
	color: var(--muted);
	padding: var(--space-24) 0;
}

/* Pages share the application frame; cards still open in the existing dialog. */
@media (min-width: 651px) {
	#modal.page.panel {
		position: fixed;
		inset: 0;
		z-index: 40;
		width: 100%;
		max-width: none;
		height: 100dvh;
		max-height: none;
		margin: 0;
		background: var(--canvas);
	}
	#modal.page.panel .sheet {
		height: 100%;
		max-height: none;
		width: min(100%, 1040px);
		margin-inline: auto;
		border-radius: 0;
		box-shadow: none;
		background: var(--canvas);
		display: flex;
		flex-direction: column;
		padding-bottom: 0;
	}
	#modal.page .settings-layout {
		flex: 1;
		min-height: 0;
	}
	#modal.page .settings-main {
		max-height: none;
	}
	#modal.page.panel .ai-conversation {
		max-width: 720px;
		padding: var(--space-24) var(--space-24)
			calc(var(--rail-bottom) + var(--rail-row) + var(--space-16));
	}
	#modal.page.panel .ai-conversation > .sheet-close {
		display: none;
	}
	:is(#modal, #search-background).page.search {
		padding-inline: max(var(--margin-lg), calc((100vw - 1040px) / 2));
	}
	.search-browse {
		grid-template-columns: repeat(3, minmax(0, 1fr));
	}
}
.settings-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	min-height: var(--space-60);
	padding: var(--space-16) var(--space-32) 0;
	flex: none;
}
.settings-head h1 {
	margin: 0;
	font-size: var(--text-figure);
	line-height: 1.2;
	letter-spacing: -0.025em;
}
.settings-head .sheet-close {
	position: static;
}
.settings-head .sheet-close .icon-button {
	background: var(--faint);
	box-shadow: none;
	width: var(--hit-target);
	height: var(--hit-target);
}
/* Type chips: the same pill as the home tabs; on search the idle ones are surface without a rim. */
.search-chips .chip {
	min-height: var(--space-32);
	height: var(--space-32);
	background: var(--surface);
	box-shadow: none;
	font-size: var(--text-control);
}
.search-chips .chip.active {
	background: var(--ink);
	color: var(--card);
	font-weight: 600;
}
.search-chips[hidden] {
	display: none;
}

/* @design settings-sheet: group changes never resize the desktop frame. */
@media (min-width: 651px) {
	#modal.panel:not(.page) .settings-sheet {
		display: flex;
		flex-direction: column;
		height: min(
			calc(var(--settings-body-height) + var(--space-60) + var(--space-16)),
			calc(100dvh - var(--space-32))
		);
		overflow: hidden;
	}
	#modal.panel:not(.page) .settings-head {
		min-height: calc(var(--space-60) + var(--space-16));
	}
	#modal.panel:not(.page) .settings-layout {
		flex: 1;
		min-height: 0;
		grid-template-rows: minmax(0, 1fr);
	}
	#modal.panel:not(.page) :is(.settings-nav, .settings-main) {
		min-height: 0;
		max-height: none;
		overflow-y: auto;
	}
	#modal.panel:not(.page) .settings-nav button {
		flex-shrink: 0;
	}
	#modal.panel:not(.page) .settings-main h2 {
		line-height: var(--space-32);
	}
}

/* More menu, popovers. */
.card-more-menu,
.card-more-leaving {
	position: absolute;
	right: 8px;
	top: 48px;
	transform-origin: top right;
	display: flex;
	flex-direction: column;
	width: min(220px, calc(100% - 16px));
	padding: var(--space-6);
	border-radius: 16px;
	z-index: 5;
	/* The menu sits over the card's own text, so it is solid, not glass. */
	background: var(--card);
	border: 1px solid var(--line);
	box-shadow: var(--shadow-glass);
}
.card-menu-item {
	display: flex;
	align-items: center;
	gap: var(--space-12);
	min-height: 44px;
	width: 100%;
	padding: 0 var(--space-12);
	border-radius: var(--control-radius);
	text-align: left;
	font-size: var(--text-control);
	color: var(--ink);
}
.card-menu-item .icon {
	flex: none;
}
@media (hover: hover) and (pointer: fine) {
	.card-menu-item:hover {
		background: var(--fixed-black-5);
	}
}
.card-menu-item:active,
.card-menu-item:focus-visible {
	background: var(--fixed-black-5);
}
.why-actions {
	display: flex;
	gap: var(--space-16);
	margin-top: var(--space-4);
}

/* Tags and notes. */
.tag-editor {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--space-6);
	padding-bottom: var(--space-12);
	border-bottom: 1px solid var(--line);
}
.tag-editor input {
	flex: 1;
	min-width: 120px;
	height: 32px;
	padding: 0 var(--space-6);
	border: 0;
	background: transparent;
	font-size: var(--text-meta);
}
.editor-note {
	width: 100%;
	min-height: 120px;
	margin-top: var(--space-12);
	padding: var(--space-4) 0;
	border: 0;
	background: transparent;
	font-size: var(--text-body);
	line-height: 1.7;
	resize: none;
	border-radius: 0;
}
.editor-note:focus-visible,
.tag-editor input:focus-visible {
	outline: 0;
}
.chip-suggest {
	display: flex;
	flex-wrap: wrap;
	gap: var(--space-6);
	margin-top: var(--space-8);
}

/* First run: an empty sill, one sentence, one button. */
.welcome {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
	gap: var(--space-10);
	min-height: 70dvh;
}
.welcome h1 {
	font-size: var(--text-detail-title);
	letter-spacing: -0.02em;
	margin-top: var(--space-10);
}
.welcome p {
	font-size: var(--text-body);
	color: var(--muted);
}
.welcome-actions {
	display: flex;
	gap: var(--space-12);
	margin-top: var(--space-18);
	align-items: center;
}

.chip.pick {
	min-height: 40px;
	padding: 0 var(--space-16);
	font-size: var(--text-control);
	box-shadow: none;
	border: 1px solid var(--line-card);
}
.chip.pick.active {
	border-color: var(--accent);
}
.permission {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--space-8);
	text-align: center;
	padding: var(--space-32) var(--space-28) var(--space-24);
}
.permission .row-icon {
	display: grid;
	place-items: center;
	width: 48px;
	height: 48px;
	border-radius: 14px;
	background: var(--accent-soft);
	color: var(--accent);
}
.permission h1 {
	margin: var(--space-6) 0 0;
	font-size: 19px;
}
.permission-actions {
	display: flex;
	gap: var(--space-10);
	width: 100%;
	margin-top: var(--space-16);
}
.permission-actions > * {
	flex: 1;
}

/* Capture: write one line, or paste a link. */
.capture-field {
	display: flex;
	align-items: flex-start;
	gap: var(--space-10);
	padding: var(--space-4) 0;
}
.capture-field > .icon {
	margin-top: var(--space-12);
	color: var(--secondary);
}
.capture-field textarea {
	flex: 1;
	min-height: 96px;
	border: 0;
	background: transparent;
	padding: var(--space-10) 0;
	font-size: 16px;
	line-height: 1.6;
	resize: none;
	border-radius: 0;
}
.capture-field textarea:focus-visible {
	outline: 0;
}
.next-event {
	display: flex;
	align-items: center;
	gap: var(--space-12);
	padding: var(--space-12) var(--space-14);
	border-radius: 14px;
	background: var(--surface);
	margin-top: var(--space-8);
}
.next-event .num {
	font-size: 20px;
	font-weight: 600;
}
.next-event span {
	flex: 1;
	display: flex;
	flex-direction: column;
	font-size: var(--text-control);
	font-weight: 500;
}
.next-event small {
	color: var(--accent);
	font-weight: 400;
	font-size: var(--text-caption);
}

/* Inline note editing: the card itself becomes the field. */
.feed-card.is-editing {
	border: 2px solid var(--accent);
	cursor: text;
	z-index: 7;
}
.inline-editor {
	display: flex;
	flex-direction: column;
	gap: var(--space-6);
	padding: var(--space-14) var(--space-16) var(--space-12);
}
.inline-editor input {
	border: 0;
	background: transparent;
	padding: 0;
	font-size: 16px;
	font-weight: 600;
	border-radius: 0;
}
.inline-editor textarea {
	border: 0;
	background: transparent;
	padding: 0;
	min-height: 96px;
	font-size: var(--text-body);
	line-height: 1.6;
	resize: none;
	border-radius: 0;
}
.inline-editor input:focus-visible,
.inline-editor textarea:focus-visible {
	outline: 0;
}
.inline-editor small {
	align-self: flex-end;
	font-size: var(--text-caption);
	color: var(--secondary);
}

/* Lifting never drops into an action. The separate dialog requires a button press. */
.selection-lift {
	position: fixed;
	z-index: 200;
	pointer-events: none;
}
.selection-stack {
	position: relative;
	width: 176px;
	height: var(--stack-h, 140px);
	isolation: isolate;
	flex: none;
}
/* Real cards, fanned like a pile of photos: the first one chosen on top. */
.selection-stack-face {
	position: absolute;
	inset: 0;
	background: var(--card);
	color: var(--ink);
	border-radius: 16px;
	box-shadow:
		0 0 0 0.5px var(--line-card),
		0 1px 2px var(--fixed-black-6),
		0 10px 28px var(--fixed-black-14);
	overflow: hidden;
}
.selection-stack-face[data-layer="1"] {
	transform: translate(14px, -6px) rotate(6deg) scale(0.95);
}
.selection-stack-face[data-layer="2"] {
	transform: translate(-14px, -2px) rotate(-6deg) scale(0.92);
}
.selection-stack-face > .feed-card {
	opacity: 1;
	border: 0;
	box-shadow: none;
}
.selection-thumbnail-fallback {
	padding: var(--space-14);
	font-size: var(--text-meta);
}
.selection-stack-count {
	position: absolute;
	top: -10px;
	right: -10px;
	z-index: 4;
	min-width: 28px;
	height: 28px;
	padding-inline: var(--space-8);
	border-radius: var(--pill-radius);
	background: var(--accent-fill);
	color: var(--fixed-white);
	display: grid;
	place-items: center;
	font-size: var(--text-control);
	font-weight: 600;
	box-shadow:
		0 0 0 2px var(--card),
		0 2px 6px var(--fixed-black-18);
}
.selection-lift .selection-stack {
	transform: scale(1.03) rotate(-1deg);
}
body.is-carrying,
body.is-dragging {
	cursor: grabbing;
	user-select: none;
	-webkit-user-select: none;
}
body.is-dragging .card-actions,
body.is-dragging #dock,
body.is-dragging .scroll-edge {
	visibility: hidden;
}
body.selection-menu-open {
	overflow: hidden;
}
#selection-menu {
	position: fixed;
	inset: 0;
	margin: 0;
	padding: 0;
	border: 0;
	background: transparent;
	color: var(--ink);
	overflow: auto;
	width: 100%;
	height: 100%;
	max-width: 100vw;
	max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
	box-shadow: none;
	scrollbar-width: none;
}
#selection-menu::backdrop {
	background: var(--frost);
	backdrop-filter: blur(28px) saturate(1.6);
	-webkit-backdrop-filter: blur(28px) saturate(1.6);
}
.selection-context {
	position: absolute;
	width: 260px;
	max-height: calc(100dvh - 32px);
	overflow-y: auto;
	padding: var(--space-20) var(--space-10) var(--space-12);
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--space-14);
	scrollbar-width: none;
}
/* A compact menu: words first, a matching icon at the end, as in a system context menu. */
.selection-options {
	flex-shrink: 0;
	width: 240px;
	background: var(--glass-thick);
	-webkit-backdrop-filter: var(--glass-filter);
	backdrop-filter: var(--glass-filter);
	border-radius: 16px;
	overflow: hidden;
	box-shadow:
		inset 0 0 0 0.5px var(--glass-edge),
		0 0 0 0.5px var(--glass-rim),
		0 12px 36px var(--fixed-black-16);
}
.selection-options [role="group"] + [role="group"] {
	border-top: 6px solid var(--glass-press);
}
.selection-options button {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--space-12);
	width: 100%;
	min-height: 44px;
	padding: var(--space-11) var(--space-16);
	border: 0;
	border-radius: 0;
	background: transparent;
	color: var(--ink);
	font: inherit;
	font-size: var(--text-body);
	text-align: start;
}
.selection-options button .icon {
	color: var(--ink);
	flex: none;
}
.selection-options button + button {
	border-top: 0.5px solid var(--line-hover);
}
@media (hover: hover) and (pointer: fine) {
	.selection-options button:hover {
		background: var(--glass-press);
	}
}
.selection-options button:focus-visible {
	background: var(--glass-press);
}
.selection-options button:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -4px;
}
.selection-context > .selection-stack {
	flex-shrink: 0;
}

[tabindex="-1"]:focus {
	outline: none;
}
input[type="search"]::-webkit-search-cancel-button {
	-webkit-appearance: none;
	display: none;
}

/* Gestures: sheets and pages follow the finger; the dim follows them. */
.pull-ring {
	position: fixed;
	left: 50%;
	top: env(safe-area-inset-top, 0px);
	z-index: 50;
	width: 36px;
	height: 36px;
	margin-left: calc(-1 * var(--space-18));
	border-radius: 50%;
	display: grid;
	place-items: center;
	opacity: 0;
	pointer-events: none;
	color: var(--accent);
}
.home-heading.has-refresh .home-mark {
	visibility: hidden;
}
/* Under a finger the desk follows exactly; the glide is only for letting go. */
body.is-pulling main {
	will-change: translate;
}
.pull-ring svg {
	width: 24px;
	height: 24px;
	transform: rotate(-90deg);
}
.pull-ring circle {
	transform-origin: center;
	fill: none;
	stroke: currentColor;
	stroke-width: 2.4;
	stroke-linecap: round;
	stroke-dasharray: 100;
	stroke-dashoffset: 100;
}
/* Gesture progress is inline; spinning holds one fixed arc while the request is pending. */
.pull-ring.is-spinning circle {
	stroke-dashoffset: 30 !important;
}
/* One icon owns each phase. Text remains in accessible labels only. */
.pull-ring:disabled {
	cursor: default;
}
.pull-ring > svg {
	grid-area: 1 / 1;
}
.pull-ring .pull-check,
.pull-ring .pull-retry {
	opacity: 0;
	transform: none;
	fill: none;
	stroke: currentColor;
	stroke-width: 2;
	stroke-linecap: round;
	stroke-linejoin: round;
}
.pull-ring[data-state="success"] .pull-progress,
.pull-ring[data-state="error"] .pull-progress {
	opacity: 0;
}
.pull-ring[data-state="success"] .pull-check,
.pull-ring[data-state="error"] .pull-retry {
	opacity: 1;
}
.pull-ring[data-state="error"] {
	pointer-events: auto;
}
.pull-ring:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 4px;
}
/* Read end: nothing at the end itself. Pushing on raises a small ring that fills with the push; full, it turns into a check. */
.reader-end {
	height: 24px;
}
.push-ring {
	position: absolute;
	left: 50%;
	bottom: 24px;
	z-index: 6;
	width: 40px;
	height: 40px;
	margin-left: calc(-1 * var(--space-20));
	border-radius: 20px;
	display: grid;
	place-items: center;
	background: var(--card);
	box-shadow: var(--shadow-glass);
	color: var(--accent);
	pointer-events: none;
	opacity: 0;
	transform: scale(0.6);
}
.push-ring > * {
	grid-area: 1 / 1;
}
.push-ring svg.arc {
	width: 22px;
	height: 22px;
	transform: rotate(-90deg);
}
.push-ring .arc circle {
	fill: none;
	stroke: currentColor;
	stroke-width: 2.2;
	stroke-linecap: round;
}
.push-ring .arc circle:first-child {
	stroke-opacity: 0.15;
}
.push-ring .tick {
	width: 20px;
	height: 20px;
	opacity: 0;
	color: var(--fixed-white);
}
.push-ring.is-done {
	background: var(--accent);
}
.push-ring.is-done .arc {
	opacity: 0;
}
.push-ring.is-done .tick {
	opacity: 1;
}
/* The read-end ring rises at the very foot of the page, where the toolbar was. */
#modal.reader .push-ring {
	position: fixed;
	bottom: max(28px, calc(env(safe-area-inset-bottom) + 12px));
}
/* The sheet's own pull and push replace the browser's elastic bounce; two springs at once read as a stutter. */
.sheet-scroll,
.reader-scroll {
	overscroll-behavior-y: none;
}
.sheet-scroll::-webkit-scrollbar,
.reader-scroll::-webkit-scrollbar {
	display: none;
}
.sheet-scroll,
.reader-scroll {
	scrollbar-width: none;
	-webkit-overflow-scrolling: touch;
}
/* Motion owns gesture offsets in translate, separate from surface transforms. */
/* Nested content follows its dragged parent immediately. */

/* Panel content stays reachable at large zoom, small heights and with a keyboard open. */
#modal.panel .sheet {
	max-height: 100dvh;
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: none;
}

/* Focus stays visible but sits close to the field, in a soft ring instead of a second outline. */
.search-pill:focus-within {
	outline: 3px solid color-mix(in srgb, var(--accent) 36%, transparent);
	outline-offset: 0;
}
#modal.panel .settings-layout {
	min-height: 0;
}
/* Settings is one grouped page: the same grey ground from the head to the last row, white groups on it. */
#modal.panel.wide .sheet {
	background: var(--canvas);
}
#modal.panel.wide .settings-nav,
#modal.panel.wide .settings-main {
	background: transparent;
}

/* Reader: the same scroll edges at the top and the bottom, under the floating bars. */
.reader-edge {
	position: fixed;
	left: 0;
	right: 0;
	z-index: 4;
	pointer-events: none;
}
.reader-edge.is-bottom {
	bottom: 0;
	height: calc(var(--rail-row) + 24px + 48px + env(safe-area-inset-bottom));
	background: linear-gradient(
		to top,
		color-mix(in srgb, var(--card) 94%, transparent) 0%,
		color-mix(in srgb, var(--card) 86%, transparent) calc(var(--rail-row) + 24px),
		color-mix(in srgb, var(--card) 0%, transparent) 100%
	);
}
.reader-edge.is-top {
	top: 0;
	height: calc(var(--rail-row) + 14px + 28px + env(safe-area-inset-top));
	background: linear-gradient(
		to bottom,
		color-mix(in srgb, var(--card) 92%, transparent) 0%,
		color-mix(in srgb, var(--card) 80%, transparent) calc(var(--rail-row) + 14px),
		color-mix(in srgb, var(--card) 0%, transparent) 100%
	);
}
.reader-edge.is-tucked {
	opacity: 0;
}
/* Local AI conversation preview: no messages or connected send action. */
#modal.panel.narrow:has(.ai-conversation) {
	width: 100%;
}
.ai-conversation {
	display: flex;
	flex-direction: column;
	gap: var(--space-12);
	max-height: calc(100dvh - 32px);
}
/* Same top row as home and search (ADR 0048): title left, round controls right. */
.ai-conversation-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	min-height: var(--space-60);
	flex: none;
}
.ai-conversation h1 {
	margin: 0;
	font-size: var(--text-figure);
	font-weight: 700;
	letter-spacing: -0.04em;
	line-height: 1.2;
}
.ai-head-actions {
	display: flex;
	gap: var(--space-4);
}
.ai-head-button {
	width: var(--hit-target);
	height: var(--hit-target);
}
.ai-head-button .icon {
	box-sizing: content-box;
	padding: var(--space-8);
	border-radius: 50%;
	background: var(--surface);
}
.ai-head-button:disabled {
	opacity: 0.45;
}
.ai-conversation > p {
	margin: 0;
}
.ai-context {
	flex: 1;
	min-height: 0;
	overflow-y: auto;
	overscroll-behavior: contain;
	display: flex;
	flex-direction: column;
	gap: var(--space-12);
	scrollbar-width: none;
}
.ai-context-card {
	padding: var(--card-padding);
	border: 1px solid var(--line-card);
	border-radius: var(--card-radius);
	background: var(--card);
}
.ai-context-card h3 {
	margin: 0;
	font-size: var(--text-input);
	overflow-wrap: anywhere;
}
.ai-context-card p {
	margin: var(--space-8) 0 0;
	font-size: var(--text-body);
	color: var(--muted);
	overflow-wrap: anywhere;
}
.ai-composer {
	display: flex;
	flex-direction: column;
	gap: var(--space-4);
	border: 0;
	border-radius: var(--panel-radius);
	padding: var(--space-12);
	flex: none;
	background: var(--ai-composer);
	color: var(--ai-ink);
}
.ai-composer textarea {
	width: 100%;
	min-width: 0;
	min-height: var(--space-36);
	height: var(--space-36);
	padding: var(--space-2) var(--space-4);
	resize: none;
	border: 0;
	border-radius: 0;
	background: transparent;
	color: inherit;
	font-size: var(--text-input);
	line-height: var(--space-24);
	outline: none;
}
.ai-composer-tools {
	display: flex;
	align-items: center;
	gap: var(--space-12);
}
.ai-composer-tools .icon-button {
	width: var(--space-32);
	height: var(--space-32);
	min-width: var(--space-32);
}
.ai-composer-tools .ai-attach {
	margin-right: auto;
	border-radius: var(--space-12);
	background: var(--ai-control);
}
.ai-attach .icon {
	transform: rotate(-45deg);
}
.ai-composer-tools .ai-send {
	width: var(--space-24);
	height: var(--space-24);
	min-width: var(--space-24);
	border-radius: var(--pill-radius);
	border: var(--space-2) solid var(--ai-ink);
}
.ai-speak {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: var(--space-6);
	min-width: calc(var(--space-60) + var(--space-24));
	height: var(--space-32);
	padding-inline: var(--space-12);
	border-radius: var(--pill-radius);
	background: var(--ai-ink);
	color: var(--card);
	font-size: var(--text-input);
	font-weight: 500;
}
.ai-composer-tools button:disabled {
	opacity: 1;
}
#modal.page.panel:has(.ai-conversation),
#modal.page.panel .ai-conversation {
	background: var(--card);
}
.soon-badge {
	padding: var(--space-3) var(--space-10);
	border-radius: var(--pill-radius);
	background: var(--glass-press);
	color: var(--secondary);
	font-size: var(--text-meta);
	font-weight: 600;
}
/* Settings › Add: the capture field inside a settings card. */
.settings-add {
	padding: var(--space-4) var(--space-16) var(--space-12);
}
.settings-add .panel-footer {
	margin-top: var(--space-4);
}

@media (min-width: 651px) {
	#modal.preview.is-short {
		width: min(var(--preview-short-width), calc(100vw - var(--space-48)));
	}
	#modal.preview.is-short .preview-body {
		padding-bottom: var(--space-16);
	}
	#modal.preview.is-short:has(> .float-bar) .preview-sheet .sheet-scroll {
		padding-bottom: calc(var(--rail-row) + var(--space-24));
	}
}

/* Refresh stays centered in the heading without replacing the Sill title. */
body:has(.home-top.is-tucked) .pull-ring.in-home-heading,
body:has(#modal[open]) .pull-ring.in-home-heading {
	visibility: hidden;
}

@media (min-width: 651px) {
	.pull-ring.in-home-heading {
		width: var(--space-40);
		height: var(--space-40);
		margin-left: calc(-1 * var(--space-20));
	}
	.pull-ring.in-home-heading svg {
		width: var(--space-20);
		height: var(--space-20);
	}
}

/* Sill · responsive · shared source */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
	.glass,
	.selection-options {
		background: var(--card);
		-webkit-backdrop-filter: none;
		backdrop-filter: none;
		box-shadow:
			0 0 0 1px var(--line-hover),
			var(--shadow-glass);
	}
	.nav-lens {
		--lens-highlight: var(--surface);
		background: var(--surface);
		box-shadow: inset 0 0 0 1px var(--line-hover);
	}
	:is(#modal, #search-background).search::backdrop,
	#selection-menu::backdrop {
		background: var(--canvas);
		-webkit-backdrop-filter: none;
		backdrop-filter: none;
	}
}
@media (max-width: 1000px) {
	main {
		padding: var(--space-24) var(--space-12) var(--space-140);
	}
}
/* Phone: one column, bottom sheets, thumbs-first toolbars. */

@media (max-width: 650px) {
	/* Page frame */
	html {
		scrollbar-gutter: auto;
	}
	main {
		padding: var(--space-8) var(--margin-sm) var(--space-130);
	}
	:root {
		--rail-edge: 16px;
		--rail-bottom: max(16px, env(safe-area-inset-bottom));
	}
	/* Three destinations share the same compact glass capsule. */
	:root {
		--nav-tab: 76px;
	}
	:root {
		--home-top-h: 104px;
	}
	main {
		padding-top: calc(env(safe-area-inset-top) + var(--home-top-h) + var(--space-8));
	}
	/* Phone home (ADR 0036): X-like density, still cards. Desktop keeps its own spacing. */
	.home-top {
		position: fixed;
		z-index: 44;
		top: 0;
		left: 0;
		right: 0;
		display: flex;
		flex-direction: column;
		width: auto;
		margin: 0;
		padding: env(safe-area-inset-top) var(--margin-sm) 0;
		background: color-mix(in srgb, var(--canvas) 92%, transparent);
		-webkit-backdrop-filter: blur(28px) saturate(1.6);
		backdrop-filter: blur(28px) saturate(1.6);
	}
	.home-top.is-tucked {
		transform: translateY(calc(-100% + env(safe-area-inset-top)));
		opacity: 0;
		visibility: hidden;
		pointer-events: none;
	}
	body:has(:is(#modal, #search-background)[open].page) .home-top {
		opacity: 0;
		visibility: hidden;
		pointer-events: none;
	}
	/* New content waits at the top: under the tabs, or under the status bar once they tuck away. */
	#new-count {
		top: calc(env(safe-area-inset-top) + var(--home-top-h) + 8px);
		bottom: auto;
	}
	body:has(.home-top.is-tucked) #new-count {
		top: calc(env(safe-area-inset-top) + 8px);
	}
	body:has(#dock.is-tucked) #new-count {
		opacity: 1;
		visibility: visible;
		pointer-events: auto;
	}
	/* Cards and touch targets */
	.card-more-trigger {
		opacity: 1;
		pointer-events: auto;
	}
	/* Phone: the quiet ••• sits at the bottom right, clear of the time and count in the head. */
	.card-actions,
	.has-cover .card-actions {
		top: auto;
		right: 4px;
		bottom: 4px;
	}
	.card-more-trigger,
	.has-cover .card-more-trigger {
		width: 44px;
		height: 44px;
		min-width: 44px;
		background: transparent;
		border: 0;
		box-shadow: none;
		color: var(--secondary);
	}
	.card-more-trigger .icon {
		width: 20px;
		height: 20px;
		stroke-width: 2.2;
	}
	.card-more-trigger:before {
		inset: 0;
	}
	.card-head,
	.sender,
	.card-head:has(.card-head-right),
	.has-cover .card-head {
		padding-right: 0;
	}
	.feed-card .card-head-right {
		opacity: 1;
	}
	.pill {
		min-height: 44px;
		border-radius: var(--pill-radius);
	}
	.check-item {
		min-height: 44px;
	}
	/* Cards: tighter frame, two-line summaries, no blank space kept for a more button. */
	.feed-item.feed-card {
		border-radius: var(--card-radius-sm);
	}
	.feed-item .card-body {
		padding: var(--card-padding-sm);
	}
	.feed-item .card-summary {
		-webkit-line-clamp: 2;
	}
	.feed-item .card-summary.reading-summary {
		-webkit-line-clamp: var(--summary-reading-lines);
	}
	.feed-item :is(.card-head, .sender) {
		padding-right: 0;
	}
	/* A person's head reads on one line: small portrait, name, then mail and time. */
	.feed-item .sender {
		gap: var(--space-8);
	}
	/* avatar() emits inline desktop sizes; phone sender portraits stay 20px. */
	.feed-item .sender .avatar {
		width: 20px !important;
		height: 20px !important;
		font-size: 11px;
	}
	.feed-item .sender > span:last-child {
		flex-direction: row;
		align-items: baseline;
		gap: var(--space-4);
		overflow: hidden;
		white-space: nowrap;
	}
	.feed-item .sender b {
		font-size: var(--text-meta);
	}
	.feed-item .sender small {
		font-size: var(--text-meta);
	}
	.feed-item .sender small::before {
		content: "· ";
	}
	/* Article covers remain above the card body on phones. */
	.feed-item.type-article .card-cover {
		height: 180px;
		aspect-ratio: auto;
	}
	.feed-item.type-media .card-cover {
		aspect-ratio: 16 / 9;
	}
	.feed-item .attachment {
		align-self: stretch;
		width: 100%;
		margin-top: 0;
	}
	.feed-item .ref {
		min-height: 32px;
	}
	/* Actions: a compact pill that still answers a 44px touch. */
	.feed-item .pill {
		position: relative;
		min-height: 36px;
	}
	.feed-item .pill::after {
		content: "";
		position: absolute;
		inset: -4px 0;
	}
	/* To-dos: compact rows keep the remaining-item count visible. */
	.feed-item.type-task .check-item {
		min-height: 28px;
		padding: 0;
	}
	.feed-item.type-task .check-dot {
		width: 18px;
		height: 18px;
		flex-basis: 18px;
	}
	/* Navigation and selection */

	.nav-icon {
		height: 26px;
	}
	.nav-icon > .icon {
		width: 24px;
		height: 24px;
	}
	#dock:has(#selection-bar:not([hidden])) #selection-bar {
		flex: 1;
	}
	/* Too narrow for both: while selecting, the bar takes the whole row. */
	#dock:has(#selection-bar:not([hidden])) .nav-capsule {
		display: none;
	}
	#dock #selection-bar {
		max-width: calc(100vw - 2 * var(--rail-edge));
	}
	/* Preview and bottom sheets (ADR 0037) */
	/* Content-sized bottom sheet: long content is capped, reading on expands it. */
	#modal.preview {
		position: fixed;
		inset: 0;
		margin: 0;
		width: 100%;
		max-width: 100%;
		height: 100%;
		max-height: 100%;
	}
	#modal.preview .preview-sheet {
		position: absolute;
		left: 0;
		right: 0;
		top: auto;
		bottom: 0;
		display: flex;
		flex-direction: column;
		max-height: calc(100dvh - max(64px, env(safe-area-inset-top)));
		transform: translateY(0);
	}
	#modal.preview .preview-sheet.is-full {
		max-height: 100dvh;
		transform: none;
		border-radius: 0;
	}
	#modal.preview .preview-sheet.is-off {
		transform: translateY(100%);
	}
	#modal.preview .sheet-peek {
		position: absolute;
		left: 14px;
		right: 14px;
		top: auto;
		bottom: calc(var(--preview-height, 100dvh - 64px) - 10px);
		width: auto;
		height: 24px;
		margin: 0;
	}
	#modal.preview:has(.preview-sheet:is(.is-full, .is-off)) .sheet-peek {
		opacity: 0;
		pointer-events: none;
	}
	#modal.preview .preview-sheet .sheet-scroll {
		flex: 1;
		max-height: none;
	}
	/* Half the old white: 26px from the last line to the toolbar, 8px under it (ADR 0037). */
	#modal.preview:has(> .float-bar) .preview-sheet .sheet-scroll {
		padding-bottom: calc(
			var(--rail-row) +
			var(--space-4) +
			max(var(--space-8), env(safe-area-inset-bottom))
		);
		scroll-padding-bottom: calc(
			var(--rail-row) +
			var(--space-4) +
			max(var(--space-8), env(safe-area-inset-bottom))
		);
	}
	#modal.preview .preview-sheet.is-full .sheet-scroll > .preview-body:first-child {
		padding-top: calc(var(--space-18) + env(safe-area-inset-top));
	}
	#modal.preview .preview-sheet.is-full.is-scrolled .sheet-head {
		top: env(safe-area-inset-top);
	}
	#modal.preview #modal-title,
	#modal.preview .preview-body > :is(.preview-sender, .preview-meta) {
		padding-right: var(--space-52);
	}
	#modal.preview:has(.sheet-head [data-action="reader"]) #modal-title,
	#modal.preview:has(.sheet-head [data-action="reader"])
		.preview-body
		> :is(.preview-sender, .preview-meta) {
		padding-right: var(--space-104);
	}
	#modal.preview:has(.preview-body > :is(.preview-sender, .preview-meta)) #modal-title {
		padding-right: 0;
	}
	.sheet-head {
		height: 60px;
		padding: 0 var(--space-12);
	}
	/* Fingers need the full 44px disc; desktop keeps the lighter 36px. */
	.sheet-head .icon-button {
		width: 44px;
		height: 44px;
		min-width: 44px;
	}
	.sheet-handle {
		display: flex;
		align-items: flex-start;
		justify-content: center;
		position: absolute;
		z-index: 5;
		top: 0;
		left: calc(50% - 40px);
		width: 80px;
		height: 24px;
		padding: 0;
		border: 0;
		background: transparent;
		touch-action: none;
		cursor: ns-resize;
	}
	.preview-sheet.is-full .sheet-handle {
		top: env(safe-area-inset-top);
	}
	.sheet-handle .grabber {
		position: absolute;
		left: 50%;
		top: 6px;
		margin: 0 0 0 calc(-1 * var(--space-18));
	}
	#modal.preview[open] {
		gap: 0;
	}
	.preview-sheet,
	#modal.panel .sheet {
		border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
		padding-bottom: env(safe-area-inset-bottom);
	}
	.sheet-scroll {
		max-height: 84dvh;
	}
	.grabber {
		display: block;
		width: 36px;
		height: 5px;
		border-radius: 3px;
		background: var(--faint);
		margin: var(--space-8) auto 0;
	}
	#modal.preview > .float-bar {
		position: fixed;
		left: 0;
		right: 0;
		bottom: max(8px, env(safe-area-inset-bottom));
		margin-inline: auto;
		z-index: 3;
	}
	#modal.preview:has(> .float-bar) > .preview-sheet:after {
		height: calc(var(--rail-row) + 24px + max(8px, env(safe-area-inset-bottom)));
	}
	#modal.preview .push-ring {
		bottom: max(28px, calc(env(safe-area-inset-bottom) + 12px));
	}
	.preview-body {
		padding: var(--space-18) var(--space-20) var(--space-22);
	}
	.preview-body h1,
	.preview-body .preview-title-row {
		font-size: var(--space-24);
	}
	/* Full-screen reader */
	.reader-head {
		top: max(10px, env(safe-area-inset-top));
		right: 12px;
	}
	.reader-body {
		padding: var(--space-64) var(--space-22) var(--space-150);
	}
	.reader-body h1,
	.reader-body .preview-title-row {
		font-size: 27px;
	}
	.reader-body p {
		font-size: var(--text-reader-body);
	}
	/* Settings */
	.settings-layout {
		grid-template-columns: 1fr;
		min-height: 0;
		background: var(--canvas);
	}
	.settings-nav {
		flex-direction: row;
		overflow-x: auto;
		padding: var(--space-16) var(--space-12) var(--space-12);
		border-right: 0;
		border-bottom: 0;
		scrollbar-width: none;
	}
	.settings-nav::-webkit-scrollbar {
		display: none;
	}
	.settings-nav button {
		flex: none;
	}
	.settings-main {
		padding: var(--space-20) var(--space-16);
		max-height: 70dvh;
	}
	/* The settings page fills the screen behind the capsule: its groups scroll to the bottom edge, not to a box above it. */
	#modal.page.panel.wide .sheet {
		display: flex;
		flex-direction: column;
		padding-bottom: 0;
	}
	#modal.page .settings-layout {
		display: flex;
		flex-direction: column;
		flex: 1;
		min-height: 0;
	}
	#modal.page .settings-main {
		flex: 1;
		max-height: none;
		padding-bottom: calc(var(--rail-bottom) + var(--rail-row) + var(--space-24));
	}
	/* Search */
	/* Phone search starts below the top safe area. Only results shrink for the keyboard. */
	:is(#modal, #search-background).search {
		position: fixed;
		inset: 0;
		width: 100%;
		max-width: 100%;
		height: 100dvh;
		max-height: none;
		margin: 0;
		padding: calc(var(--space-16) + env(safe-area-inset-top)) var(--rail-edge)
			calc(var(--rail-bottom) + var(--rail-row) + var(--space-16) + var(--kb, 0px));
		justify-content: flex-start;
		gap: var(--space-10);
	}
	:is(#modal, #search-background).search .search-results {
		flex: 1;
		min-height: 0;
		max-height: none;
	}
	:is(#modal, #search-background).search .search-chips {
		flex: none;
	}
	:is(#modal, #search-background).page.search {
		height: 100dvh;
		max-height: none;
		inset: 0;
		/* The top row sits right under the safe area, like home and AI (ADR 0048). */
		padding: env(safe-area-inset-top) var(--margin-sm)
			calc(var(--rail-bottom) + var(--rail-row) + var(--space-16) + var(--kb, 0px));
		gap: var(--space-16);
	}
	/* Keyboard, pages and photos */
	#modal.panel,
	#modal.panel.narrow,
	#modal.panel.wide {
		position: fixed;
		inset: auto 0 0;
		margin: 0;
		width: 100%;
		max-width: 100%;
	}
	.panel-content {
		padding: var(--space-22) var(--space-20) var(--space-26);
	}
	/* Sheets that take typing sit above the keyboard; the rail steps away while it is up. */
	#modal.panel,
	#modal.panel.narrow,
	#modal.panel.wide {
		bottom: var(--kb, 0px);
	}
	#modal.panel .sheet {
		max-height: calc(100dvh - var(--kb, 0px));
	}
	body.keyboard-open #dock,
	body.keyboard-open .scroll-edge {
		opacity: 0;
		visibility: hidden;
	}
	/* All three destinations are pages. The keyboard temporarily clears the capsule. */
	#modal.page,
	#modal.page.panel,
	#modal.page.panel.wide,
	#modal.page.panel.narrow {
		position: fixed;
		inset: 0 0 var(--kb, 0px);
		z-index: 40;
		width: 100%;
		max-width: 100%;
		height: auto;
		max-height: none;
		margin: 0;
		border: 0;
		padding: 0;
		background: var(--canvas);
	}
	#modal.page .grabber {
		display: none;
	}
	#modal.page.panel .sheet {
		height: 100%;
		max-height: none;
		border-radius: 0;
		box-shadow: none;
		background: var(--canvas);
		padding: calc(var(--space-12) + env(safe-area-inset-top)) 0
			calc(var(--rail-bottom) + var(--rail-row) + var(--space-24));
	}
	/* The local AI preview keeps context and composer in one viewport. */
	#modal.page.panel.narrow:has(.ai-conversation) {
		width: 100%;
	}
	#modal.page.panel .ai-conversation {
		padding: env(safe-area-inset-top) var(--space-12)
			calc(var(--rail-bottom) + var(--rail-row) + var(--space-12));
		background: var(--card);
	}
	.lightbox-stage > .icon-button {
		display: none;
	}
	#modal.page .settings-head {
		padding: 0 var(--margin-sm);
	}
	#modal.page.panel .ai-conversation > .sheet-close {
		display: none;
	}
	/* Title and round controls line up with the home and search top rows (16px margin). */
	#modal.page.panel .ai-conversation-head {
		padding: 0 var(--space-4);
	}
	/* The results page has no top row: its search bar keeps a small gap under the safe area. */
	:is(#modal, #search-background).page.search:not(:has(.search-browse)) {
		padding-top: calc(env(safe-area-inset-top) + var(--space-8));
	}
	body.keyboard-open #modal.page.panel .ai-conversation {
		padding-bottom: var(--space-12);
	}
	body.keyboard-open :is(#modal, #search-background).page.search {
		padding-bottom: calc(var(--space-16) + var(--kb, 0px));
	}
	.search-card-grid {
		gap: var(--gap-sm);
	}
}

@media (max-width: 650px) {
	.feed-item:is(.type-article, .type-mail) .card-summary {
		-webkit-line-clamp: 4;
	}
	.feed-item:is(.type-note, .type-digest) .card-summary {
		-webkit-line-clamp: 2;
	}
	.feed-item.type-suggestion .card-summary {
		-webkit-line-clamp: 1;
	}
	.feed-item .sender > span {
		display: flex;
		flex-direction: column;
		align-items: start;
	}
	.feed-item .sender small::before {
		content: none;
	}
}

@media (max-width: 650px) {
	.mail-attachments .attachment {
		width: auto;
	}
	.mail-attachments .attachment-third,
	.attachment-more-desktop {
		display: none;
	}
	.attachment-more-phone {
		display: inline;
		font-size: var(--text-meta);
		color: var(--secondary);
	}
}

@media (hover: none) {
	.card-more-trigger {
		opacity: 1;
		pointer-events: auto;
	}
	.feed-card .card-head-right {
		opacity: 1;
	}
}
/* Tablets keep the ••• at the top right, so the head leaves room for it. */
@media (hover: none) and (min-width: 651px) {
	.card-head:has(.card-head-right) {
		padding-right: var(--space-36);
	}
}
@media (hover: hover) and (pointer: fine) {
	body:not(.is-dragging) .feed-card.feed-item:hover {
		transform: translateY(-2px);
	}
}

/* The local AI window can return to the search that supplied its context. */
#modal.page .ai-conversation .sheet-close {
	display: block;
}

/* Safari focus zoom also affects touch devices with a trackpad attached. */
@media (any-pointer: coarse) {
	input,
	textarea,
	select,
	.tag-editor input,
	.editor-note,
	.inline-editor textarea,
	.ai-composer textarea {
		font-size: max(16px, var(--text-control));
	}
}
