<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>卡片操作 · 适用类型示例</title><script src="./support.js"></script></head><body><x-dc><helmet><style>body{margin:0}.board{box-sizing:border-box;width:1440px;padding:52px;background:#f5f5f7;color:#1d1d1f;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}h1{font-size:34px;line-height:1.3;margin:0 0 16px}h2{font-size:23px;margin:32px 0 18px}p{color:#636366;max-width:1200px;margin:0 0 12px}.groups{display:flex;gap:32px}.groups figure{width:358px}.phones{display:grid;grid-template-columns:repeat(4,300px);gap:24px}.desktop{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}figure{margin:0}img{width:100%;display:block;border-radius:18px}figcaption{font-size:13px;color:#636366;margin-top:8px}</style></helmet><main class="board"><h1>卡片操作 · 名称下方加适用类型示例</h1><p>用户选择 B，见 ADR 0042。不采用 A 无说明或 C 将示例挤到开关左侧。只用原有 small / muted；名称、开关顺序、状态和隐藏偏好不变。</p><p>全部截图来自真实实现与合成卡片，没有临时样式。示例由统一文案文件提供，并通过 aria-describedby 关联开关；不把示例并入名称，也不承诺所有卡片状态下都出现该动作。</p><h2>设置分组 · 实际页面局部</h2><div class="groups"><figure><img src="card-actions/390-light-group.jpg" alt="浅色 · 九条说明与开关"><figcaption>浅色 · 九条说明与开关</figcaption></figure><figure><img src="card-actions/390-dark-group.jpg" alt="深色 · 九条说明与开关"><figcaption>深色 · 九条说明与开关</figcaption></figure></div><h2>手机 320 / 390</h2><div class="phones"><figure><img src="card-actions/320-light.jpg" alt="320 · 浅色"><figcaption>320 · 浅色</figcaption></figure><figure><img src="card-actions/320-dark.jpg" alt="320 · 深色"><figcaption>320 · 深色</figcaption></figure><figure><img src="card-actions/390-light.jpg" alt="390 · 浅色"><figcaption>390 · 浅色</figcaption></figure><figure><img src="card-actions/390-dark.jpg" alt="390 · 深色"><figcaption>390 · 深色</figcaption></figure></div><h2>桌面 1440</h2><div class="desktop"><figure><img src="card-actions/1440-light.jpg" alt="1440 · 浅色"><figcaption>1440 · 浅色</figcaption></figure><figure><img src="card-actions/1440-dark.jpg" alt="1440 · 深色"><figcaption>1440 · 深色</figcaption></figure></div><p style="margin-top:24px">九个开关均能滚动到达；焦点和未修改的偏好保留，来源卡片不变。Mac 未改，Safari 与真机未检查。</p></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2440}}'>class Component extends DCLogic{renderVals(){return {};}}</script></body></html>
