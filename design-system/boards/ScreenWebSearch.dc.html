<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页 · 在未读里搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cv-arch{background:url(screens/architecture.jpg) center/cover}
.cv-coast{background:url(screens/coast.jpg) center/cover}
.cv-mtn{background:url(screens/mountain.jpg) center/cover}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased">
  <header style="height: 60px; margin: 12px 126px 0; display: flex; align-items: center; gap: 8px">
    <button type="button" aria-label="回到顶部" style="display: flex; align-items: center; gap: 10px">
      <img src="screens/sill-icon.svg" alt="" style="width: 40px; height: 40px; border-radius: 9px; box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.08)">
      <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 40px">Sill</span>
    </button>
    <button type="button" aria-label="分栏" aria-expanded="false" style="width: 36px; height: 36px; display: grid; place-items: center; color: #636366; border-radius: 10px; margin-left: -6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <span style="flex: 1"></span>
    <label style="width: 480px; height: 40px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 3px rgba(0,102,204,.25), 0 0 0 1px #0066cc; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; color: #636366">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; flex: none"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.6-4.6"/></svg>
      <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #1d1d1f; color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; flex: none">未读</span>
      <input type="search" value="注意力" placeholder="在未读里搜索" aria-label="在未读里搜索" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 15px; color: #1d1d1f; outline: none">
      <button type="button" aria-label="清除" style="width: 28px; height: 28px; display: grid; place-items: center; flex: none"><span style="width: 18px; height: 18px; border-radius: 50%; background: #aeaeb2; color: #fff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 10px; height: 10px; stroke-width: 2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></span></button>
    </label>
    <button type="button" aria-label="设置" style="width: 44px; height: 44px; display: grid; place-items: center; margin-right: -2px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"/></svg></span></button>
  </header>
  <main style="margin: 22px 126px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start">
    <article style="background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 8px -4px rgba(0,0,0,.08)">
      <div class="cv-coast" style="height: 200px; margin: -10px -10px 14px; border-radius: 14px"></div>
      <div style="font-size: 12px; line-height: 18px; color: #636366">阅读手记 · 4 分钟阅读</div>
      <h2 style="margin: 12px 0 0; font-size: 16px; font-weight: 600; line-height: 22px; letter-spacing: -0.02em"><b style="font-weight: 800">注意力</b>，也需要一点留白</h2>
      <p style="margin: 6px 0 0; font-size: 14px; color: #636366; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">把一部分时间还给不被打断的阅读，让理解深一点。暂时放下不断涌入的信息，沿着一个问题读下去，也给自己的判断留出空间。</p>
    </article>
    <article style="background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 8px -4px rgba(0,0,0,.08)">
      <div style="font-size: 12px; line-height: 18px; color: #636366">产品随记 · 昨天</div>
      <h2 style="margin: 12px 0 0; font-size: 16px; font-weight: 600; line-height: 22px; letter-spacing: -0.02em">把通知收起来的一周</h2>
      <p style="margin: 6px 0 0; font-size: 14px; color: #636366; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">关掉提醒以后，<b style="font-weight: 700; color: #1d1d1f">注意力</b>回到了手上的事。一周下来，需要回应的消息一条也没有漏掉，反而多出几段可以完整思考的时间。</p>
    </article>
  </main>
  <div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 640px; height: 60px; border-radius: 30px; background: rgba(255,255,255,.82); backdrop-filter: blur(14px); box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 16px 40px -14px rgba(0,0,0,.3); display: flex; align-items: center; gap: 4px; padding: 0 12px">
    <button type="button" aria-label="添加" style="width: 36px; height: 36px; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <label style="flex: 1; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">问 AI</span><input type="text" placeholder="问 AI，或把卡片拖到这里" style="width: 100%; border: 0; background: transparent; font: inherit; font-size: 16px; line-height: 36px; padding-left: 4px; outline: none; color: #1d1d1f"></label>
    <button type="button" disabled aria-label="语音（未接入）" style="width: 36px; height: 36px; display: grid; place-items: center; color: #8e8e93"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="button" disabled aria-label="发送（未接入）" style="width: 36px; height: 36px; display: grid; place-items: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: #c7c7cc; color: #fff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
