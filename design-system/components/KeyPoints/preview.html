<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;min-height:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<article style="width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);overflow:hidden"><div style="display:flex;flex-direction:column;gap:var(--block-gap);padding:var(--card-padding)"><div style="display:flex;align-items:center;gap:6px;font:13px/1.4 var(--font-sans);color:var(--muted)">AI 摘要 · 来自 6 篇</div><div style="font:600 17px/1.35 var(--font-sans);letter-spacing:-.02em;color:var(--ink)">界面的安静来自分层，而不是删减</div>
<div style="display:flex;flex-direction:column;gap:4px;font:15px/1.5 var(--font-sans);color:var(--ink)">
<div style="display:flex;gap:12px;align-items:baseline"><i style="width:12px;font:600 13px var(--font-rounded);font-style:normal;color:var(--accent);text-align:right">1</i>内容在白色层，工具在玻璃层</div>
<div style="display:flex;gap:12px;align-items:baseline"><i style="width:12px;font:600 13px var(--font-rounded);font-style:normal;color:var(--accent);text-align:right">2</i>工具跟着意图出现，不常驻</div>
<div style="display:flex;gap:12px;align-items:baseline"><i style="width:12px;font:600 13px var(--font-rounded);font-style:normal;color:var(--accent);text-align:right">3</i>状态用颜色和形状，不写成字</div>
</div></div></article>
</body></html>
