<!-- @dsCard group="Settings" height=150 -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;min-height:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<div style="width:440px;background:var(--card);border-radius:var(--panel-radius);box-shadow:var(--shadow-sheet);overflow:hidden">
<div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 20px;font:15px var(--font-sans);color:var(--ink)"><span style="width:32px;height:32px;border-radius:9px;background:var(--surface)"></span><span style="display:flex;flex-direction:column">RSS<small style="font-size:12px;color:var(--secondary)">42 个订阅 · 2 分钟前</small></span><span style="margin-left:auto;display:flex;align-items:center;gap:12px"><span style="width:7px;height:7px;border-radius:4px;background:var(--success)"></span><span style="width:40px;height:24px;border-radius:12px;background:var(--toggle-on)"></span></span></div>
<div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 20px;border-top:1px solid var(--line);font:15px var(--font-sans);color:var(--ink)"><span style="width:32px;height:32px;border-radius:9px;background:var(--surface)"></span><span style="display:flex;flex-direction:column">邮件<small style="font-size:12px;color:var(--secondary)">需要重新登录</small></span><span style="margin-left:auto;display:flex;align-items:center;gap:12px"><span style="width:7px;height:7px;border-radius:4px;background:var(--alert)"></span><span style="height:30px;padding:0 12px;border-radius:15px;background:var(--surface);font:500 13px/30px var(--font-sans)">重新登录</span></span></div>
</div>
</body></html>
