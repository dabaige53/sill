<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;min-height:0;background:var(--canvas)}
.cover{position:relative;width:960px;height:300px;overflow:hidden;background:var(--canvas)}
svg{position:absolute;inset:0}
.t{rx:var(--card-radius);ry:var(--card-radius)}
.ink{fill:var(--ink)}.accent{fill:var(--accent)}.soft{fill:var(--accent-soft)}.faint{fill:var(--faint)}.card{fill:var(--card)}
.glass{fill:var(--glass)}
.hair{fill:none;stroke:var(--line);stroke-width:1}
.name{position:absolute;left:48px;bottom:40px;max-width:440px}
.name h1{margin:0;font-family:var(--font-sans);font-size:104px;line-height:.95;font-weight:600;letter-spacing:-.035em;color:var(--ink)}
.name p{margin:16px 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--muted)}
</style></head>
<body>
<div class="cover">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!--
 blocks: ink 136×180, accent 136×172, accent-soft 136×100 + 136×120, faint 136×140 — tiles cut with card-radius (20px)
 arrangement: a staggered three-column masonry right of x=504, columns 24px apart (gap) and bleeding off top and bottom, like the feed itself
 pattern: literal motif — two glass discs (56px orb, 44px hit-target) floating over the tiles: "translucency belongs to the floating tools, not the content surface"
 steps and radii: gap 24, hit-target 44, card-radius 20, orb 56
-->
<rect class="t ink"    x="504" y="-24" width="136" height="180"/>
<rect class="t faint"  x="504" y="180" width="136" height="140"/>
<rect class="t soft"   x="664" y="24"  width="136" height="100"/>
<rect class="t accent" x="664" y="148" width="136" height="172"/>
<rect class="t faint"  x="824" y="-24" width="160" height="96"/>
<rect class="t soft"   x="824" y="96"  width="160" height="120"/>
<rect class="t ink"    x="824" y="240" width="160" height="84"/>
<circle class="glass" cx="640" cy="148" r="28"/>
<circle class="hair"  cx="640" cy="148" r="28"/>
<circle class="glass" cx="824" cy="240" r="22"/>
</svg>
<div class="name"><h1>Quiet<br>Glass</h1><p>平时只有内容，操作时才有工具。</p></div>
</div>
</body></html>
