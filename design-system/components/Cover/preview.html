<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;min-height:0;background:var(--canvas)}
.cover{position:relative;width:960px;height:300px;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-soft) 64%,var(--ledge) 64%,var(--ledge-deep) 100%)}
.ledge{position:absolute;left:0;right:0;top:192px;height:6px;background:var(--card);opacity:.9}
.c{position:absolute;background:var(--card);border-radius:var(--card-radius);box-shadow:var(--shadow-hover)}
.c i{position:absolute;left:18px;height:8px;border-radius:4px;background:var(--faint)}
.c i.a{background:var(--accent)}
.c.read{background:var(--card-read);box-shadow:none}
.orb{position:absolute;width:56px;height:56px;border-radius:28px;background:var(--glass);border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow-glass)}
.name{position:absolute;left:48px;top:40px;max-width:420px}
.name h1{margin:0;font-family:var(--font-sans);font-size:104px;line-height:.95;font-weight:600;letter-spacing:-.035em;color:var(--ink)}
.name p{margin:14px 0 0;font-family:var(--font-sans);font-size:15px;line-height:1.5;color:var(--muted)}
</style></head>
<body>
<div class="cover">
<div class="name"><h1>Sill</h1><p>东西在光里，安放一会儿。</p></div>
<span class="ledge"></span>
<span class="c" style="left:540px;top:64px;width:128px;height:130px"><i class="a" style="top:22px;width:40px"></i><i style="top:40px;width:84px"></i><i style="top:56px;width:64px"></i></span>
<span class="c" style="left:688px;top:100px;width:112px;height:94px"><i style="top:22px;width:60px"></i><i style="top:40px;width:76px"></i></span>
<span class="c read" style="left:820px;top:124px;width:96px;height:70px"><i style="top:22px;width:52px"></i></span>
<span class="orb" style="left:860px;top:224px"></span>
</div>
</body></html>
