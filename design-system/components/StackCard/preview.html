<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;min-height:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<div style="position:relative;width:300px;padding-bottom:14px">
<span style="position:absolute;left:10px;right:10px;bottom:0;height:40px;border-radius:var(--card-radius);background:var(--card);border:1px solid var(--line);opacity:.6"></span>
<span style="position:absolute;left:5px;right:5px;bottom:7px;height:40px;border-radius:var(--card-radius);background:var(--card);border:1px solid var(--line)"></span>
<article style="position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);overflow:hidden"><div style="display:flex;flex-direction:column;gap:var(--block-gap);padding:var(--card-padding)"><div style="display:flex;align-items:center;gap:6px;font:13px/1.4 var(--font-sans);color:var(--muted)">少数派<span style="flex:1"></span><b style="font:600 13px var(--font-rounded);color:var(--ink)">18</b></div><div style="font:600 17px/1.35 var(--font-sans);letter-spacing:-.02em;color:var(--ink)">iPhone 18 Pro 上手</div><div style="font:15px/1.5 var(--font-sans);color:var(--muted)">还有一个效率工具的十年、本周值得读的 5 篇…</div></div></article>
</div>
</body></html>
