<!-- @dsCard group="Cards" height=300 -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;min-height:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<div style="display:flex;gap:16px;align-items:flex-start">
<article style="width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);overflow:hidden"><div style="display:flex;flex-direction:column;gap:var(--block-gap);padding:var(--card-padding)">
<div style="display:flex;align-items:center;gap:6px;font:13px/1.4 var(--font-sans);color:var(--muted)">10月12日 周一<span style="flex:1"></span><span style="color:var(--accent);font-weight:500">8 分钟后</span></div>
<div style="display:flex;align-items:flex-end;justify-content:space-between"><span style="font:600 34px/1.1 var(--font-rounded);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums">14:30</span><span style="display:flex;flex-direction:column;align-items:flex-end;font:13px/1.35 var(--font-sans);color:var(--muted)"><b style="font:500 15px/1.35 var(--font-rounded);color:var(--ink)">至 15:15</b>共 45 分钟</span></div>
<div style="font:600 17px/1.35 var(--font-sans);letter-spacing:-.02em;color:var(--ink);font-weight:500">产品讨论会</div>
<div style="padding-top:6px"><span style="display:flex;align-items:center;justify-content:center;height:40px;border-radius:var(--pill-radius);background:var(--accent);color:#fff;font:500 14px var(--font-sans)">加入</span></div>
</div></article>
<div style="display:flex;flex-direction:column;gap:6px;font:12px/1.5 var(--font-sans);color:var(--muted);padding-top:8px">
<span>来源 · 提示</span><span>时间段（主角）</span><span>标题</span><span>按钮（到点才出现）</span></div>
</div>
</body></html>
