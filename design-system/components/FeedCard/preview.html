<!-- @dsCard group="Cards" height=220 -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;min-height:0;padding:16px;background:var(--canvas);font-family:var(--font-sans)">
<div style="display:flex;gap:16px;align-items:flex-start">
<article style="width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--shadow);overflow:hidden"><div style="display:flex;flex-direction:column;gap:var(--block-gap);padding:var(--card-padding)"><div style="display:flex;align-items:center;gap:6px;font:13px/1.4 var(--font-sans);color:var(--muted)">RSS · 6 分钟</div><div style="font:600 17px/1.35 var(--font-sans);letter-spacing:-.02em;color:var(--ink)">让 AI 成为工作流的一部分</div><div style="font:15px/1.5 var(--font-sans);color:var(--muted)">不是多一个工具，而是让想法、判断和行动顺畅地连接起来。</div></div></article>
<article style="width:300px;background:var(--card-read);border:1px solid var(--line-read);border-radius:var(--card-radius);overflow:hidden"><div style="display:flex;flex-direction:column;gap:var(--block-gap);padding:var(--card-padding)"><div style="display:flex;align-items:center;gap:6px;font:13px/1.4 var(--font-sans);color:var(--muted)">速记 · 昨天</div><div style="font:600 17px/1.35 var(--font-sans);letter-spacing:-.02em;color:var(--ink);color:var(--muted)">关于「少做一步」的三个观察</div><div style="font:15px/1.5 var(--font-sans);color:var(--muted)">工具应该顺着意图出现。状态不必都写成标签。</div></div></article>
</div>
</body></html>
