<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f4f0">
<meta name="referrer" content="no-referrer">
<title>Quiet Glass · 组件实验室</title>
<style>:root{
 --canvas:#efefec;--card:#fdfdfb;--ink:#252c29;--muted:#717771;--faint:#e4e7df;
 --line:rgba(34,45,39,.09);--accent:#496656;--alert:#a96847;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 --gap:20px;--card-radius:20px;--image-radius:15px;--panel-radius:26px;
 --shadow:0 1px 2px rgba(24,38,29,.025),0 5px 16px rgba(24,38,29,.028);
 --shadow-hover:0 3px 6px rgba(24,38,29,.035),0 18px 38px rgba(24,38,29,.075);
 --glass:rgba(255,255,255,.72);--glass-thick:rgba(250,252,247,.94);
 --ease:cubic-bezier(.2,.75,.25,1);--fast:140ms;--base:220ms;--layout:320ms;
}

*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;background:radial-gradient(ellipse at 8% 0%,rgba(223,231,219,.26),transparent 45%),var(--canvas);min-height:100vh}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
button:disabled{opacity:.4;cursor:default}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,textarea,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #587e91;outline-offset:4px}
input,textarea{border:1px solid var(--line);background:rgba(20,25,29,.035);outline:0;border-radius:14px;padding:12px 14px;color:var(--ink)}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#8a8a85}
::selection{background:#dce5de;color:#242b27}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{flex:0 0 auto;vertical-align:middle;pointer-events:none}
.glass{position:relative;background:var(--glass);border:1px solid rgba(255,255,255,.94);box-shadow:inset 0 1px 0 rgba(255,255,255,.94),inset 0 -1px 1px rgba(60,66,80,.07),0 7px 22px rgba(37,45,55,.08);-webkit-backdrop-filter:blur(26px) saturate(1.15);backdrop-filter:blur(26px) saturate(1.15)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.48),transparent 35%,transparent 70%,rgba(255,255,255,.18));box-shadow:inset 1px 0 0 rgba(255,255,255,.5)}
.icon-button{width:44px;height:44px;min-width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;position:relative;transition:background var(--fast),transform var(--fast),color var(--fast)}
.icon-button:hover{background:rgba(225,232,222,.65)}
.icon-button:active{transform:scale(.93)}
.icon-button.active{background:rgba(63,83,76,.1);color:#3b6250}
.icon-button.active svg{fill:rgba(76,102,87,.14)}
main{max-width:1384px;padding:32px 36px 112px;margin:0 auto;min-height:100vh}
.feed-grid{position:relative;width:100%;min-height:80vh}
.feed-card,.lab-card{position:absolute;left:0;top:0;width:300px;background:var(--card);border-radius:var(--card-radius);border:1px solid rgba(46,61,50,.08);box-shadow:var(--shadow);transition:box-shadow var(--base),background var(--base),border-color var(--base);isolation:isolate;overflow:hidden}
.feed-card{cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.feed-card:hover,.feed-card:focus-within{box-shadow:var(--shadow-hover);border-color:rgba(75,97,82,.18)}
.feed-card:focus{outline:none}
.feed-card:focus-visible{outline:2px solid #587e91;outline-offset:4px}
.feed-card:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;pointer-events:none;transition:border-color var(--base)}
.card-image-wrap{position:relative;display:block;width:calc(100% - 12px);padding:0;margin:6px 6px 0;border-radius:var(--image-radius);overflow:hidden;background:#e8ece6;text-align:left}
.card-image{width:100%;height:204px;object-fit:cover;transition:filter 240ms,transform 500ms var(--ease)}
.card-image-wrap:focus-visible{outline-offset:-4px}
.feed-card:hover .card-image{transform:scale(1.025)}
.card-body{padding:26px}
.form-image .card-body{padding-top:22px}
h2,p{margin:0}
.feed-card h2{font-size:19px;font-weight:600;letter-spacing:-.035em;line-height:1.5;white-space:pre-line}
.card-title-button{display:block;width:100%;min-height:44px;padding:0;text-align:left;background:none;font:inherit;letter-spacing:inherit;white-space:inherit;line-height:inherit;border-radius:4px}
.feed-card p{font-size:13px;line-height:1.85;color:var(--muted);margin-top:10px;white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.01em}
.card-meta>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-meta{min-height:22px;margin-bottom:19px;padding-right:28px}
.card-meta>.icon{opacity:.75}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;line-height:1.4;margin-top:25px;min-height:22px}
.card-footer>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reading-state{display:flex;align-items:center;gap:8px;font-size:10px;color:#6b7d6d}
.progress-ring{display:inline-flex;color:#4a6551;flex:0 0 auto}
.progress-ring svg{width:100%;height:100%}
.progress-ring circle:last-child{transition:stroke-dashoffset 300ms var(--ease)}
.card-actions{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:5px;z-index:3}
.card-more-trigger{color:#859087;background:transparent;opacity:0;visibility:hidden;transition:opacity var(--fast),background var(--fast),color var(--fast)}
.feed-card:hover .card-more-trigger,.feed-card:focus-within .card-more-trigger,.feed-card.tools-open .card-more-trigger{opacity:1;visibility:visible}
.card-more-trigger:hover,.feed-card.tools-open .card-more-trigger{color:var(--ink);background:#e7ece3}
.form-image>.card-actions .card-more-trigger{background:rgba(251,253,248,.86);color:#53634f;box-shadow:0 1px 6px #22341c0c}
.card-quick-actions{display:flex;border-radius:24px;padding:1px;opacity:0;visibility:hidden;transform:translateX(8px) scale(.96);transform-origin:right;transition:opacity var(--base),transform var(--base),visibility var(--base)}
.feed-card:hover .card-quick-actions,.feed-card:focus-within .card-quick-actions,.feed-card.tools-open .card-quick-actions{opacity:1;visibility:visible;transform:translateX(0) scale(1)}
.feed-card.tools-open{overflow:visible;z-index:6}
.card-more-menu{position:absolute;right:10px;top:60px;display:flex;flex-direction:column;width:min(222px,calc(100% - 20px));border-radius:17px;padding:5px;z-index:5;background:rgba(252,253,249,.96);box-shadow:0 8px 30px #24342425,inset 0 1px 0 #fff}
.card-menu-item{position:relative;display:flex;align-items:center;gap:11px;min-height:44px;width:100%;padding:10px 12px;border-radius:11px;background:none;text-align:left;font-size:12px;line-height:1.5}
.card-menu-item:hover,.card-menu-item:focus-visible{background:#eaf0e6}
.card-menu-item>.icon{color:#6e806a}
.selected-tick{position:absolute;left:12px;top:12px;width:22px;height:22px;border-radius:50%;background:#43563e;color:white;display:none;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.8);z-index:4}
.feed-card.is-selected:after{border-color:#658373;border-width:2px}
.feed-card.is-selected .selected-tick{display:grid}
.feed-card.is-selected:not(.form-image) .top-meta{padding-left:24px}
.feed-card.is-seen:not(.is-read) .card-meta{color:#858b7f}
.feed-card.is-read{background:#f4f5f0}
.feed-card.is-read .card-image{filter:saturate(.72);opacity:.86}
.feed-card.is-read h2{color:#697368}
.feed-card.is-drag-source{opacity:.32;box-shadow:none}
.feed-card.is-featured{display:grid;grid-template-columns:43% 1fr;min-height:342px;background:#fffefb}
.is-featured>.card-image-wrap{width:calc(100% - 6px);margin:6px 0 6px 6px;min-height:330px}
.is-featured .card-image{height:100%;min-height:330px;position:absolute;inset:0}
.is-featured .card-body{display:flex;flex-direction:column;justify-content:center;padding:34px 32px}
.is-featured .top-meta{margin-bottom:25px}
.is-featured h2{font-size:29px;font-weight:550;line-height:1.45;letter-spacing:-.05em}
.is-featured p{font-size:14px;line-height:1.95;margin-top:16px;-webkit-line-clamp:3;max-width:34em}
.is-featured .card-footer{margin-top:30px}
.is-featured>.card-actions .card-more-trigger{background:transparent}
.feed-card.form-quote{background:#ecebe4;border-color:#d9ddd2}
.form-quote .card-body{padding:28px}
.form-quote .top-meta{margin-bottom:24px}
.quote-mark{color:#a0a695;margin-bottom:13px}
.form-quote h2{font-family:"Songti SC","Noto Serif CJK SC",STSong,serif;font-size:26px;line-height:1.65;letter-spacing:.015em;font-weight:500}
.form-quote p{font-size:12px;margin-top:19px}
.form-quote .card-footer{margin-top:23px}
.type-event{background:#f9faf5}
.event-meta{color:#718060}
.event-date{font-size:11px;color:#737c69;display:flex;gap:9px;margin-bottom:4px}
.event-date>span{color:#969c90}
.event-time{font-size:33px;letter-spacing:-.06em;font-weight:450;line-height:1.35;margin-top:11px;display:flex;align-items:center;gap:11px;font-variant-numeric:tabular-nums}
.event-time span{font-size:20px;font-weight:300;color:#aab19f}
.event-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:23px;padding-top:17px;border-top:1px solid #dfe5d7}
.avatars{display:flex;padding-left:0}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-left:-5px;border:2px solid #fafbf6;font-size:9px;color:#59625e;background:#dbe1da}
.avatar:first-child{margin-left:0}.avatar.a1{background:#e9ded2;color:#6a615a}.avatar.a2{background:#dce1e8;color:#616d7b}
.tiny-muted{font-size:10.5px;color:var(--muted)}
.attachment{display:flex;align-items:center;gap:10px;background:#f2f4ee;border:1px solid #e7ebe1;padding:11px 12px;border-radius:10px;margin-top:20px;font-size:11px}
.attachment span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment>.icon{color:#7d8972}
.attachment>.icon:last-child{opacity:.5}
.task-subtitle{margin-bottom:12px}
.checklist{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.check-item{display:flex;align-items:center;gap:11px;text-align:left;background:none;width:100%;min-height:44px;padding:8px 0;font-size:13px;line-height:1.55}
.check-dot{border:1.2px solid #aab6a3;display:grid;place-items:center;width:18px;height:18px;border-radius:6px;flex:0 0 18px;transition:background var(--base),border-color var(--base)}
.check-item.is-done{color:#969d90}
.check-item.is-done>span:last-child{text-decoration:line-through;text-decoration-color:#c8ccc4}
.check-item.is-done .check-dot{background:#72836a;border-color:#72836a;color:white}
.task-count{font-variant-numeric:tabular-nums;font-weight:600;color:#526748}
.task-count>span{font-weight:400;color:#98a18f}
.completed-body{display:flex;gap:13px;align-items:center;padding:24px 26px}
.completed-symbol{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#e5ebdf;color:#657b56;flex:0 0 auto}
.completed-body h2{font-size:13px;color:#7d8779;margin-top:0;padding-right:12px}
.completed-body .card-title-button{min-height:44px}
.eyebrow{color:var(--muted);font-size:11px;font-weight:400;line-height:1.6}
.type-insight{background:#e8eee3;border-color:#dce3d5}
.type-insight h2{font-size:16px;font-weight:500}
.reading-figure{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.reading-figure strong{font-size:52px;line-height:1.2;font-weight:400;letter-spacing:-.08em;font-variant-numeric:tabular-nums}
.type-insight p{font-size:10.5px;color:#6f7c66}
.quiet-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;height:60px;margin-top:19px;overflow:hidden}
.quiet-bars i{display:block;width:5px;border-radius:3px 3px 1px 1px;background:#63775a}
.type-suggestion{background:#f7f4eb;border-color:#e5e0cf}
.type-suggestion .top-meta{color:#847042}
.type-suggestion h2{font-size:21px;font-weight:550}
.linked-cards{display:flex;flex-direction:column;gap:7px;margin-top:22px}
.linked-card{display:flex;align-items:center;gap:9px;min-height:46px;padding:8px 10px;background:#fffef9;border:1px solid #e9e4d7;border-radius:11px;text-align:left;font-size:11px;color:#73715f;transition:background var(--fast),border-color var(--fast)}
.linked-card:hover{background:#fff;border-color:#cfc5ac}
.linked-card-icon{width:27px;height:29px;display:grid;place-items:center;color:#9b8d6b;background:#f2f0e6;border-radius:7px;flex-shrink:0}
.linked-card>span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.linked-card>.icon:last-child{color:#afa793}
.suggestion-footer,.reminder-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px;font-size:11px;color:#7c785f}
.suggestion-action{color:#7f754e;background:#ece6d4;border:1px solid #e2dac2}
.suggestion-action:hover{background:#e2d8bb}
.media-cover .card-image{height:212px;filter:saturate(.78)}
.play-mark{position:absolute;left:17px;bottom:17px;display:grid;place-items:center;width:44px;height:44px;background:#ffffffc2;backdrop-filter:blur(15px);border:1px solid #ffffffe0;border-radius:50%}
.play-mark svg{margin-left:2px}
.media-length{position:absolute;right:16px;bottom:25px;font-size:10px;color:white;background:#20272b69;padding:3px 9px;border-radius:12px;backdrop-filter:blur(12px)}
.type-reminder{background:#f8f3e9;border-color:#e9dfcd}
.type-reminder .card-body{padding:25px 25px 15px}
.reminder-status{display:flex;align-items:center;gap:7px;min-height:22px;font-size:11px;color:#826139;padding-right:35px;margin-bottom:14px}
.status-dot{width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:#b49661;box-shadow:0 0 0 3px #e9dcbf66}
.reminder-row{display:flex;gap:15px;align-items:center}
.reminder-copy{flex:1;min-width:0}
.reminder-icon{color:#a0875a;display:grid;place-items:center;width:43px;height:49px;border-radius:14px;background:#eee5d4;border:1px solid #e8dcc5;flex:0 0 43px}
.reminder-row h2{font-size:18px;line-height:1.5}
.reminder-row p{font-size:12px;margin-top:7px}
.reminder-footer{margin-top:17px;padding-top:10px;border-top:1px solid #e8decb;color:#7c715c}
.reminder-actions{display:flex;gap:5px}
.reminder-actions>.icon-button{color:#9b8a6d}
.reminder-actions>.reminder-complete{background:#687658;color:#fff;box-shadow:inset 0 1px 0 #ffffff20}
.reminder-actions>.reminder-complete:hover{background:#536544}
.stats-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:25px}
.stats-trio div{display:flex;flex-direction:column;border-right:1px solid var(--faint)}
.stats-trio div:last-child{border:0}
.stats-trio b{font-size:35px;font-weight:400;letter-spacing:-.06em;line-height:1.4;font-variant-numeric:tabular-nums}
.stats-trio span{font-size:10.5px;color:var(--muted);margin-top:4px}
#dock{position:fixed;right:26px;bottom:26px;z-index:45;display:flex;align-items:center;justify-content:center;width:64px;height:64px}
#orb{width:56px;height:56px;min-width:56px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(230,237,240,.48) 43%,rgba(242,239,230,.55));color:#303c42;box-shadow:inset 0 1px 1px white,inset 0 -2px 3px rgba(104,118,132,.16),0 7px 28px rgba(36,49,59,.14),0 0 0 5px rgba(255,255,255,.14);transition:transform .24s var(--ease),box-shadow .24s}
#orb .icon{width:23px;height:23px}
#orb:after{content:"";position:absolute;inset:4px;border-radius:inherit;background:radial-gradient(ellipse at 22% 12%,#fffd,transparent 50%);pointer-events:none}
#orb:hover{transform:scale(1.06)}
#orb.drop-hot{transform:scale(1.3);box-shadow:inset 0 1px 1px white,0 0 0 13px #dfe8e456,0 7px 30px #708b7d3b}
.dock-tools{position:absolute;bottom:72px;right:6px;display:flex;flex-direction:column;gap:8px;opacity:0;visibility:hidden;transform:translateY(14px) scale(.92);transform-origin:bottom;transition:all 230ms var(--ease);padding:8px 0}
.dock-tools .icon-button{background:var(--glass);box-shadow:inset 0 1px 0 #fff,0 5px 17px #29343e12;border:1px solid #ffffffe6;-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px)}
#dock.is-open .dock-tools,#dock:focus-within .dock-tools{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
#dock.filter-active:after{content:"";position:absolute;right:10px;top:7px;width:7px;height:7px;border-radius:50%;background:#5a7869;border:2px solid white;pointer-events:none}
#new-count{position:absolute;bottom:7px;right:75px;min-width:44px;height:44px;border-radius:22px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
#new-count[hidden]{display:none}
#selection-bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:43;border-radius:30px;display:flex;align-items:center;padding:4px 7px;gap:8px;max-width:calc(100vw - 110px)}
#selection-bar[hidden]{display:none}
#selection-bar .selection-count{font-size:12px;padding:0 8px;white-space:nowrap}
#selection-bar .icon-button{width:44px;min-width:44px;height:44px}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 130px);padding:10px 16px;border-radius:28px;z-index:120;display:flex;align-items:center;gap:12px;font-size:12px;box-shadow:0 8px 30px #2631361a;background:#f9faf6f0;border:1px solid white;backdrop-filter:blur(25px)}
#toast[hidden]{display:none}
#toast .icon-button{width:44px;height:44px;min-width:44px}
#toast-text{white-space:normal}
dialog{color:var(--ink);padding:0;border:1px solid #ffffffeb;border-radius:var(--panel-radius);background:#fdfdf9;box-shadow:0 2px 10px #1f332211,0 35px 120px #24302b33;max-width:calc(100vw - 40px);max-height:90vh;width:620px;overflow:hidden;outline:none}
dialog::backdrop{background:rgba(32,43,34,.16);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog[open]{animation:none}
.dialog-close{position:absolute;right:16px;top:16px;z-index:5;border-radius:50%}
.dialog-close .icon-button{background:#ffffffa8;backdrop-filter:blur(20px);border:1px solid #fff9}
.dialog-content{max-height:86vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 20px 13px}
.dialog-top .card-meta{max-width:75%;overflow:hidden;text-overflow:ellipsis}
.dialog-tools{display:flex;align-items:center;justify-content:space-between;gap:5px;border-top:1px solid var(--line);padding:9px 19px;background:#fffffff5;flex-wrap:wrap}
.dialog-tools .tools-cluster{display:flex;gap:3px}
.preview-image{height:244px;width:calc(100% - 20px);margin:0 10px;object-fit:cover;border-radius:19px}
.preview-body{padding:26px 32px 30px}
.preview-body h1{font-size:28px;font-weight:550;letter-spacing:-.04em;line-height:1.5;white-space:pre-line}
.preview-body .preview-lead{margin-top:15px;font-size:15px;color:#686e66;line-height:1.95;white-space:pre-line}
.preview-body .preview-sample{font-size:14px;line-height:1.95;color:#5d635b;margin-top:14px}
.preview-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:18px}
.preview-note{margin-top:18px;border-left:2px solid #a4b0a0;background:#f0f2ed;padding:12px 15px;font-size:13px;white-space:pre-wrap}
.detail-task-list{margin-top:20px}
.detail-task-list .check-item{font-size:14px;min-height:44px}
#modal.reader{width:790px}
.reader .dialog-content{max-height:82vh}
.reader .dialog-top{position:sticky;top:0;background:#fafaf7eb;backdrop-filter:blur(20px);z-index:3}
.reader-body{padding:28px 68px 58px}
.reader-body h1{font-size:29px;line-height:1.5;font-weight:600;letter-spacing:-.04em;margin:0 0 20px}
.reader-body p{font-size:16px;line-height:2.1;margin:0 0 23px;color:#464e45}
.reader-body .reading-caption{font-size:11px;line-height:1.7;color:var(--muted);margin-bottom:24px}

#modal.panel{width:440px;background:#f8f9f5f5}
.panel-content{padding:26px 26px 24px;max-height:82vh;overflow:auto}
.panel-content h1{font-size:20px;font-weight:550;margin:0 45px 20px 0;letter-spacing:-.03em}
.search-field{position:relative;margin-bottom:21px}
.search-field>.icon{position:absolute;left:14px;top:15px;color:#7a837b}

.field-label{display:block;font-size:11px;color:#7d847b;margin:21px 0 10px;letter-spacing:.06em}
.filter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px 3px}
.filter-kind{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;padding:0;min-height:68px;font-size:10px;color:#6c756c;border-radius:10px}
.filter-kind .kind-disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9ece580;border:1px solid #dce1d84d;transition:all 180ms}
.filter-kind.active .kind-disc{background:#343d35;color:white;border-color:#343d35}
.filter-kind:hover .kind-disc{box-shadow:0 0 0 3px #dfe5dc8c}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.tag-chip{min-height:44px;padding:6px 12px;border-radius:20px;background:#eaede7a1;color:#677060;font-size:12px;border:1px solid transparent}
.tag-chip.active{background:#3c473d;color:white;border-color:#3c473d}
.panel-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:24px;padding-top:15px;gap:12px}
.panel-footer p{font-size:11px;color:var(--muted)}
.text-button{background:transparent;min-height:44px;padding:6px 9px;font-size:12px;border-radius:12px;color:#62735e}
.text-button:hover{background:#e5eae1}
.solid-button{background:#333e34;color:#fff;border-radius:14px;padding:11px 18px;font-size:12px;min-height:44px}
.editor-note{width:100%;height:130px;min-height:100px;font-size:14px;line-height:1.8;background:#fff;margin-top:2px}
.tag-add{display:flex;align-items:center;gap:7px;margin-top:12px}
.tag-add input{width:100%;min-width:0;background:white}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:18px}
.setting-row span{font-size:13px}
.setting-row small{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.toggle{width:48px;height:44px;border-radius:16px;background:transparent;position:relative;flex-shrink:0}
.toggle:after{content:"";position:absolute;inset:9px 2px;border-radius:16px;background:#d9ded5;transition:background 150ms}
.toggle:before{content:"";position:absolute;width:22px;height:22px;left:4px;top:11px;border-radius:50%;background:white;box-shadow:0 1px 3px #20282030;transition:transform 150ms;z-index:1}
.toggle[aria-checked=true]:after{background:#687f65}
.toggle[aria-checked=true]:before{transform:translateX(18px)}
.settings-note{font-size:12px;line-height:1.9;color:#75806f;margin:17px 0 0}
.ai-panel{position:fixed;right:28px;bottom:102px;width:404px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 128px);display:flex;flex-direction:column;z-index:48;border-radius:25px;background:var(--glass-thick);border:1px solid #ffffffeb;box-shadow:0 2px 8px #2332220a,0 22px 80px #27362d2b;-webkit-backdrop-filter:blur(28px) saturate(1.12);backdrop-filter:blur(28px) saturate(1.12);overflow:hidden}

.ai-header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 15px 22px;gap:8px;flex-shrink:0}
.ai-header>div:last-child{display:flex;flex-shrink:0}
.ai-header h2{font-size:17px;font-weight:600;letter-spacing:-.03em}
.ai-header small{display:block;color:#7c8774;font-size:10px;margin-top:5px}
.ai-header small:before{content:"";width:5px;height:5px;display:inline-block;border-radius:50%;background:#9ba395;margin-right:6px;vertical-align:1px}
.ai-contexts{max-height:254px;min-height:0;overflow:auto;padding:0 16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;scrollbar-width:thin;flex-shrink:1}
.context-heading{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#6f7b66;font-size:10px;padding:2px 3px 3px;flex-shrink:0}
.context-heading>span:last-child{color:#7e8972;font-size:10px}
.context-card{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:start;padding:11px 5px 11px 11px;background:#fdfefb;border:1px solid #e0e7d8;border-radius:15px;box-shadow:0 2px 5px #26372504;flex-shrink:0}
.context-thumbnail{width:44px;height:52px;overflow:hidden;display:grid;place-items:center;border-radius:9px;background:#e9eee3;color:#7b8e70}
.context-thumbnail img{width:100%;height:100%;object-fit:cover}
.context-copy{min-width:0}
.context-meta{font-size:10px;line-height:1.5;color:#6e7b63;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;min-height:44px;text-align:left;padding:4px 0;background:none;border-radius:3px;font-size:12px;line-height:1.5;font-weight:550;letter-spacing:-.01em}
.context-title:hover{color:#557843}
.context-summary{font-size:11px;line-height:1.65;color:#737d6a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.context-remove{margin-top:-4px;color:#9da793}
.ai-empty{padding:22px 24px 24px;color:#7c8777;text-align:center}
.ai-empty .icon{margin-bottom:12px;color:#768870}

.ai-empty small{display:block;font-size:10px;margin-top:12px;color:#8a9386}
.ai-messages{padding:12px 21px;max-height:230px;min-height:0;overflow:auto;overscroll-behavior:contain;flex-shrink:1;scrollbar-width:thin}

.message{font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:14px}
.message.user{background:#e7eddf;color:#394e34;margin-left:28px;padding:11px 13px;border-radius:15px 15px 4px 15px}
.message.demo{color:#515e4b;padding:4px 3px}

.ai-compose{padding:15px 16px 16px;position:relative;flex-shrink:0}
.ai-compose textarea{width:100%;display:block;resize:none;min-height:108px;padding:13px 53px 13px 14px;background:#fffefa;line-height:1.7;font-size:13px;border:1px solid #dfe5d7;border-radius:16px;box-shadow:0 1px 2px #21301904}
.ai-compose textarea:focus{border-color:#9aac8e}
.ai-compose>.icon-button{position:absolute;right:23px;bottom:24px;background:#3f5337;color:white;width:44px;height:44px;min-width:44px;border-radius:12px;box-shadow:inset 0 1px 0 #ffffff1a,0 2px 5px #22351c15}
.ai-compose>.icon-button:hover{background:#536b48}
.drop-targets{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:20px;align-items:center}
.drop-targets[hidden]{display:none}
.drop-target{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;transition:transform 180ms,box-shadow 180ms}
.drop-target.drop-hot{transform:scale(1.2);box-shadow:0 0 0 8px #dae5dc70,inset 0 1px 0 white,0 8px 25px #465c4833}
.drag-ghost{position:fixed;left:0;top:0;width:244px;pointer-events:none;z-index:200;border-radius:17px;border:1px solid #fff;background:#fafbf7ed;box-shadow:0 20px 55px #27372d35;display:flex;align-items:center;padding:10px;gap:12px;-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);transform:rotate(-3deg);will-change:left,top}
.drag-ghost img{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.drag-ghost .ghost-icon{width:44px;height:50px;display:grid;place-items:center;flex:0 0 auto;background:#ecf0e7;border-radius:10px}

.drag-ghost .drag-count{position:absolute;right:-7px;top:-7px;border-radius:50%;background:#394b3b;color:#fff;width:23px;height:23px;display:grid;place-items:center;font-size:10px}

.material-sample .glass{border-radius:24px;display:flex;padding:4px}

}

 const p=Math.max(0,Math.min(1,Number(progress)||0)),c=50.265;
 return `<span class="progress-ring" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="2"/><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 10 10)"/></svg></span>`;
}

/* module: src/services/feed-policy.js */
/** Pure feed policy. Clock and item state are supplied by the caller. */
const FeedPolicy = {
 sorts:['priority','unread','time'],
 cooldown:60000,
 supports(c){return ['reminder','event','task'].includes(c.type);},
 trigger(c,s={}){
   if(s.snoozedUntil>0)return s.snoozedUntil;
   if(c.type==='event')return Number(c.start)-15*60000;
   if(c.type==='task')return Number(c.due)-30*60000;
   return c.type==='reminder'?Number(c.due):NaN;
 },
 key(c,s={}){return `${c.id}:${this.trigger(c,s)}`;},
 completed(c,s={}){
   if(s.reminderDone)return true;
   return c.type==='task'&&c.tasks?.length>0&&c.tasks.every(t=>s.taskDone?s.taskDone.includes(t.id):t.done);
 },
 eligible(c,s,now){
   const at=this.trigger(c,s);
   return this.supports(c)&&Number.isFinite(at)&&at>0&&at<=now&&
     !s.dismissed&&!this.completed(c,s)&&!(c.type==='event'&&c.end<=now)&&
     s.lastReminderKey!==this.key(c,s)&&(!s.lastNotifiedAt||now-s.lastNotifiedAt>=this.cooldown);
 },
 visible(c,s,status='all'){
   if(status==='snoozed')return s.snoozedUntil>0&&!s.dismissed&&!s.reminderDone;
   if(status==='dismissed')return !!s.dismissed;
   if(status==='done')return !!s.reminderDone;
   return !s.snoozedUntil&&!s.dismissed&&!s.reminderDone;
 },
 score(c,s,now){
   if(s.dismissed||this.completed(c,s))return -1;
   const at=this.trigger(c,s);
   const urgent=Number.isFinite(at)&&at<=now&&!(c.type==='event'&&c.end<=now);
   return (urgent?100:0)+Math.max(0,Math.min(10,Number(c.priority)||0));
 },
 sort(cards,mode,items,now){
   const unique=[...new Map(cards.map(c=>[c.id,c])).values()];
   return unique.map((c,index)=>({c,index})).sort((a,b)=>{
     const x=items[a.c.id]||{},y=items[b.c.id]||{};
     if(mode==='time')return (b.c.time||0)-(a.c.time||0)||a.index-b.index;
     if(mode==='unread')return Number(!!x.read)-Number(!!y.read)||a.index-b.index;
     return this.score(b.c,y,now)-this.score(a.c,x,now)||a.index-b.index;
   }).map(x=>x.c);
 },
 label(c,s,now){
   if(s.dismissed)return '已忽略提醒';
   if(s.reminderDone)return '提醒已完成';
   const at=s.snoozedUntil||c.due;
   if(!Number.isFinite(at))return c.meta||'提醒';
   const minutes=Math.ceil((at-now)/60000);
   return minutes>0?`${minutes} 分钟后${s.snoozedUntil?' · 已延后':''}`:s.snoozedUntil?'已到期 · 等待查看':'现在可以处理';
 }
};

/* module: src/data/store.js */
/** Browser-local demo state. v2 keeps v1 reading flags and adds reminder lifecycle. */
const Store = {
 key:'quiet-glass-v1', // Keep the original key so existing users migrate in place.
 state:{cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true},
 load(){
   this.state={cards:[],items:{},seconds:0,demoStartedAt:demoBase,freshIds:[],preferences:{reduceTransparency:false,sort:'priority'},storageAvailable:true};
   let raw=null;
   try{raw=JSON.parse(localStorage.getItem(this.key)||'null');}
   catch{this.state.storageAvailable=false;}
   const valid=raw&&[1,2].includes(raw.version)&&raw.items&&typeof raw.items==='object'&&!Array.isArray(raw.items);
   if(valid){
     if(Number.isFinite(raw.demoStartedAt)&&raw.demoStartedAt>0)this.state.demoStartedAt=raw.demoStartedAt;
     this.state.freshIds=Array.isArray(raw.freshIds)?[...new Set(raw.freshIds.filter(id=>FreshCards.some(c=>c.id===id)))]:[];
     this.state.seconds=Math.max(0,Math.min(1e7,Number(raw.seconds)||0));
     this.state.preferences.reduceTransparency=!!raw.reduceTransparency;
     this.state.preferences.sort=FeedPolicy.sorts.includes(raw.sort)?raw.sort:'priority';
   }
   const offset=this.state.demoStartedAt-demoBase;
   this.state.cards=[...this.state.freshIds.map(id=>FreshCards.find(c=>c.id===id)),...SeedCards].map(c=>{
     const card={...c,tasks:c.tasks?.map(t=>({...t}))};
     for(const key of ['time','start','end','due'])if(Number.isFinite(card[key]))card[key]+=offset;
     return card;
   });
   if(valid){
     for(const c of this.state.cards){
       const x=raw.items[c.id];if(!x||typeof x!=='object'||Array.isArray(x))continue;
       const timestamp=n=>Number.isFinite(n)&&n>0&&n<8.64e15?n:0;
       this.state.items[c.id]={
         seen:!!x.seen,read:!!x.read,bookmarked:!!x.bookmarked,later:!!x.later,tagsEdited:!!x.tagsEdited,
         progress:Math.max(0,Math.min(1,Number(x.progress)||0)),
         note:typeof x.note==='string'?x.note.slice(0,4000):'',
         tags:Array.isArray(x.tags)?x.tags.filter(s=>typeof s==='string').map(s=>s.slice(0,30)).slice(0,20):[],
         taskDone:Array.isArray(x.taskDone)?x.taskDone.filter(s=>typeof s==='string'):undefined,
         addedAt:timestamp(x.addedAt),snoozedUntil:timestamp(x.snoozedUntil),dismissed:!!x.dismissed,reminderDone:!!x.reminderDone,
         lastReminderKey:typeof x.lastReminderKey==='string'?x.lastReminderKey.slice(0,200):'',
         lastNotifiedAt:timestamp(x.lastNotifiedAt)
       };
       if(this.state.freshIds.includes(c.id)&&this.state.items[c.id].addedAt)c.time=this.state.items[c.id].addedAt;
     }
   }
   this.save(); // Persist the demo clock even when there has been no interaction yet.
   return this.state;
 },
 item(id){
   if(!this.state.items[id])this.state.items[id]={seen:false,read:false,bookmarked:false,later:false,progress:0,note:'',tags:[],snoozedUntil:0,dismissed:false,reminderDone:false,lastReminderKey:'',lastNotifiedAt:0};
   return this.state.items[id];
 },
 card(id){return this.state.cards.find(c=>c.id===id);},
 patch(id,values){Object.assign(this.item(id),values);this.save();},
 tags(c){const s=this.item(c.id);return s.tagsEdited?[...s.tags]:[...new Set([...(c.tags||[]),...s.tags])];},
 tasks(c){
   const done=this.item(c.id).taskDone;
   return (c.tasks||[]).map(t=>({...t,done:done?done.includes(t.id):t.done}));
 },
 insert(cards){
   const known=new Set(this.state.cards.map(c=>c.id));
   const additions=cards.filter(c=>{if(known.has(c.id))return false;known.add(c.id);return true;});
   this.state.cards=[...additions,...this.state.cards];
   for(const c of additions)this.item(c.id).addedAt=c.time;
   this.state.freshIds=this.state.cards.filter(c=>FreshCards.some(f=>f.id===c.id)).map(c=>c.id);
   this.save();return additions.length;
 },
 save(){
   try{localStorage.setItem(this.key,JSON.stringify({version:2,items:this.state.items,seconds:this.state.seconds,demoStartedAt:this.state.demoStartedAt,freshIds:this.state.freshIds,sort:this.state.preferences.sort,reduceTransparency:this.state.preferences.reduceTransparency}));}
   catch{this.state.storageAvailable=false;}
 },
 stats(){
   return {read:this.state.cards.filter(c=>this.item(c.id).read).length,
     saved:this.state.cards.filter(c=>this.item(c.id).bookmarked).length,
     done:this.state.cards.filter(c=>c.type==='task'&&this.tasks(c).every(t=>t.done)).length};
 }
};

const MotionEngine={
 query:matchMedia('(prefers-reduced-motion: reduce)'),
 panelAnimations:new WeakMap(),
 layoutAnimations:new WeakMap(),
 returnLayers:new Set(),
 get reduced(){return this.query.matches;},
 animate(el,keyframes,options={}){
   if(!el||!el.animate)return null;
   if(this.reduced){
     const opacity=keyframes.map(k=>({opacity:k.opacity??1}));
     return el.animate(opacity,{duration:70,easing:'linear',...options,delay:0,duration:70});
   }
   return el.animate(keyframes,{duration:260,easing:'cubic-bezier(.2,.75,.25,1)',...options});
 },
 enter(el,delay=0){return this.animate(el,[{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:320,delay});},
 press(el){return this.animate(el,[{transform:'scale(1)'},{transform:'scale(.93)',offset:.35},{transform:'scale(1)'}],{duration:240});},
 capture(el){
   if(!el)return null;
   const rect=el.getBoundingClientRect();
   if(!rect.width||!rect.height||rect.bottom<0||rect.top>innerHeight)return null;
   const title=el.querySelector('[data-shared="title"]')||el.querySelector('.card-title-button,h2,h1');
   return {rect,title:title?.getBoundingClientRect(),radius:getComputedStyle(el).borderTopLeftRadius};
 },
 cancelPanel(el){
   (this.panelAnimations.get(el)||[]).forEach(animation=>animation?.cancel());
   this.panelAnimations.delete(el);
 },
 clearReturns(){
   this.returnLayers.forEach(layer=>{layer.getAnimations().forEach(a=>a.cancel());layer.remove();});
   this.returnLayers.clear();
 },
 openPanel(el,origin){
   this.cancelPanel(el);this.clearReturns();
   const r=el.getBoundingClientRect(),from=origin?.rect||origin;
   if(!from){this.panelAnimations.set(el,[this.enter(el)]);return;}
   // Move and reveal the surface, without scaling its text or controls.
   const x=from.left-r.left,y=from.top-r.top;
   const crop=`inset(0 ${Math.max(0,r.width-from.width)}px ${Math.max(0,r.height-from.height)}px 0 round ${origin.radius||'22px'})`;
   const title=el.querySelector('[data-shared="title"]'),titleRect=title?.getBoundingClientRect();
   const animations=[this.animate(el,[
     {opacity:.28,transform:`translate(${x}px,${y}px)`,clipPath:crop},
     {opacity:1,transform:'translate(0,0)',clipPath:`inset(0 0 0 0 round ${getComputedStyle(el).borderTopLeftRadius})`}
   ],{duration:320})];
   if(title&&origin.title){
     animations.push(this.animate(title,[
       {transform:`translate(${origin.title.left-titleRect.left-x}px,${origin.title.top-titleRect.top-y}px)`,opacity:.5},
       {transform:'translate(0,0)',opacity:1}
     ],{duration:320}));
   }
   this.panelAnimations.set(el,animations);
 },
 closePanel(el,origin){
   const from=el.getBoundingClientRect(),style=getComputedStyle(el);
   this.cancelPanel(el);this.clearReturns();
   if(this.reduced||!origin?.rect||!el.animate)return;
   // This inert surface can finish after dialog.close(); routing and focus never wait on animation.
   const surface=document.createElement('div'),to=origin.rect;
   surface.className='panel-return-surface';surface.setAttribute('aria-hidden','true');surface.inert=true;
   Object.assign(surface.style,{position:'fixed',left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',background:style.backgroundColor,border:'1px solid '+style.borderColor,borderRadius:style.borderTopLeftRadius,boxShadow:style.boxShadow,zIndex:'40',pointerEvents:'none'});
   document.body.appendChild(surface);this.returnLayers.add(surface);
   const animation=this.animate(surface,[
     {left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',opacity:.92,borderRadius:style.borderTopLeftRadius},
     {left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px',opacity:0,borderRadius:origin.radius||'22px'}
   ],{duration:230});
   const clean=()=>{surface.remove();this.returnLayers.delete(surface);};
   if(animation)animation.finished.then(clean,clean);else clean();
 },
 flip(el,oldRect){
   this.layoutAnimations.get(el)?.cancel();
   this.layoutAnimations.delete(el);
   const now=el.getBoundingClientRect(),x=oldRect.left-now.left,y=oldRect.top-now.top;
   if(Math.abs(x)+Math.abs(y)>1)this.layoutAnimations.set(el,this.animate(el,[{transform:`translate(${x}px,${y}px)`},{transform:'translate(0,0)'}],{duration:320}));
 },
 pulse(el){return this.animate(el,[{transform:'scale(1)'},{transform:'scale(1.08)',offset:.5},{transform:'scale(1)'}],{duration:350});}
};

/**
 * Adapter contract: respond({question, cards}) -> Promise<string>.
 * This adapter is intentionally local and deterministic. It never calls a model.
 * A production adapter belongs behind a server route with authentication, per-card
 * consent, size limits, cancellation, provenance and secret management.
 */
const DemoAI={
 async respond({question,cards}){
   await new Promise(r=>setTimeout(r,650));
   if(!cards.length)return '这是本地对话演示，还没有加入卡片。\n\n可以关闭这个浮层，提起一张卡片，放到右下角的玻璃入口；也可以点击卡片上的 AI 图标。内容会作为引用出现，不会自动发送。';
   const lines=cards.map((c,i)=>`${i+1}. 「${c.title.replace(/\n/g,'')}」\n${c.summary||c.body?.[0]||''}`);
   const taskLines=cards.filter(c=>c.type==='task').flatMap(c=>Store.tasks(c).filter(t=>!t.done).map(t=>`· ${t.text}`));
   return `已带入 ${cards.length} 张卡片。下面是前端根据演示数据整理的内容，不是模型分析：\n\n${lines.join('\n\n')}${taskLines.length?'\n\n待继续的事项：\n'+taskLines.join('\n'):''}\n\n你的问题：「${question}」\n真实推理与追问，需要接入后端 AI 服务。`;
 }
};

/* module: src/interactions/layout.js */
class FeedLayout{
 constructor(container){
   this.container=container;this.frame=0;
   this.onResize=()=>this.schedule(false);
   window.addEventListener('resize',this.onResize,{passive:true});
 }
 schedule(animate=false){
   cancelAnimationFrame(this.frame);
   this.frame=requestAnimationFrame(()=>this.layout(animate));
 }
 layout(animate=false){
   const el=this.container,width=el.clientWidth;
   const items=[...el.querySelectorAll(':scope > .feed-card,:scope > .lab-card')];
   if(!items.length){el.style.height='';return;}
   if(!width)return;
   // A single editorial card gives the feed a focal point. Span placement still
   // follows DOM order, so priorities and keyboard order retain their meaning.
   const cols=width>=1080?3:width>=650?2:1,gap=cols===1?16:20,w=(width-(cols-1)*gap)/cols;
   const old=animate?new Map(items.map(n=>[n,n.getBoundingClientRect()])):null;
   const feature=cols===3?items.slice(0,3).find(n=>n.matches('.type-article.form-image')):null;
   el.dataset.columns=cols;
   items.forEach(n=>{
     const featured=n===feature;
     n.classList.toggle('is-featured',featured);
     n.style.width=(featured?w*2+gap:w)+'px';
   });
   const heights=Array(cols).fill(0);
   items.forEach(n=>{
     const span=n===feature?2:1;
     let col=0,y=Infinity;
     for(let i=0;i<=cols-span;i++){
       const candidate=Math.max(...heights.slice(i,i+span));
       if(candidate<y){col=i;y=candidate;}
     }
     n.style.left=(col*(w+gap))+'px';n.style.top=y+'px';
     for(let i=col;i<col+span;i++)heights[i]=y+n.offsetHeight+gap;
   });
   el.style.height=(Math.max(...heights)-gap)+'px';
   if(old)items.forEach(n=>MotionEngine.flip(n,old.get(n)));
 }
}

   });

   },{passive:true});
   document.addEventListener('touchmove',e=>{
     const t=e.touches[0];if(!t)return;
     if(this.active){e.preventDefault();this.move(t.clientX,t.clientY);}
     else if(this.pending&&Math.hypot(t.clientX-this.pending.x,t.clientY-this.pending.y)>8){clearTimeout(this.timer);this.pending=null;}

 cleanup(){
   this.active?.hot?.classList.remove('drop-hot');document.body.classList.remove('is-dragging');
   document.querySelectorAll('.is-drag-source').forEach(n=>n.classList.remove('is-drag-source'));
   document.getElementById('drop-targets').hidden=true;
   this.active=null;this.pending=null;this.ghost=null;this.suppressUntil=Date.now()+400;

}

   const action=active?.dataset.action,extra=active?.dataset.extra;
   const liveToast=document.getElementById('toast');if(liveToast&&this.dialog.contains(liveToast))document.body.appendChild(liveToast);
   this.dialog.innerHTML=Panels.filter(this);
   if(searchFocused){const n=document.getElementById('filter-search');n.focus();try{n.setSelectionRange(pos,pos);}catch{}}
   if(!searchFocused&&action){[...this.dialog.querySelectorAll('[data-action]')].find(n=>n.dataset.action===action&&n.dataset.extra===extra)?.focus({preventScroll:true});}
   if(this.mode==='feed')this.renderCurrent(false);this.updateFilterIndicator();
 }
 input(e){
   const name=e.target.dataset.input;
   if(name==='search'){
     this.filter.query=e.target.value;
     document.getElementById('filter-result').textContent=`${this.filtered().length} 张卡片`;
     clearTimeout(this.searchTimer);this.searchTimer=setTimeout(()=>{if(this.mode==='feed')this.renderCurrent(false);this.updateFilterIndicator();},140);
   }else if(name==='lab-ring'){
     const value=Number(e.target.value)/100;
     document.getElementById('lab-rings').innerHTML=ring(value,24)+ring(value,36)+ring(value,52)+ring(value,22);
   }
 }
 key(e){
   const menu=e.target.closest?.('.card-more-menu');
   if(menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
     const items=[...menu.querySelectorAll('button')],index=items.indexOf(document.activeElement);
     const next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
     e.preventDefault();items[next]?.focus();return;
   }
   if(e.key==='Escape'&&this.grid.querySelector('.card-more-menu')){e.preventDefault();this.closeMore(true);return;}
   if(e.key==='Tab'&&this.dialog.open){
     const focusable=[...this.dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),a[href],[tabindex="0"]')].filter(n=>n.getClientRects().length&&getComputedStyle(n).visibility!=='hidden');
     const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
     if(first&&last){
       if(e.shiftKey&&(active===first||!focusable.includes(active))){e.preventDefault();last.focus();return;}
       if(!e.shiftKey&&active===last){e.preventDefault();first.focus();return;}
     }
   }
   if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();this.openPanel('filter');return;}
   if(e.isComposing)return;
   if(e.target.id==='ai-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.sendAI();return;}
   if(e.target.id==='tag-new'&&e.key==='Enter'){e.preventDefault();this.action('add-tag',this.editId);return;}
   if(e.key==='Escape'&&!this.dialog.open){if(!document.getElementById('ai-panel').hidden)this.closeAI();this.hideDock();return;}
   if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();this.navigate('#card/'+e.target.dataset.card);}
 }
}

/* module: src/index.js */
const app = new AppController();
app.init();
})();</script>
